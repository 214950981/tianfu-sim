changes:
  - id: C1
    file: packages/wechat-shell/src/index.ts
    kind: feature
    detail: >-
      Adds WeChatRunController plus the injected WeChat storage boundary. The controller exposes load(),
      restore(), view(), submission(), pageModel(), openArchive(), closeArchive(), submit(intent),
      reconfirm(intent) and retry(). Intents are named the way the projection names them
      (coreAction/specialAction/interactionOption) and are resolved against the CURRENT authoritative
      ViewModel every time, so a reconfirmation after STATE_CONFLICT is automatically re-derived from the
      latest state. `createWeChatPlatformStorage(api)` binds an injected {getStorageSync,setStorageSync}
      to the platform-neutral PlatformStorage port; the package references no platform global (asserted on
      comment-stripped source). pageModel() feeds the accepted buildWeChatPageShell a corrected
      interaction state (see C5). Fails closed: an intent the server has not projected, has projected as
      disabled/unavailable, an option the current interaction does not offer, or an interaction whose
      authoritative eventId was not published all raise IntentUnavailableError and send nothing.
  - id: C2
    file: server/src/viewmodel.ts
    kind: fix
    detail: >-
      eventInteraction() now projects `eventId: current.eventId` - the authoritative public id of the run's
      current event - alongside the existing `interactionId`. This is what makes the contract's own
      CHOOSE_EVENT_OPTION command constructible from the public ViewModel. It is an additive optional
      field; nothing else in the projection changed, no rule state is read or exposed, and the projection
      still resolves nothing.
  - id: C3
    file: packages/platform-contract/src/index.ts
    kind: type
    detail: >-
      CurrentInteraction gains the optional `eventId?: string` with a doc comment stating that it is the
      authoritative current-event id, that it carries no rule state, and that it is absent for
      destinyOffer. Existing consumers are unaffected because the field is optional.
  - id: C4
    file: docs/UI03_LIVE_CONTROLLER.md
    kind: docs
    detail: >-
      New task-required document: what the controller owns and what it refuses to own, the intent
      vocabulary and its fail-closed conditions, why the authoritative eventId had to be published, how
      the submission semantics stay single-owned, how LIFE_ARCHIVE and back protection behave, the
      three injected integration seams for an eventual real WeChat transport, and what explicitly remains
      UI04 work. It states that the production transport is not wired.
  - id: C5
    file: packages/wechat-shell/src/index.ts
    kind: fix
    detail: >-
      `#effectiveInteractionState`: the surface must act on the state of the *authoritative interaction*,
      not on the state of the last settled command. CommandSubmissionController reports "confirmed" after a
      command lands, but the refreshed ViewModel already carries the NEXT interaction; projecting
      "confirmed" onto it would hand the player an ordinary back out of a fresh, unresolved EVENT, which
      the page-state contract forbids ("an unresolved EVENT cannot be escaped through ordinary back
      navigation"). Client-side in-flight/failure states (submitting / retryableError / fatalError) are
      still reported verbatim. This is a controller-local correction: buildWeChatPageShell and
      canOrdinaryBack are untouched, and tests/ui03.test.mjs pins the corrected behaviour.
  - id: C6
    file: tests/ui03.test.mjs
    kind: test
    detail: >-
      New 18-test dedicated suite (task-required). Every gameplay round trip runs through the real
      CommandGateway + GatewayApplicationTransport + ServerViewModelBuilder over an authoritative active
      run seeded by the real reducer, with the injected WeChat storage adapter on the persistence path.
      Covers the port seam, single-ownership of submission, the core-action -> EVENT -> choice -> refreshed
      RUN_HOME round trip, the fail-closed intent controls, the breakthrough round trip from a
      server-projected available state and its two refusal modes, SPECIAL_NODE parity with the EVENT
      boundary, back protection, the in-flight lock, transient retry, STATE_CONFLICT reconfirmation,
      read-only LIFE_ARCHIVE, the storage adapter, the client-model secret boundary, the docs, the
      registration and the route scope.
  - id: C7
    file: package.json
    kind: tooling
    detail: >-
      Registers the dedicated suite: a `test:ui03` script plus tests/ui03.test.mjs appended to the frozen
      aggregate `npm test` list. No dependency, version or other script changed.
