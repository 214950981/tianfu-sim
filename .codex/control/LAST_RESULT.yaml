p6Mechanism:
  verdict: UNREACHABLE_BY_PRECEDENCE_SHADOWING
  measuredOn: 360 runs / 5205 action-driven nodes of the real reducer + real selectDirectorEvent, interrogating each tier on the same state
  tierPopulated: { P4: 1822, P5: 5205, P6: 5205 }
  tierEmpty: { P4: 3383, P5: 0, P6: 0 }
  realCallReturned: { P4: 1822, P5: 3383, P6: 0 }
  p4EmptyNodesWhereP5HadCandidate: 3383
  p4EmptyNodesWhereP5WasEmpty: 0
  exclusionReasonsAtRealCallSite: { event-ineligible: 3235, core-npc-repeat-gate: 1564, major-gap: 442, danger-gap: 485 }
  precedenceRule: selectDirectorEvent iterates the slot list in strict order and RETURNS at the first slot with >=1 eligible candidate; reducer.ts:299 offers [P4,P5,P6]; therefore P6 requires P4 empty AND P5 empty at the same node.
  indexSlices: { p5IndexSlot: contextual, p6IndexSlot: ordinary, contextualEvents: 12, ordinaryEvents: 12, overlap: 0, disjoint: true }
  eligibility: scoreDirectorEvent returns eligible = (weight > 0); baseWeightDefault = 100; P5 is blocked only by major-gap or danger-gap, and is populated at 100% of action nodes.
  conclusion: the P6 ordinary fallback is effectively dead code on CONTENT01 v1 under the accepted LOOPFIX02B3 rules; this is a strict-precedence-ordering consequence, not statistical scarcity.
resolutionOptions:
  - id: OPT-A
    summary: Reorder P6 ahead of P5 at some nodes, or demote the P5 contextual tier.
    blockedBy: SIM02 forbiddenScope entry Director-precedence-changes.
  - id: OPT-B
    summary: Add a P5-side gap/throttle gate that can leave the P5 tier empty so the P6 ordinary fallback can be reached.
    blockedBy: SIM02 forbiddenScope entries Director-precedence-changes and Director-weight-formula-changes.
  - id: OPT-C
    summary: Move part of the CONTENT01 event set from the 'contextual' index slice to the 'ordinary' slice so the two pools are not both always populated.
    blockedBy: SIM02 forbiddenScope entries gameplay-balance-tuning and CONTENT01-cooldown-rebalance. Requires a content task, not SIM02.
  recommendation: OPT-B or OPT-C in a dedicated LOOPFIX/DIRECTOR task after controller review. OPT-C is the least invasive to Director semantics because it leaves precedence and weights untouched and only changes which index slice owns which content events.
