    the next action is reachable. Then open 生平录 and confirm the chosen option is named, and let the run
    end to confirm ENDING names a cause and LIFE_BOOK lists the same events.
  - >-
    The 11/4/2 observation from stage A is still not reproduced from a real live run. What was reproduced
    and fixed is the mechanism that made such a mismatch possible: two different count definitions reaching
    three screens. A derived fixture proves the screens now agree; the original live run is not available.
  - >-
    The `package.json` diff is one added line (`test:playux01b`). The playux01:* probe scripts were added by
    the first pass. `.gitignore` was changed by the first pass (a `.playux01/` entry for the local probe
    scratch directory) and is unchanged in this pass.

toolingObservations:
  - >-
    A derived artifact committed alongside its sources must be regenerated by the same commit that changes
    those sources. The first pass changed packages/core, packages/content and server and left
    cloudfunctions/tianfu2/runtime stale, which silently turned tests/ui04d.test.mjs red without anyone
    running it. If a task changes a source tree, run every artifact freshness gate for it before reporting.
  - >-
    When a receipt is persisted and later compared field for field, an `undefined` value and an absent key
    are not the same thing: JSON drops the former. Build such records with conditional keys only.
  - >-
    A numeric literal that contradicts its own comment is a bug in the test, not in the product.
    PLAYUX01-008 excluded OUTCOME_TIME_DELTA while its comment said a time cost counts, which is why the
    Controller's B3 time-only settlements failed it.
  - >-
    Two scope pins can disagree with each other once sources move: "this tree is byte-identical to an older
    base" and "this artifact is a fresh generation of the current sources" cannot both hold after any
    source change. Recognise that as a conflicted pair rather than treating either red suite as a regression.

