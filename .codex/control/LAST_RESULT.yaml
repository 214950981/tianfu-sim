harnessCorrections:
  - >-
    第一版装置未走「选择灵根」开局（START_RUN 缺 selectionId），导致 innateProfile 为 undefined，
    applyRetreatProgression 直接返回、闭关收益恒为 0，得到「18/18 从未达到 10000 修为」的假结论。
    改用生产路径 generateServerDestinyOffer + selectionId 后结论完全改变。这是我的方法错误，已更正并记录。
  - >-
    第一版突破策略为「失败立刻再试」。由于失败同时扣修为与根基（progression.ts:82-85），
    构成死亡螺旋，得到「60 次尝试 0 成功」的假象。改为合同要求的「失败先补闭关重建根基」后，
    突破可以成功（28 次尝试 12 次成功）。同样是我的方法错误，未记入游戏缺陷。

