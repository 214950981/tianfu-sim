summary: >-
  UI02COPY is the final player-facing copy pass before the deferred full regression. It is a UI_FAST_LANE
  presentation-only cleanup: it removes the raw implementation identifiers that were still reaching the
  player in the otherwise visually accepted UI02ENTRY preview, and it changes no gameplay rule, no server
  projection, no Core/Content source, no Director behaviour and no route.

  Defect 1 — raw content keys. The accepted content pack stores every narrative key (titleKey / bodyKey /
  labelKey / summaryKey) as an opaque string and the repository has no locale table, so the 2.0 preview
  echoed the key itself onto the screen: dev.first-choice.title, dev.first-choice.body,
  dev.first-choice.continue, dev.first-choice.test-fortune, dev.first-choice.rescue-stranger,
  dev.first-choice.face-combat-risk, dev.first-choice.study-sword (EVENT), dev.ordinary-fallback.*
  (SPECIAL_NODE) and build.fact.BUILD_STAGE_TRANSITION.title/.summary plus dev.first-choice.history and
  dev.rescue-echo-a.* (LIFE_ARCHIVE). The page now carries a bounded zh-CN presentation catalog,
  CONTENT_COPY, covering exactly the public narrative keys the committed fixtures reach, and routes the
  two decision surfaces (scene title, body, every option label) and the archive history (title, summary)
  through it. It is bounded in both directions: tests/ui02copy.test.mjs derives the reachable key set
  from the committed fixtures themselves and asserts set equality with the catalog, so a missing entry
  (a raw key would render) and an invented entry (copy for content that does not exist) both fail. An
  unmapped future key still falls back verbatim through the existing presentLabel semantics, so a future
  content pack fails VISIBLY instead of silently inheriting a wrong label or a silently invented meaning.
  The catalog copy describes only what the fixture's own ids already mean — continue -> 就此前行,
  rescue-stranger -> 出手相救, study-sword -> 参研剑术, the rescue cause's echo -> 昔日相救 — and a test
  asserts it contains no capability vocabulary, no per-run fixture value, and no reward / benefit /
  probability / success-rate / weight wording. Option ids, riskPresentation (tier, canBeFatal, reasons),
  the submission and locking semantics and the public history data are all asserted unchanged.

  Defect 2 — internal capability names. MODE_SELECT's unavailable helper text named the implementation enum
  (能力未开通 · DailyChallengeCapability / · CommerceCapability). The rendered helper is now the
  player-facing gateLabel (暂未开放). Because the accepted tests/ui02entry.test.mjs pins gateNote to
  contain the capability name ("a disabled entry must name the missing capability") and the dispatch
  requires that suite to remain green, the internal diagnostic is RETAINED on gateNote but is no longer
  bound anywhere in the markup; tests/ui02copy.test.mjs asserts the product surface contains zero
  occurrences of gateNote and that the rendered field carries no capability name. The markup-derived
  guard therefore proves the diagnostic is structurally unreachable from the screen rather than asking a
  reviewer to take it on trust.

  Defect 3 — no explicit guard existed for this defect class. tests/ui02copy.test.mjs adds one: it derives
  the checked bindings FROM the committed WXML (parses every {{ }}, drops attribute bindings and
  comparison operands, expands item.* through its wx:for list, and fails closed if a nested wx:for would
  break the list attribution), then resolves those bindings against the real present() output for EVERY
  committed fixture and asserts no rendered string is a dot-separated content key or a Capability enum
  name. Because the binding set comes from the markup, adding or renaming a binding cannot make the guard
  stale, and four negative controls prove it is not vacuous (raw option label, raw history summary,
  gateNote rebound into the markup, emptied catalog).

  Nothing else moved. The controlled fixture, the fixture generator, the layout audit, the WXSS compat
  audit and every accepted test file are byte-identical to the base; ui02entry.test.mjs stayed green
  WITHOUT modification, which is the evidence that the accepted UI02ENTRY contract was honoured rather
  than relaxed.

