recommendedCommitMessage: |-
  feat(ui02copy): clear raw content keys and capability names from the 2.0 preview

  Presentation-only UI_FAST_LANE copy pass, the last one before the deferred full
  regression. It removes the developer identifiers that were still reaching the
  player in the visually accepted UI02ENTRY preview and changes no gameplay rule,
  no server projection, no Core/Content source, no route and no layout contract.

  Raw content keys:
  - the accepted content pack stores titleKey/bodyKey/labelKey/summaryKey as opaque
    strings and the repository has no locale table, so the preview echoed the keys
    themselves (dev.first-choice.title, dev.first-choice.body,
    dev.first-choice.continue, build.fact.BUILD_STAGE_TRANSITION.summary, ...).
  - the page now carries a bounded zh-CN presentation catalog (CONTENT_COPY) and
    routes the two decision surfaces (scene title, body, every option label) and
    the LIFE_ARCHIVE history (title, summary) through it.
  - the catalog is pinned by set equality against the narrative keys derived from
    the committed fixtures, so a missing entry and an invented one both fail. An
    unmapped future key still falls back verbatim, i.e. fails visibly instead of
    inventing copy. Option ids, riskPresentation, locking semantics and the public
    history data are asserted unchanged.

  Internal capability names:
  - MODE_SELECT rendered DailyChallengeCapability / CommerceCapability in its
    unavailable helper text. The screen now shows the player-facing 暂未开放.
  - the accepted ui02entry assertion pins the capability name onto gateNote, so the
    internal diagnostic is retained there but is no longer bound anywhere in the
    markup; the new suite asserts the product surface contains zero occurrences of
    gateNote, proving it cannot leak back onto the screen.

  Guard: the new suite derives the checked bindings FROM the committed WXML (drops
  attribute bindings and comparison operands, expands item.* through its wx:for
  list, fails closed on a nested wx:for) and asserts that no string rendered for any
  committed fixture is a dot-separated content key or a Capability enum name. Four
  negative controls prove it is not vacuous.

  Scope: stylesheet, fixture generator, both controlled fixture artifacts and both
  audit tools are byte-identical to the base, and NO accepted test file was edited —
  ui02entry.test.mjs stayed green unmodified. New tests/ui02copy.test.mjs (11 tests)
  is registered as test:ui02copy; the aggregate npm test list was left untouched
  because the full regression is deferred.

  Fast lane: ui02copy 11/11, ui02entry 20/20, ui02r2a2 15/15, ui02r2 15/15,
  ui02r1 32/32, ui02 18/18, viewmodel-ui 6/6, layout audit 143/143, wxss compat
  14/14, fixture freshness green, tsc 5.9.3 clean. Full npm regression deliberately
  deferred until after human visual acceptance and before the final UI02 merge.

  Manual visual QA in DevTools is required and is recorded as not performed;
  UI03 stays blocked.
