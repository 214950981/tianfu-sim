toolingObservations:
  - topic: When git cannot reach github.com, a remote commit can be reconstructed exactly from the REST API
    observation: >-
      This session's proxy blocked git's TLS handshake to github.com (11 straight 502s on ls-remote, and
      http.sslBackend=openssl did not help) while curl reached api.github.com and raw.githubusercontent.com
      normally. "ls-remote" eventually succeeded on attempt 18, but no fetch or clone was possible for a long
      time. The remote commit can still be obtained byte-exactly: read the commit object from
      /repos/<owner>/<repo>/commits/<sha> (tree SHA, parent, author/committer name+email+epoch), read
      /compare/<base>...<head> for the changed file list, fetch each file's bytes, apply them over a
      "git read-tree -u --reset <parent>" checkout, then confirm with "git write-tree".
    evidence: >-
      write-tree returned 0fea66a8e920511f9dc0974cd73db1c62d68428d, identical to the API's tree SHA. The
      commit object was then rebuilt by hand and "git hash-object -t commit -w" produced
      9c1d57504910ec913be542a0e1802a994a9afb8e - the dispatch SHA - after several candidate encodings were
      tried (the only variables were the trailing newline on the message and the timezone, "+0000").
    impact: >-
      A blocked git transport no longer has to stall a dispatch-driven task, and real-ancestry history is
      still achievable.
    workaround: >-
      Node cannot spawn git in this sandbox (documented EBUSY), so generate candidate commit objects to
      files with Node and hash them from the shell with "git hash-object -t commit <file>". Keep retrying
      ls-remote in the background in parallel: it is still the authoritative confirmation.
  - topic: JSON.stringify(value, Object.keys(value).sort()) is not a canonical form
    observation: >-
      The second argument to JSON.stringify is a property allow-list, not a sort order, and it applies at
      every nesting level. Passing a top-level key list therefore silently drops all nested keys, so two
      different tabBar objects compared EQUAL.
    evidence: >-
      tools/route-guard.mjs's "tabBar changed" negative control was green for the wrong reason - it reported
      no violation for a mutated tabBar - until the comparator was made recursive. The suite caught it
      because the control asserts the audit can fail.
    impact: >-
      Any future "is this config unchanged" check that uses this shortcut is a fake gate.
    workaround: >-
      Write an explicitly recursive canonicaliser (arrays in order, object keys sorted) - implemented as
      stable() in tools/route-guard.mjs.
  - topic: .codex/context.mjs rejects the fast-lane task field
    observation: >-
      "node .codex/context.mjs UI04C" fails with "MALFORMED_TASK: .codex/tasks/UI04C.yaml:4 unknown field
      verificationProfile". The loader's schema predates verificationProfile, so no task that uses the new
      profile can be loaded through it.
    impact: >-
      Every fast-lane task will hit this until the loader's allow-list grows. It is not a blocker (the task
      file and its contracts can be read directly), but it must be disclosed rather than silently skipped.
    workaround: >-
      Read .codex/tasks/<id>.yaml and the required contracts directly from the reconstructed commit, as this
      task did. Adding verificationProfile to the loader's known fields is a one-line tooling fix if the
      controller wants it.
  - topic: A route guard must not hold accepted legacy 1.0 pages to the 2.0 file contract
    observation: >-
      miniprogram/pages/game has no game.js (only game.wxml and game_data.js) and is still registered, so
      "every registered page must have a .js" fails on an accepted tree that is explicitly out of scope.
    impact: >-
      A naively written route guard reports a pre-existing legacy condition as a violation and blocks every
      later route change.
    workaround: >-
      Require .wxml for every registered page and .js only for the pages this project owns (pages/v2-*) -
      implemented in tools/route-guard.mjs, with the reason recorded in the check's comment.

