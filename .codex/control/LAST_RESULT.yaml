recommendedCommitMessage: |-
  feat(ui02r1): make the 2.0 preview RUN_HOME a one-screen responsive surface

  Presentation-only repair of the accepted UI02 preview. No rule, contract, server,
  shell, controller, Core/Content, legacy 1.0 or route change.

  - One-screen is structural: disableScroll true, page height/overflow lock, 100vh
    constrained flex root, min-height:0 on every flexible layer. RUN_HOME cannot
    page-scroll; every vertical scroll happens inside an explicit scroll-view.
  - RUN_HOME restructured to four layers: identity/lifespan header, core cultivation
    status, at most three public attention summaries plus one condition row, bottom
    action dock with exactly four core actions and a breakthrough CTA gated on the
    server-projected availability (unavailable = one compact line, no reserved block).
  - Full public Build / Cause / People / condition lists move into four read-only
    drawers. Summarising is never a dead end and never mutates gameplay.
  - EVENT / SPECIAL_NODE share one full-screen container: pinned head plus a bounded
    scroll-view for narrative and options.
  - LIFE_ARCHIVE scrolls only inside its own viewport.
  - Dev tabs, lastIntent, decisionId, interaction state, the blocked-back probe and
    capability diagnostics move into a collapsed floating dev overlay outside the
    product flow; detail drawers are fixed bottom sheets with bounded scroll.
  - Explicit viewport contract: baseline 320x500 and the 320x500 / 360x560 / 375x603 /
    390x750 / 414x820 / 430x850 matrix as wxss width/height bands, safe-area
    reservations on dock and decision controls, no font below 20rpx, core action
    targets 44.37 CSS px at width 320, and clamping for every dynamic public string.
  - tools/ui02r1-layout-audit.mjs re-derives the first-screen budget from the WXSS and
    reports it per matrix viewport; tests/ui02r1.test.mjs proves the audit green and
    non-vacuous with fourteen negative controls, and pins base-tree digests so every
    out-of-scope tree is provably byte-equivalent to the task base.

  Verification: 299/299 npm test (was 282), 17/17 ui02r1, 18/18 ui02, 6/6
  viewmodel-ui, layout audit 96/96, typecheck/lint/content-lint/content01-lint/
  secret-scan green. Manual visual QA on the viewport matrix is still required and is
  documented as not performed.
