disclosedScopeNotes:
  - id: D1
    severity: INFO
    title: one public client-model field was added, and this is the reason it was unavoidable
    detail: >-
      CHOOSE_EVENT_OPTION is keyed by eventId; the public ViewModel exposed only interactionId, which is an
      instance identity (`event:<commandId>:<eventId>` in a real run - verified by driving the real
      reducer and gateway, see the probe evidence below). The task explicitly requires an EVENT option
      mapping derived only from the authoritative currentInteraction and forbids fabricating eventId, and
      it explicitly requires a real-gateway event-choice round trip - both impossible without the server
      publishing the current event id. The alternative (silently reinterpreting interactionId as the event
      id) was rejected: it would have repurposed an accepted field, broken an accepted UI02 assertion and
      an accepted key-set pin, and still left instance identity unavailable.
    probeEvidence: >-
      A throwaway script ran START_RUN then CHOOSE_ACTION cultivate through the real server stack. It
      printed events.current =
      {"eventId":"dev.first-choice","kind":"choice","instanceId":"event:cmd:probe-cultivate-1:dev.first-choice","participantBindings":{}}
      and currentInteraction.interactionId = that same instanceId - i.e. interactionId != eventId in the
      only path that matters.
  - id: D2
    severity: INFO
    title: an accepted UI02R1 digest pin was updated on purpose, four times
    detail: >-
      tests/ui02r1.test.mjs pins the task base byte-equivalence of several trees, and its own comment
      permits a later task to update a digest deliberately. Exactly four digests moved
      (packages/wechat-shell/src, packages/platform-contract/src, server/src, v2-fixtures.json) and no
      pinned file list changed. The other ten pinned entries - including packages/core/src,
      packages/content/src, packages/application-ui/src, the 1.0 pages, app.json, app.wxss and
      tools/ui02-preview-fixtures.mjs - are untouched, which the same test still proves. The UI02FINAL
      controller note that "a later task that is legitimately allowed to change one of these trees must
      update the digest on purpose" is exactly what happened.
  - id: D3
    severity: INFO
    title: the preview fixture and its JS sibling were regenerated, with zero generator or page edits
    detail: >-
      tools/ui02-preview-fixtures.mjs and miniprogram/pages/v2-preview/v2-preview.js were NOT modified.
      The fixture is a projection of the real production chain, so it necessarily changed once the
      projection changed; both writers were simply re-run. A digest pin on tools/ui02-preview-fixtures.mjs
      in tests/ui02r1.test.mjs stayed green, which is the evidence that the generator itself is untouched.
  - id: D4
