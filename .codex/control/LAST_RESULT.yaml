    what: Regenerated from the source catalog after the wording changes (329 keys).
  - file: cloudfunctions/tianfu2/runtime/*
    what: >-
      Regenerated. These are derived artifacts of packages/core, packages/content and server; the sources
      changed, so a committed artifact that disagreed with them would be a cloud runtime nobody reviewed.
