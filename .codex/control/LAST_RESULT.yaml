summary: >-
  UI04B makes the accepted UI03/UI04A client-safe controller physically loadable by the WeChat packager
  without creating a second implementation of anything.

  PROBLEM. project.config.json sets miniprogramRoot to miniprogram/, while the accepted client runtime
  lives outside that root in TypeScript packages. "Node can import the source path" is not the same claim
  as "the WeChat packager can load it": the packager reads the files under miniprogramRoot as JavaScript,
  resolves require("./x.js") by static analysis, and cannot execute TypeScript.

  SOLUTION. A deterministic, repository-local generator (tools/ui04b-wechat-runtime-artifact.mjs) derives
  four committed CommonJS files under miniprogram/runtime/ from the three accepted client-safe source
  modules: command-wire.js, application-ui.js, wechat-shell.js, and the bounded facade index.js. The
  transform is: normalise newlines to LF; erase TypeScript type syntax with Node's BUILT-IN
  module.stripTypeScriptTypes (mode "strip"); rewrite the remaining ES module syntax to plain CommonJS
  (named import becomes var destructuring require, export becomes module.exports); prepend a header
  recording the source path and its sha256. No bundler, compiler or runtime dependency was added:
  devDependencies is still exactly the pinned typescript, there is no dependencies key, and no
  esbuild/webpack/rollup/vite config exists. The accepted packages remain the single source of truth;
  there is exactly ONE WeChatRunController, ONE CommandSubmissionController and ONE command codec in the
  repository, and the generated files are byte-derivable from them.

  BOUNDED SURFACE. miniprogram/runtime/index.js publishes exactly eight names, hard-coded in the
  generator's allow-list and re-asserted by an independent literal in the smoke: WeChatRunController,
  createWeChatPlatformStorage, CommandValidationError, APP_ERROR_CODES, SubmissionLockedError,
  RetryUnavailableError, IntentUnavailableError, ArchiveUnavailableError. WeChatRunController.pageModel()
  already returns the projected shell, core/special intents and archive view, so those builders need no
  facade entry. Widening the surface requires editing the allow-list, which fails both the audit and the
  dedicated suite - a reviewable act, not an import side effect.

  FAIL-CLOSED. An unsupported import form, an unsupported export form, a non-relative specifier (bare,
  "node:", any npm package), a specifier that resolves outside the pinned source modules (that is, a grown
  runtime closure), a leftover import/export statement, output that does not parse as JavaScript (checked
  with vm.Script, compile only), a non-literal require argument, a require outside the pinned sibling set,
  or a facade entry the source no longer exports - each one stops generation with a named diagnosis
  instead of emitting something loadable-but-wrong.

  DETERMINISM AND FRESHNESS. buildRuntimeArtifact() is a pure function of the source bytes: no timestamps,
  no absolute paths, no environment reads, no version stamps, fixed ordering, LF endings. Repeated
  generation is byte-identical, a CRLF checkout produces the same bytes, and --write is idempotent. Three
  complementary checks fail on drift: byte regeneration (npm run ui04b:artifact), the committed artifact
  audit (npm run ui04b:audit), and the load and behaviour smoke (npm run ui04b:smoke).

  GENERATED-ARTIFACT AUDIT. tools/ui04b-wechat-runtime-audit.mjs audits the COMMITTED bytes as an
  adversary rather than trusting the generator's own report: exact file set; every require argument a plain
  string literal pointing at a pinned sibling (the mechanical meaning of "no Node-only runtime dependency
  in miniprogram"); the real require graph walked from the facade must reach exactly the four pinned
  modules, so neither an unreachable module nor a hidden dependency can hide; comment-masked code must not
  reference packages/core, packages/content, server, cloudfunctions, wx.request, wx.cloud or a Node
  runtime global; comment-masked code must contain no TypeScript-only syntax; each module must record its
  pinned source path and that source's CURRENT sha256; and the facade's statically parsed published names
  (both the module.exports literal and any later module.exports.x assignment) must equal the allow-list.
  Content policy is scanned on code characters only, because the generated modules deliberately keep the
  accepted sources' doc comments and packages/command-wire documents packages/core precisely because that
  is the boundary it owns.

  NEGATIVE CONTROLS. tests/ui04b.test.mjs drives every audit check to failure with a real mutation: an
  injected gameplay-Core edge, an injected Content edge, an injected require("fs"),
  require("node:child_process"), a computed require argument, cut edges that make modules unreachable, an
  extra unreviewed file, a removed provenance line, a tampered provenance digest, injected "as const",
  injected "packages/core/" text, a grown facade and a shrunk facade. Every surgical mutation asserts its
  anchor exists first, so no control can pass because it silently changed nothing. The smoke has its own
  controls: a temp-dir copy of the artifact with a grown public surface must be visible to the surface
  assertion, require("fs") must be refused as a non-relative specifier, and a require that escapes the
  artifact directory must be refused.

  NODE COMMONJS SMOKE. tools/ui04b-wechat-runtime-smoke.mjs executes miniprogram/runtime/index.js in a
  fresh node:vm context as CommonJS, supplying exports/module/require and nothing else - no wx, tt, Page,
  Component, getApp, process, Buffer or setTimeout - so a successful load is itself the proof that loading
  this artifact neither needs a platform host nor runs server code. Eight checks pass, including a
  differential proof: over every committed public fixture entry, buildWeChatPageShell /
  mapCoreActionIntents / mapSpecialActionIntents / buildArchiveView / canOrdinaryBack return values deeply
  equal to the accepted TypeScript sources; the wire codec produces identical canonical bytes for four
  representative commands and identical error text and error class for eight malformed envelopes; and the
  generated controller drives load / pageModel / openArchive / closeArchive / submit identically to the
  TypeScript controller, handing its transport a byte-identical envelope with the same commandId. The
  transform also loses no export of any accepted module.

  PACKAGER SEAM - DELIBERATELY NOT USED. The task allows a side-effect-free static literal require from the
  v2-preview dev page only "if v2-preview is touched". It was not touched, because the accepted
  tools/ui02-preview-fixture-module.mjs checkFixtureRequire requires EXACTLY ONE require() call in
  miniprogram/pages/v2-preview/v2-preview.js and tests/ui02r1.test.mjs asserts checkFixtureRequire(ROOT).ok
  directly (tests/ui02entry.test.mjs also parses that file's require arguments), so adding a second require
  would mean weakening an accepted guard - out of this task's scope, and not how a guard should be made
  green. UI04B therefore delivers the three mechanical properties that "the packager can load it" actually
  means: the artifact is inside miniprogramRoot, it is CommonJS, and every dependency is a static string
  literal. A positive assertion locks the other direction too: no module under miniprogram/ outside
  runtime/ may reference the runtime, so UI04C's page wiring cannot happen silently.

  SCOPE. No page wiring, no wx.request, no 2.0 wx.cloud.callFunction, no cloud persistence, no
  cloudfunction deployment, no default-route change, no legacy 1.0 page change, no UI04C work, no ending
  orchestration, and no Core, Content, Director, Cause, Progression, Risk, Build, NPC or server semantics
  change. miniprogram/pages/v2-preview/*, miniprogram/app.json and miniprogram/app.js are byte-identical to
  the task base. Source branch dev/tianfu-2.0 was not pushed and main was not touched.

