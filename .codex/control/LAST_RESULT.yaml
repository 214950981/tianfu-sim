disclosedScopeNotes:
  - >-
    MODE_SELECT keeps the internal capability diagnostic on gateNote. The accepted tests/ui02entry.test.mjs
    contains `assert.equal(mode.gateNote.includes(mode.capability), true, "a disabled entry must name the
    missing capability")` while this task's allowedScope requires that MODE_SELECT no longer expose
    capability enum names, and the dispatch also requires the UI02ENTRY suite to remain green. The two can
    only both hold if the enum leaves the SCREEN while the diagnostic stays in the view model, so the
    rendered helper was moved to a new player-facing gateLabel and gateNote was retained untouched but
    unbound. tests/ui02copy.test.mjs closes the loop structurally (zero occurrences of gateNote in the
    product surface, and the rendered field must not contain the capability name). If the controller would
    rather delete gateNote outright, the ui02entry assertion must be relaxed in the same change — that is a
    controller decision, so no test was edited here.
  - >-
    The copy catalog lives in the preview page, NOT in packages/content. The task forbids content-rule and
    balance changes and forbids content-pack edits, so the Chinese copy is a PRESENTATION table in the page,
    which is the same discipline the accepted UI02R2 label tables already follow. tests/ui02copy.test.mjs
    asserts the copy text does not appear in packages/content/dev-fixtures/minimal-pack.json.
  - >-
    Adding test:ui02copy to package.json without adding it to the aggregate `test` script is deliberate. The
    dispatch defers the full npm regression and this task must not run it; changing the frozen aggregate
    list is a merge-time decision and was left to the controller. The suite is still runnable by its
    documented command and is listed in docs/UI02_PREVIEW.md 6.1.
  - >-
    The EVENT scene body and the option labels are newly authored Chinese prose. No locale table exists in
    the repository (verified: the content pack stores these keys as opaque strings and no i18n table
    exists), so bounded presentation copy was the only mechanism available inside the task's scope. The copy
    is constrained to what each key already means, and a test forbids capability vocabulary, per-run fixture
    values and reward/benefit/probability wording. The controller should still confirm the wording reads
    correctly for the product.

toolingObservations:
  - id: T1
    severity: ENVIRONMENT
    inherited: true
    title: nested node process spawn fails with EBUSY in this sandbox
    evidence: >-
      execFileSync / spawnSync of process.execPath (and of git.exe by absolute path) returns status null with
      EBUSY in this worktree, so any tool that shells out cannot run from inside a Node script here. git,
      node and npx all work when invoked from the shell, which is how the base was verified and how the
      suites above were run. Does not affect the targeted fast-lane suites, which run in-process.
    impact: >-
      Unchanged from the UI02ENTRY report: the three nested-spawn tests in a full-suite run report EBUSY
      regardless of repository content. Judge them as environment noise.
  - id: T2
    severity: PROCESS
    inherited: true
    title: the agent network proxy is flaky and the sandbox can destroy git ref writes
    evidence: >-
      git ls-remote / fetch against origin intermittently fail through the proxy and succeed on retry (one
      40-attempt retry loop was needed). A git fetch whose refspec includes a branch checked out in another
      worktree fails outright ("refusing to fetch into branch ... checked out at ..."), so wb-UI02ENTRY had
      to be fetched on its own. No ref-write destruction was observed this run: the fetch ref and both
      rev-parse readbacks persisted, and the commit path stayed on object-only plumbing.
    impact: >-
      Informational; the work branch and the unchanged source branch were both verified with a retried
      ls-remote. Consistent with the runbook.
  - id: T3
    severity: TOOLING
    inherited: true
    title: no WXSS compiler exists in this repository
    evidence: >-
      tools/wxss-compat-audit.mjs is a curated subset check, and this task changed no WXSS at all, so the
      compiled stylesheet is exactly the already-reviewed base artefact.
    impact: >-
      Informational for this task. The copy pass adds no CSS, so the one remaining unproven claim (that the
      accepted stylesheet compiles and renders) is unchanged from UI02ENTRY.
  - id: T4
    severity: TOOLING
    title: the WXML text/binding scanner had to distinguish text bindings from attribute bindings
    evidence: >-
      A descendant element's attributes appear inside its ancestor's inner source, so a naive scan of
      element.inner treats data-intent="{{vm.runHome.breakthrough.intentId}}" (value
      "special.attemptBreakthrough") as rendered copy. The guard strips attribute bindings and comparison
      operands before collecting paths, and asserts no nested wx:for exists (which would break the one-list
      attribution it relies on).
    impact: >-
      Recorded so a future maintainer does not "simplify" the guard back into a false positive. A nested
      wx:for in the product surface will make the guard fail closed with an explicit message rather than
      silently mis-attribute a binding.

