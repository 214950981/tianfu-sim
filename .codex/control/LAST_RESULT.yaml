summary: >-
  UI04E completes the live terminal lifecycle ENDING -> LIFE_BOOK -> REBIRTH_RESULT -> NEXT_LIFE as a
  server-authoritative sidecar: a fourth cloud RPC `advanceTerminal`, exactly-once terminal transition
  receipts, deterministic NEXT_LIFE bootstrap rotation under the trusted OPENID-derived player, and the
  v2-live four-stage render — without touching canonical gameplay bytes.

  TERMINAL SIDECAR. StoredRun gains a `terminal?: TerminalSidecar` field (stage, version, transitions).
  The sidecar is the ONLY thing that mutates across an `advanceTerminal` settle. Contract test
  `UI04E_idempotency` proves this by `JSON.stringify`-comparing the pre- and post-transition state on
  every pure advance and asserting `ruleStateHash` byte-equality. The GameState contract is untouched
  (asserted in `UI04E_sidecar`); no terminalStage field appears on RunState.

  EXACTLY-ONCE. `terminalTransitionId` is the idempotency key. The flow checks the receipt BEFORE the
  stage-drift guard (so an exact retry after a post-commit timeout can land on a stage the client's
  expectedTerminalStage no longer reflects). `UI04E_flow` proves retry recovers the settled stage
  without advancing twice; `UI04E_flow` proves reused id with a different payload fails closed with
  `terminal.idempotency_conflict`. The platform's `PostCommitTimeoutError` is mapped to a typed
  TRANSIENT/retryable envelope by the live service; the next call's exactly-once path returns the
  recorded result. `UI04E_host` proves the full committed-host path across a simulated timeout.

  NEXT_LIFE. A REBIRTH_RESULT -> NEXT_LIFE settle mints a fresh `(nextBootstrapId, nextRunId)` pair
  under the trusted player, writes the bootstrap mapping, creates the offered RunState through the
  real `generateServerDestinyOffer` (so CONTENT01's progression.v1 innate-profile offers apply), and
  records `nextBootstrapId` / `nextRunId` on the receipt itself — so an exact retry after a lost
  response recovers them deterministically. The old run's terminal sidecar is bumped to NEXT_LIFE
  without touching its canonical gameplay state. `UI04E_flow` and `UI04E_host` prove the new life
  is a different document; the prior run remains immutable.

  VIEWMODEL. ServerViewModelBuilder gained `buildFromStoredRun` / `buildWithTerminal` which project
  `state.terminal` (stage + version + lifeBook + rebirthResult + nextLife) and force `pageState`
  to `ENDING` for a dying run with no sidecar yet — so the v2-live page never sees an empty
  SPECIAL_NODE dead-end. LIFE_BOOK only contains already-public facts (runName, age, maxAge, realm,
  builds count, people count, events count, causes count, ending/death). REBIRTH_RESULT adds the
  `nextLifeAffordance` flag. NEXT_LIFE adds the completed confirmation confirmation. `UI04E_projection`
  proves no hidden Causes, rootSeed, RNG state, drawIndex, etc. leak in any of the four stages.

  CLIENT. ApplicationTransport gains the fourth operation with a discriminated-union
  `AdvanceTerminalResult`. WeChatRunController gains `advanceTerminal` (refuses stale-stage advances via
  `TerminalUnavailableError`) and `startNextLife` (rotates `currentRunId` to the next life under the
  same `playerId`). v2-live renders the four stages distinctly and persists `nextBootstrapId` via
  `tianfu2:next-life-bootstrap-id`. The committed WeChat runtime artifact publishes
  `TerminalUnavailableError`. `UI04E_page` proves the page renders all four stages, never locally
  skips the authoritative stage order, and refuses a controller-level skip with a typed error.

  ARTIFACTS. `cloudfunctions/tianfu2/runtime/` gained `server-terminal-flow.js` (18641 bytes), the
  facade exports `TerminalFlowError` and `parseAdvanceTerminalRequest`, and the CloudBase store
  gained the 4th deterministic collection `tianfu2_terminal_transitions`. `miniprogram/runtime/`
  regenerated: facade still bounded, but `TerminalUnavailableError` added. No new dependency in
  the root package.json; `wx-server-sdk` stays confined to `cloudfunctions/tianfu2/package.json`.
  The transactional CloudBase path still addresses documents by deterministic id and never queries
  (asserted in `UI04E_artifact_scope`).

  WHAT UI04E DID NOT DO. No reducer change, no Director policy change, no RNG algorithm change, no
  Progression / Risk / Build balance change, no NPC rule change, no Content rebalance, no new
  meta-currency, no new rebirth-reward system, no daily challenge, no monetization, no raw OPENID
  leak, no client-trusted playerId, no default-route replacement, no 1.0 page change, no tabBar
  change, no real production deployment, no UI04FINAL, no source-branch push.

