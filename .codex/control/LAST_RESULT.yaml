summary: |
  The R1 candidate (fcb930b) was transplanted once onto c6dce60 by `git cherry-pick --no-commit`, with
  every `.workbuddy` path excluded, and the missing behavioural proof was added as
  `tests/ui04e-r2.test.mjs` — a page-level harness that drives the real `miniprogram/pages/v2-live`
  page against the real cloud host handler (`loadCloudFunction`) and the real fake CloudBase database.

  The proof is RED, and it is red for a real product defect, not for a harness artefact:
  `TianfuLiveService.createRunOffer` returns `builder.build(state)` and never passes the run's terminal
  sidecar to the projection. Bootstrapping onto an existing terminal run therefore projects
  `pageState: "ENDING"` with `state.terminal === undefined`, while `fetchView` on the SAME run projects
  `NEXT_LIFE` with the complete sidecar. v2-live bootstraps through `createRunOffer` and then calls
  `controller.restore()`, which does not re-fetch when an initial view was supplied — so a reload on a
  NEXT_LIFE run lands on ENDING, the "开启下一世" CTA is never rendered, and every subsequent
  `advanceTerminal` is rejected because the authoritative sidecar stage is NEXT_LIFE, not ENDING. The
  pending-bootstrap recovery path of UI04E-R1 is unreachable across a reload.

  The rest of the acceptance chain was proven GREEN against the same tree with the single difference of
  an explicit `controller.load()` after each bootstrap: pending id persisted before the first
  `createRunOffer`; host committed the new run and the response was lost; current bootstrap stayed old,
  pending stayed present, database held exactly old + one new run; reload returned to the old NEXT_LIFE
  run; the retry reused the same pending id and recovered the SAME new run (never a third document);
  success promoted pending -> current, cleared the pending key and rendered DESTINY_OFFER under the
  unchanged authoritative playerId.

  So: UI04E-R1's pending-bootstrap lifecycle is sound; one server-side projection defect blocks
  acceptance. Fixing it needs a product-source change plus one cloud/wechat runtime regeneration round
  and one typecheck, which exceeds this task's hard `maxArtifactRegenerationRounds: 0` /
  `maxTypecheckRuns: 0`, so the task stops at BLOCKED instead of entering another implementation cycle.
