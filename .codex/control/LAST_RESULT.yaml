summary: >-
  UI02FINAL is the single deferred full regression and merge-readiness audit for the accumulated
  UI02 -> UI02R1 -> UI02R2 -> UI02R2A2 -> UI02ENTRY -> UI02COPY chain, run after the controller accepted
  UI02COPY on human visual review. This task is verification-only: no product behaviour, visual or copy
  change was made. The only non-audit edit is the one the task explicitly permits - registering
  tests/ui02copy.test.mjs in the aggregate npm test command, where it was deliberately absent (UI02COPY
  added it as test:ui02copy but left the frozen aggregate list to the controller).

  MERGE-READINESS VERDICT: PASS. The accumulated chain is safe to fast-forward into dev/tianfu-2.0 and
  UI03 may start.

  Why the verdict is safe to act on:

  1. Ancestry is real, not asserted. dev/tianfu-2.0 (07548318289ca120296090d74650ed79f5274bd5) is a
     genuine ancestor of the chain head 71f36b658; `git merge-base --is-ancestor` succeeds and the
     merge-base IS dev itself, so the chain is a fast-forwardable descendant (not a divergent branch
     requiring a synthetic-tree transplant). There are 10 commits on the chain since dev.

  2. The chain changed nothing it was not allowed to change. The complete dev -> chain-head diff touches
     19 paths and every one of them is the 2.0 dev-preview surface, its UI02 docs, its UI02 tests, the
     two UI02 audit tools, package.json, or .codex control/task metadata. A per-path check confirms ZERO
     changed files under packages/core, packages/content, packages/wechat-shell, packages/application-ui,
     packages/platform-contract, server, miniprogram/pages/start, miniprogram/pages/game,
     miniprogram/pages/rank, miniprogram/app.json and miniprogram/app.wxss. So no gameplay rule, no
     Director behaviour, no server projection, no content, no legacy 1.0 page and no default route
     entered through the UI chain. That is also why a 600-run balance simulation is not required, per the
     task: no gameplay or balance code changed anywhere in the chain.

  3. The full regression is green except for one proven environment artefact. `npm test` now runs 375
     tests: 372 pass, 3 fail. All three failures are the previously documented nested-process EBUSY
     class, and they were classified as environment noise only after BOTH proofs the task requires:
     base reproduction and direct-tool success (see ebusyEvidence and the gates list).

  4. Every dedicated UI suite, every lint/audit gate and the typecheck are green, with the UI02COPY guard
     now inside the aggregate run rather than only alongside it.

