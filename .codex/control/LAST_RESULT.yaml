    Three Node test cases fail inside `npm test` because the sandbox cannot spawn a child node.exe.
    Both halves of the TOOLING_RUNBOOK two-proof standard were re-established for THIS task, on the
    exact base, rather than assumed from earlier tasks.
  proof1_exact_failure_reproduced_on_untouched_base:
    detail: >-
      A full `npm test` was run on the pristine base before any edit. Result: 393 tests, 390 pass,
      3 fail. The three failures are the same test numbers and the same error text as after the change:
      #105 "clean Core passes the import boundary" (spawnSync returns status null -> `null !== 0`),
      #106 "forbidden Core fixture fails the import boundary" (stderr undefined -> assertion on a
      non-string), #225 "replay CLI returns the verified final hash"
      (`spawnSync <node.exe> EBUSY`). No test was added, removed or reordered by UI04A in those suites.
  proof2_underlying_direct_tools_green_from_the_shell:
    - tool: node tools/check-import-boundaries.mjs
      result: exit 0, Core import boundary PASS
    - tool: node tools/check-import-boundaries.mjs --root tests/fixtures/core-forbidden
      result: exit 1, with a 'forbidden import ../../../packages/platform-contract/src/index.ts' line on stderr
    - tool: node tools/replay.mjs <input.json> <pack.json>
      result: >-
        exit 0. The failing test's contentPack/setup/envelope/journey bodies were transcribed verbatim
        into a throwaway harness under .b2base/, which wrote the CLI's two inputs and the in-process
        expectation. CLI finalRuleStateHash =
        978d3e8b3caa46ced017a8e4d593af8a6f11b34107caafb1c1f871ca3a184534 = in-process
        ruleStateHash(finalState), and checkpoints.length = 2. The SAME input run through the untouched
        base tree's tools/replay.mjs produced the identical hash and the identical two checkpoints, so
        neither the sandbox nor the extraction can explain the difference.
  conclusion: >-
    The three failures are environment noise, not task defects: they reproduce byte-for-byte on the
    untouched base and every underlying direct tool succeeds when run from the shell. Nothing else in
    the aggregate failed.

