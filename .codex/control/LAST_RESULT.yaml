recommendedCommitMessage: |-
  fix(ui02r1): remove the WXSS-incompatible universal selector from the preview stylesheet

  Post-review repair. The first DevTools compile of UI02R1 failed with
  "pages/v2-preview/v2-preview.wxss(150:1): unexpected token '*'" because the
  blanket `* { box-sizing: border-box; }` reset is not valid WXSS.

  - Delete the universal selector. Every box with a definite size AND vertical
    padding/border now declares `box-sizing: border-box` in its own rule (15 boxes),
    so the box model the one-screen budget is written in is preserved.
  - Add tools/wxss-compat-audit.mjs: derives the border-box requirement from the
    stylesheet (fail-closed on unresolvable insets) and checks the documented WXSS
    selector exceptions, supported at-rules and media conditions. It is a curated
    subset check, not the compiler, and says so in its output.
  - tests/ui02r1.test.mjs gains four WXSS compatibility tests with negative controls
    that reintroduce the universal selector, drop the border-box declarations and
    inject an attribute selector, a parameterised pseudo-class, an unsupported
    at-rule, an unsupported media condition and position: sticky.
  - Scope base-tree checks by pinned base file counts, with a narrow self-checking
    exclusion for the three files WeChat DevTools generates on open. Those three files
    (default project settings and the stock empty page template) were moved out of the
    worktree into the git-excluded .b2base/devtools-artifacts/ with a sha256 manifest;
    tests/ui02.test.mjs is not excluded-aware and needs a .gitignore entry or a scoping
    fix in a follow-up.
  - Document the root cause, the border-box rule and the DevTools artifacts in
    docs/UI02_PREVIEW.md, and make "confirm it compiles" step 0 of the manual QA list.

  No rule, contract, server, shell, controller, Core/Content, legacy 1.0 or route
  change. Layout audit budget numbers are unchanged (412.6 px at the 320x500 baseline).

  Verification: 304/304 npm test, 22/22 ui02r1, 96/96 layout audit, 14/14 WXSS
  compatibility audit, 18/18 ui02, 6/6 viewmodel-ui, typecheck/lint/content-lint/
  content01-lint/secret-scan green. Manual visual QA on the viewport matrix, starting
  with a successful DevTools compile, is still required and is documented as not
  performed.
