toolingObservations:
  - >-
      Mirror freshness and source validity are independent facts, and passing the first says nothing about
      the second. LIVEFIX02 proved the packaged stylesheet byte-exact and the build still aborted. Any
      future asset pipeline that mirrors generated or legacy files should pair a freshness check with an
      independent structural or syntax check on the SOURCE.
  - >-
      A truncated file is perfectly fresh, so a freshness check can never substitute for a validity check.
      The cheapest durable guard is a fail-closed structural audit that treats EOF inside a rule or a
      declaration as a violation — it is a few dozen lines and it pins the exact class of defect that
      shipped twice.
  - >-
      When reconstructing a lost suffix, keep the repair strictly append-only and assert the preserved
      prefix byte-for-byte against a committed fixture. An earlier attempt in this task inserted new rules
      mid-file to group them logically with related rules, which silently broke the byte-prefix guarantee;
      the test caught it on the first run and the rules were moved into the appended suffix. Grouping
      aesthetics are not worth weakening a provable invariant.
  - >-
      This sandbox cannot spawn `git` from inside a Node test (spawnSync EBUSY), so a test must never call
      git. Scope assertions were expressed as sha256 pins over a fixed file list taken from the base
      commit, which is environment-independent and fails closed. The pre-repair bytes were captured once
      into a committed fixture and reused for both the prefix assertion and the line-253 negative control,
      which is cheaper than storing ~110KB of duplicate base files.
  - >-
      WeChat DevTools writes into AppData caches that do NOT retain project source: a 1.4G scan of both
      the Local and Roaming DevTools trees found no copy of the stylesheet and no file containing its
      unique marker. DevTools caches are not a viable source-recovery location for this project, so a
      future task need not spend budget there.
  - >-
      A dangling-comma truncation check must run at `}` as well as at `;`. A declaration may be closed by
      either, and checking only `;` lets `.a { font-family: 'A', 'B', }` pass as a complete list. This was
      a real bug the negative controls caught rather than a hypothetical one.
