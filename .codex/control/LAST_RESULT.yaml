summary: |
  The whole miniprogramRoot package was closed in one pass, plus a permanent static gate so the defect class
  cannot recur behind a local stub.

  1. MORE THAN THE TWO DISPATCHED FILES. A full per-page audit of every entry in `miniprogram/app.json`
     found FOUR missing files inside the package, not two: `pages/start/data.js` and `pages/game/game.js`
     (both dispatched) plus `pages/start/start.wxss` and `pages/game/game.wxss`. The two stylesheets matter
     because those templates use 74 and 101 static classes respectively and `app.wxss` defines almost none
     of them, so both 1.0 routes would have rendered unstyled. Restoring only the two dispatched files would
     have produced a package that boots and still looks broken.

  2. BYTE-EXACT MIRROR, NOT A COPY. `tools/miniprogram-package-mirror.mjs` projects four root-level legacy
     files into the package with a declared manifest, byte for byte: no transformation, no line-ending
     rewrite, no reformatting. That is what turns "1.0 semantics preserved exactly" from a promise into a
     checkable claim, and it means freshness needs no normalisation logic. The root-level sources stay in
     place as the single source of truth; nothing is moved or deleted. `git` stores these bytes verbatim
     (`core.autocrlf=false`, no `.gitattributes`), so a byte-exact mirror round-trips unchanged.
     The in-package `start.js` / `game.wxml` are NEWER than the root tree (single 300-diamond share tier,
     data-driven `rechargeNotice`), and the manifest does not list them, so the mirror cannot clobber them.

  3. A PERMANENT CLOSURE GATE, NOT A ONE-OFF FIX. `tools/miniprogram-package-closure.mjs` proves the package
     is closed, all seven checks fail-closed:
       A. reads `miniprogramRoot` from `project.config.json` instead of hard-coding `miniprogram/`. An audit
          that hard-coded the root would silently stop auditing if the root ever moved — the exact failure
          this task exists to prevent.
       B. `app.json` parses, page list non-empty and duplicate-free.
       C. every registered page has a committed `.js` that actually CALLS `Page(` plus a committed `.wxml`.
          The `Page(` check matters: a stub compiles, registers and renders nothing, and file existence
          cannot see that.
       D. transitive relative-require closure from every committed module inside the root. Second-order facts
          (`start.js -> data.js`, `game.js -> game_data.js`) are invisible to a single-level scan.
       E. no edge may escape the root or name TypeScript / `packages/` / `server/` / `cloudfunctions/`. The
          prefix check runs BEFORE the existence check on purpose: a root-level `pages/foo.js` must never
          satisfy `miniprogram/pages/foo.js`.
       F. computed `require(...)` is rejected, because the packager resolves statically.
       G. `<import>` / `<include>` / `<wxs src>` must resolve inside the root; a dangling template reference
          renders an incomplete surface with no error at all.
     Both confirmed defects have negative controls, and the audit cannot be silenced by pointing
     `miniprogramRoot` at a non-package (asserted: it fails rather than passing vacuously).

  4. ROUTING NOW MEANS BOOTABILITY. `tools/route-guard.mjs` gained check I, which runs the closure audit on
     the same injected read/exists seam. "pages/v2-live/v2-live is registered" now implies "v2-live can
     actually boot", not merely "the JSON list looks right". A negative control that deletes a page entry or
     breaks a relative require fails both gates rather than one silently passing.

  5. TWO STALE DIGEST PINS FIXED — A REAL REGRESSION IN AN ACCEPTED COMMIT. `tests/ui04b.test.mjs` pins
     digests over `cloudfunctions` and `server/src`. LIVEFIX01 legitimately changed both (it added the
     missing-document classifier to `server/src/cloudbase-store.ts` and regenerated the deployable runtime)
     but was ACCEPTED without re-pinning, so both pins have been failing since. Attributed by recomputing
     each digest over `git archive` extractions of successive commits: both MATCH at 814f0b6 (UI04FINAL) and
     first DIVERGE at f8d5450 (LIVEFIX01), with unchanged file counts (41 and 10). Re-pinned with a comment
     naming the reason, NOT deleted, so both trees stay guarded from here on.
     LIVEFIX02 also changed how the digest is computed: the documented `npm install` deployment step inside
     `cloudfunctions/tianfu2` writes an untracked `package-lock.json` that the filesystem walk counted, so
     following the deployment instructions made the pin unpassable. Dependency artefacts are now skipped the
     same way `node_modules` already was. A real source edit under `cloudfunctions/` still moves the digest.
