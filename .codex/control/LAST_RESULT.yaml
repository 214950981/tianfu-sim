b1ResultPanel:
  design: >-
    One full-screen panel, rendered from the settled receipt, dismissed by one control that submits no
    command. The line for each effect is built from the receipt's own `kind` and delta, so "修为 +150" is a
    statement about what the reducer applied rather than a client guess about what the option ought to give.
    Nothing is rendered for a roll, a tier, an NPC affinity number or a hidden cause id — the transport
    boundary refuses a response that carries those keys at all.
  gate: >-
    The panel is gated on `narrative.eventId`, not on `result.ok`. The server attaches a receipt to every
    successful command, so gating on success alone raised a panel after START_RUN — a result screen for a
    destiny selection — and, because the panel blocks input, made the next core action unreachable.
    tests/ui04c.test.mjs caught exactly that and PLAYUX01B-004 now pins it. `narrative.eventId` is copied
    from the command envelope and only CHOOSE_EVENT_OPTION carries one, so the gate is a property of what
    actually settled rather than of what the page believed it was doing; it also stays correct on a retry,
    where the page no longer knows which intent is in flight.
  noGain: >-
    An empty line list is a true statement that nothing measurable moved, and the panel then says
    此行没有明显收获 with no invented line. A time-only settlement does render, as 岁月 +1 年, because time
    really did pass — that is a change, not a no-gain.

b2LifeBook:
  timeline: >-
    Built from `lifeBook.events`, which the server projects straight off `run.events.history`. Each row
    names the Event from the real pack and states the taken option only when the save recorded a
    `choiceId`; an older save says 此前选择未记录 and no option is manufactured for it. Titles and bodies
    resolve through the same merged catalog, so no `.history` pseudo-key and no raw key can appear.
  counts: >-
    The 0/0/0-versus-11/4/2 screenshots had a concrete cause and it is now closed. ENDING rendered nothing
    at all before the sidecar existed while LIFE_BOOK rendered real numbers, and REBIRTH_RESULT computed
    `buildsFormed` as dominant-only while LIFE_BOOK counted every track — the same run, two definitions,
    one of them unlabelled. ENDING, LIFE_BOOK and REBIRTH_RESULT now read one `counts` object:
    experiences / people / paths / formed / causes, with `paths` and `formed` labelled separately (道途
    versus 道途成形) so 潜藏 is never read as a achieved track.
  absentSidecar: >-
    buildPublicTerminal() returning undefined is a real state, and the screen now says 此生记录整理中
    instead of reporting zeroes, which would be a verdict about a life nobody has summarised.

b3Semantics:
  systemic: >-
    The default decline (`leave`) and the risk decline (`turn-away`) each paid one spiritStone. That is the
    spec's "跑路就送钱" and its "说'暂避风险'却发放无来源灵石" on roughly thirty Events. Options granting
    spiritStone went from 46 to 14; every remaining one is a sale of the player's own goods, a share of
    divided spoils, or a risk the option explicitly takes with a real failure branch.
  named:
    - event: content01.onboarding.market-choice
      was: the player BUYS at a discount and RECEIVES two spiritStone, so buying produced currency and no goods
      now: the player sells gathered herbs. take-deal settles at once for less; haggle-fair earns more but costs a year; ask-source declines and pays nothing
      note: >-
        A purchase could not be modelled honestly: REMOVE_RESOURCE fails as INVALID_OPTION `insufficient
        spiritStone` at zero, so a buy option would be a choice that errors for a starting player.
    - event: content01.ordinary.market-bargain
      was: same class, authored in stage B — `buy-herbs` read 买下 while paying a spiritStone
      now: a sale, with the option id renamed to `sell-herbs` so the id and the wording cannot disagree
    - event: content01.onboarding.mountain-road
      was: the village detour paid one spiritStone for walking a flat road
      now: time only — it is the long way round, which is what the option actually costs
    - event: content01.ordinary.harvest-help
      was: mortal villagers paid two spiritStone for a day of field work, with no payer that could plausibly hold any
      now: ADD_NPC_SIGNIFICANCE on the Event's own generated mortal participant — what the player takes away is that these people remember them. The 120 cultivation for watching a grain pile is gone too
    - event: content01.onboarding.old-trace
      was: tracking into the brush, noting a position and asking around each paid cultivation, with no clue recorded
      now: each settles the time it costs and claims nothing found. No actor-free Cause template exists, so a pursuit Event with no participant cannot record a lead and none is simulated
    - event: content01.onboarding.forked-path
      was: the same pursuit contradiction on the other 追索 opening
      now: time only, differentiated by how far each course of action really goes
    - event: content01.onboarding.rain-shelter
      was: leaving before the rain broke paid one spiritStone
      now: time only. A participant was deliberately NOT added to let the social act pay significance, because materializing one consumes an `npc` RNG draw and would change the deterministic stream for every run
    - event: content01.xu.ten-year-return
      was: declared no effects, so the template's primary fell through to the default +2 spiritStone — money for meeting an old friend
      now: ADD_NPC_SIGNIFICANCE on the core participant 许长安, which is what a reunion actually produces
  declineDimension: >-
    The decline had to keep changing a long-term dimension, because the registry rejects a core choice that
    does not. Time was the honest first choice and was implemented, then rejected: a decline costing a year
    moves a short run's lifespan-ceiling crossing into an Event resolution, and CONTENT01-022 pins that a
    24-year life ends by node 3-5. 修为 is the dimension this template already uses for its cautious options
    (`consider` 150, risk `read-signs` 180), so withdrawal takes the smallest amount of it. This is a
    compromise and is stated as one: the honest answer for a decline is no gain at all, and the remaining
    defect on those template Events is their generic wording, which stays disclosed.
  remainingTemplateScenes: >-
    35 Events still carry at least one generic template option (顺势而行 / 停步细看 / 见好便收 / 承担此险 /
    先辨征兆 / 及时折返). Stage B authored the four representative openings, stage E the ten Cause echoes;
    re-authoring the rest is out of this pass. Their money is fixed; their wording is not. Counted by
    scanning choice labels against the default set, not estimated.

b4Fallback:
  what: >-
    `presentLabel` still returns the raw key on a miss, and LIVEFIX06 pins that deliberately: an unknown
    key must stay findable in development. The terminal surface is the one the spec names as different, so
    it now resolves through `presentTerminalLabel`, which substitutes 原因尚未明确 for a death cause and
    详情暂不可用 for any other terminal row. The fallback is a neutral phrase and never a known cause:
    mapping an unrecognised id onto 寿元已尽 would state a death reason the engine did not publish.
  notAMask: >-
    PLAYUX01B-013 asserts every enum the engine can currently emit still translates, so a new one fails a
    test rather than reaching a screen. The fallback is a safety net, not a way to hide a missing catalog.

