disclosedScopeNotes:
  - > - |
    The new `seedDoc(name, id, data)` helper on the fake CloudBase database is intentionally
    test-scoped: tests/ui04d.test.mjs continues to pass 20/20 because the harness signature is
    additive. The harness still models the post-commit timeout in the fake database (not in a real
    CloudBase instance) and the same EBUSY / payload-too-large caveats from UI04D apply here too.
  - > - |
    No real cloud deployment was performed - it is explicitly forbidden by the task. What exists is a
    deployable artifact plus the exact manual deployment steps (docs/UI04D_CLOUD_BACKEND.md section 6)
    and the list of cloud-side setup that is still manual (section 7: environment binding, the four
    collections and their security rules, timeout/memory configuration, multi-user acceptance under
    a real OPENID). UI04E's incremental surface is the fourth operation (advanceTerminal) and the
    fourth collection (tianfu2_terminal_transitions); both must be created in the cloud console before
    UI04FINAL flips the default route.
  - > - |
    The generated cloud runtime is Node-version sensitive: module.stripTypeScriptTypes is used with mode
    "strip" and its whitespace is Node's own. Freshness therefore compares bytes strictly and the committed
    provenance header records the source digests, so a Node upgrade surfaces as a freshness failure with an
    obvious cause rather than a silent drift. UI04E did not relax this constraint; one new generated
    file (server-terminal-flow.js) is added to the closure.
  - > - |
    The terminal-flow module's NEXT_LIFE path uses generateServerDestinyOffer (not a hand-built
    offered run) so CONTENT01's progression.v1 innate-profile offers apply. The terminal-flow module
    does NOT itself generate the offered state — it asks the destiny-offer generator to do that, exactly
    the way createRunOffer does. This keeps the offer-creation surface in one place.
  - > - |
    The terminal sidecar is the ONLY state mutated by a pure terminal transition. The contract test
    `UI04E_idempotency` proves this by JSON.stringify-comparing the pre- and post-transition state on
    every pure advance, and asserting ruleStateHash byte-equality. NEXT_LIFE additionally writes a new
    run document + bootstrap mapping, but the OLD run's canonical gameplay bytes are still untouched.
  - > - |
    docs/dev-status.md was NOT updated. It is the controller's bookkeeping and updating it is outside
    this task's allowedScope; docs/UI04E_TERMINAL_LIFECYCLE.md carries the task documentation. UI04FINAL
    picks up dev-status.md after the controller accepts this result.
  - > - |
    "No gameplay was added" is asserted by source inspection - the closure is exactly the pinned Core /
    Content / server modules and the host contains no reducer or gateway of its own - plus behaviour:
    every state transition in tests/ui04e.test.mjs comes out of the accepted reducer through the accepted
    ServerViewModelBuilder (driving the run to dying via real lifespan-ceiling handling), and every
    `terminal` projection field is either already-public data or the sidecar itself. It is not proven by
    enumerating every expression in the reducer.

toolingObservations:
  - topic: A post-commit timeout on a terminal transition must be a typed retryable, not a free-floating exception
    observation: > -
      CloudBase transactions can throw PostCommitTimeoutError when the platform commits but loses the
      response. For terminal flow this means the transition *did* settle — the receipt is durable and
      the sidecar is updated — so the next call with the same terminalTransitionId must return the
      recorded result via the exactly-once path. The live service maps the platform timeout to a
      TerminalFlowError with code TRANSIENT and retryable=true; the cloud host turns it into the
      same settlement envelope sendCommand uses, and the client's controller treats it like any other
      retryable failure.
    evidence: > -
      tests/ui04e.test.mjs case 3 (an exact terminal retry returns the same stage without advancing
      twice). The first armPostCommitTimeout() armed call threw a free-floating PostCommitTimeoutError
      out of advanceTerminal; after mapping, the test proves the receipt is durable, the next call's
      exactly-once check returns the settled stage and version, and the canonical gameplay hash is
      byte-identical.
    impact: > -
      A free-floating platform timeout would leave the controller with no canonical signal to
      distinguish "retry this terminalTransitionId" from "the server never saw my request". The
      mapping collapses both into the documented retryable contract.
    workaround: > -
      Catch PostCommitTimeoutError at the live-service boundary, throw TerminalFlowError(TRANSIENT,
      "terminal.post_commit_timeout", retryable=true), and let the exactly-once path do the rest.
      Anything else (terminalFlowId error, validation error, etc.) is still surfaced unchanged.
  - topic: An exact retry after a settled transition naturally arrives with a stale expectedTerminalStage
    observation: > -
      The client's `expectedTerminalStage` reflects the stage the page was on BEFORE it sent the
      advance. After the first advance settles, the sidecar stage has advanced by one. The same
      terminalTransitionId retried with the same expectedTerminalStage therefore looks like a
      "stale" advance to a stage-drift guard. The terminal-flow module checks the exactly-once
      receipt BEFORE the stage-drift guard: the receipt is the only authoritative signal that
      "this id already settled", and the recorded toStage / version is what the client gets back.
    evidence: > -
      tests/ui04e.test.mjs case 3 (the retry arm). Before the reorder, the test failed with
      terminal.stage_drift because the second call's expectedTerminalStage="ENDING" no longer
      matched the post-settle sidecar stage="LIFE_BOOK"; after moving the prior-receipt check above
      the drift guard, the retry recovers the settled stage and never sees a drift error.
    impact: > -
      Reordering the two checks is the difference between "an exact retry recovers the settled stage"
      and "an exact retry surfaces a misleading STATE_CONFLICT". The order must be (1) ownership,
      (2) reachedEnd, (3) prior receipt, (4) stage drift.
    workaround: > -
      Check the exactly-once receipt first; only fall through to the stage-drift guard when there
      is no prior settlement. Document the ordering in the terminal-flow module's docstring.
  - topic: A deterministic runId seed is what makes NEXT_LIFE retry-recoverable across a cold start
    observation: > -
      The NEXT_LIFE path mints a fresh `(nextBootstrapId, nextRunId)` pair where nextRunId is
      `run-${runIdSeedFor}(playerId, nextBootstrapId)`. This is the SAME derivation the cloud host uses
      for createRunOffer, so the document address the next call writes to is the same address the
      retry reads from. The receipt stores nextBootstrapId / nextRunId, so a retry after a cold
      start or a process restart recovers them determin.
    evidence: > -
      tests/ui04e.test.mjs case 13 (an exact retry after a post-commit timeout settles exactly once
      and recovers the next-life bootstrap). The first armPostCommitTimeout() call returned a retryable
      failure; the document was committed; the retry's exactly-once path returned the same
      nextRunId / version without minting a second fresh life.
    impact: > -
      A fresh random nextRunId would make the retry recover a different document — the controller
      would think it has two lives. The deterministic seed is what makes the round-trip safe.
    workaround: > -
      Use runIdSeedFor(playerId, nextBootstrapId) for the new run's id, never crypto.randomBytes or a
      service-local counter. assertBootstrapId enforces the character set the document-id hashing
      assumes.

