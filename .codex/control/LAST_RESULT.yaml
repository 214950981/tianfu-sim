summary: |
  Narrow persistence-boundary compatibility fix. The condition real CloudBase reported on 2026-10-05 is the
  SAME benign first-use absence LIVEFIX01 already handles — a document that is not there yet — but wrapped
  in the generic `errCode: -1` instead of the ResourceNotFound family. Because the platform returns `-1`
  for permission failures, network faults, transaction conflicts and malformed requests too, the code
  alone carries no information and is never treated as the discriminator.

  The fix accepts `-1` (numeric or stringified) ONLY when the message matches, fully anchored:

      ^document\.get:fail\s+document\s+with\s+_id\s+[0-9a-f]{32}\s+does\s+not\s+exist$

  That single regex requires the `document.get:fail` operation prefix, the `_id` subject, a 32-hex
  deterministic id and the absence claim, in that order and with nothing around them. A generic `-1`
  therefore cannot normalize: it cannot pass an anchored match, so permission, network, transaction,
  malformed, wrong-id-format and wrong-operation `-1`s all still throw. Collection absence is rejected
  before the `-1` branch is even reached, so a broken deployment still fails closed.

  The harness gained a selectable `missingDocumentShape` so the SAME store, service and host run under both
  the LIVEFIX01 shape and the production `errCode: -1` shape. All four read kinds, the empty-database
  first `createRunOffer`, the exactly-once bootstrap retry, command idempotency and the committed
  deployable cloud host are proven under the new shape; the cloud runtime was regenerated exactly once.
