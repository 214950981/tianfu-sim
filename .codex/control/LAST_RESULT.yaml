recommendedCommitMessage: |-
  feat(ui02): add 2.0 core-loop high-fidelity preview route

  First player-visible 2.0 slice. No gameplay rule, contract or content change.

  - New dev-only route miniprogram/pages/v2-preview/v2-preview, registered last in
    app.json; not the default page and not a tabBar entry.
  - Renders RUN_HOME / EVENT / SPECIAL_NODE / LIFE_ARCHIVE in the frozen
    paper-ink-cinnabar-restrained-dark-gold language with UI02 tokens.
  - RUN_HOME shows public status, lifespan pressure, conditions, Cause clues, Build
    identity, known people and exactly the four core action intents.
  - EVENT renders server-built riskPresentation per option and locks ordinary back
    while unresolved.
  - SPECIAL_NODE reuses the same authoritative interaction/retry boundary; no second
    breakthrough engine.
  - LIFE_ARCHIVE is a read-only public selection; hidden Causes and unmet NPCs never
    appear.
  - server: publicRun.specialActions breakthrough projection, availability only,
    never difficulty/odds/RNG/hidden modifiers; mirrors the reducer exactly (proven
    by test on five states).
  - wechat-shell: mapCoreActionIntents / mapSpecialActionIntents / buildArchiveView.
  - tools/ui02-preview-fixtures.mjs generates the preview fixture through the real
    production chain; tests/ui02.test.mjs pins base tree digests so legacy 1.0
    gameplay and Core/Content sources are provably byte-equivalent to base.

  Verification: 282/282 full suite (was 264), 18/18 ui02, 6/6 viewmodel-ui,
  typecheck/lint/content-lint/content01-lint/secret-scan green.
