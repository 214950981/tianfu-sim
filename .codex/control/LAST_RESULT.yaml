disclosedScopeNotes:
  - >-
    This task made one non-audit edit, package.json, which the task definition explicitly allows ("adding
    tests/ui02copy.test.mjs to the aggregate npm test command if it is not already registered there"). It
    was not registered: UI02COPY added test:ui02copy but deliberately left the aggregate list alone because
    the full regression was deferred. Registering it is what makes the aggregate run now include the copy
    guard.
  - >-
    The full regression's three failures are reported as GREEN-WITH-PROVEN-ENVIRONMENT-NOISE rather than
    fully green. `npm test` exits 1 because of them, so the aggregate gate is not literally exit-zero.
    Reported as such rather than hidden, because the task's accept criterion is explicitly the conditional
    one (green OR only proven base-reproducible nested-process EBUSY environment failures with underlying
    direct tools green), and both required proofs are recorded in ebusyEvidence.
  - >-
    The replay direct-tool proof uses a small harness that copies the failing test's helper bodies verbatim
    and drives the real CLI from the shell. It is a deliberate, disclosed substitute for the in-process
    call the sandbox blocks; it asserts the same two facts the test asserts (the finalRuleStateHash and
    checkpoints.length === 2). The harness lives under the git-excluded scratch directory and is not part of
    the task commit.
  - >-
    The worktree arrived polluted by a previous WeChat DevTools session: a modified project.config.json and
    project.private.config.json, and an untracked miniprogram/pages/game/game.js stub (the stock
    Page({}) template DevTools generates for a page app.json declares but the repo does not implement).
    That stub would shadow the real 1.0 game page and would break the digest-pinned tests/ui02.test.mjs
    check on miniprogram/pages/game. All three files were copied to the git-excluded scratch directory with
    a sha256 manifest and moved aside BEFORE verification, and the tracked config files were restored to
    their base content. None of them is in this commit, and the worktree was confirmed clean apart from the
    untracked session memory log before the base was positioned.

toolingObservations:
  - id: T1
    severity: ENVIRONMENT
    inherited: true
    title: nested node process spawn fails with EBUSY in this sandbox
    evidence: >-
      Reproduced exactly as the task requires - identical failures on the untouched base plus green direct
      tools. See ebusyEvidence.
    impact: >-
      The full regression can never be literally exit-zero in this sandbox. Anyone re-running `npm test`
      here should expect exactly these 3 failures and judge them as environment noise; on a normal machine
      the same tests would pass.
  - id: T2
    severity: TOOLING
    inherited: true
    title: WeChat DevTools pollutes the worktree and can break digest-pinned tests
    evidence: >-
      Observed again on arrival: modified project.config.json / project.private.config.json and an
      untracked miniprogram/pages/game/game.js stub. tests/ui02.test.mjs hashes the whole
      miniprogram/pages/game directory, so the stub alone would have failed the regression for a reason
      that has nothing to do with the chain.
    impact: >-
      Anyone opening this project in DevTools between an implementer run and the controller's review must
      move those artefacts aside before trusting a regression result, and must not commit them.
  - id: T3
    severity: TOOLING
    title: pushing requires an explicit credential helper in this sandbox
    evidence: >-
      ~/.gitconfig ends its credential section with an empty `helper =`, which RESETS the helper list that
      PortableGit's gitconfig sets, so a plain `git push` finds no credential, falls back to an interactive
      prompt, and hangs with no output. The Windows Git Credential Manager does hold a working GitHub
      credential and supplies it non-interactively. The push for this task used
      `GCM_INTERACTIVE=never git -c credential.helper=manager -c
      credential.https://github.com.helper=manager push origin HEAD:refs/heads/wb-UI02FINAL` with each
      attempt bounded by `timeout` and retried for the flaky proxy.
    impact: >-
      Informational for the controller, actionable for the next implementer run. Also note the proxy port
      is not stable (observed 23843 here, 18036 previously) - read it from HTTPS_PROXY.

