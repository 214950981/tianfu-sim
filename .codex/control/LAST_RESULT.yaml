recommendedCommitMessage: |-
  feat(ui03): wire the 2.0 presentation layer to a live session controller

  Adds WeChatRunController (packages/wechat-shell): a reusable live-session
  controller that consumes only PublicViewModel + ApplicationTransport +
  PlatformStorage + the accepted shell mappers. It loads the authoritative
  ViewModel, maps a player intent to a GameCommand, submits it, exposes the
  pending/retry/reconfirmation state and projects the next page model.

  Gameplay authority does not move: the controller rolls no RNG, resolves no
  outcome, computes no eligibility, risk or breakthrough odds, and every page
  transition comes from a refreshed PublicViewModel. CommandSubmissionController
  stays the single owner of the envelope, commandId persistence, retry and
  STATE_CONFLICT reconfirmation; the shell wraps exactly one instance and
  persists nothing itself. The production WeChat transport is NOT wired and the
  default route is unchanged - both are UI04, documented in
  docs/UI03_LIVE_CONTROLLER.md.

  This task also had to fix ONE server-side projection defect to be possible at
  all: CHOOSE_EVENT_OPTION is keyed by eventId, but the public CurrentInteraction
  only exposed interactionId, which is an instance identity
  ("event:<commandId>:<eventId>" in a real run) and therefore not the event id.
  The public ViewModel could not construct the contract's own command. The
  smallest additive fix: the server now projects the authoritative
  state.run.events.current.eventId verbatim onto the decision interaction. It is
  not new information - past event ids are already public in
  history[].data.eventId - and it is optional, so destinyOffer does not carry it.

  Evidence - all E2E through the real CommandGateway +
  GatewayApplicationTransport + ServerViewModelBuilder, with only PlatformStorage
  and the commandId factory injected:
  - real core action -> EVENT -> event choice -> refreshed RUN_HOME round trip;
  - real ATTEMPT_BREAKTHROUGH round trip from a server-projected available state
    (mortal -> qi-refining), plus both refusal modes when it is not projected;
  - a transient failure retried with the identical commandId and payload,
    settling exactly once;
  - STATE_CONFLICT refreshing the latest ViewModel and requiring an explicit
    reconfirmation with a fresh commandId against the latest stateVersion;
  - unresolved EVENT and SPECIAL_NODE back protection, and the in-flight lock;
  - LIFE_ARCHIVE as a local read-only overlay that submits nothing and mutates
    nothing, and is dropped the moment the authoritative page state moves on.

  Tests and gates:
  - ui03 18/18 (new); ui02 18/18; ui02r1 32/32; ui02r2 15/15; ui02r2a2 15/15;
    ui02entry 20/20; ui02copy 11/11; viewmodel-ui 6/6; server-gateway 6/6;
    reducer 10/10.
  - aggregate npm test: 393 tests, 390 pass, 3 fail. The +18 over UI02FINAL's
    375 is exactly the new suite, so nothing regressed. The 3 failures are the
    documented nested-node EBUSY class, classified as environment noise only
    after BOTH required proofs: they reproduce identically on the untouched base
    tree, and every underlying direct tool is green from the shell
    (check-import-boundaries exit 0 clean / exit 1 + "forbidden import" on the
    negative control; replay.mjs exit 0 with finalRuleStateHash 978d3e8b...534
    equal to the in-process ruleStateHash and 2 checkpoints).
  - typecheck clean; lint, content-lint, content01-lint, secret-scan PASS;
    layout audit 143/143; wxss compat 14/14; preview fixture freshness green.
  - 600-run simulation NOT run: no Core/Content/Director/Progression/Risk code
    changed.

  Scope disclosure: the only client-visible model change is the additive public
  eventId described above. Four tests/ui02r1.test.mjs base-tree digests were
  updated on purpose (wechat-shell, platform-contract, server, v2-fixtures.json)
  and its own comment permits exactly that; the other ten pinned entries,
  including packages/core/src, packages/content/src, the 1.0 pages, app.json,
  app.wxss and the UI02 preview generator, are byte-identical. The preview
  fixture JSON and its JS sibling were regenerated by re-running the existing
  writers; no generator or page source was edited. UI04, cloud deployment, the
  default route and all gameplay rules were left alone.
