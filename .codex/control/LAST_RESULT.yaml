summary: >-
  The Controller reviewed the first pass, accepted the content and Director work, and returned
  CHANGES_REQUESTED on five blocking findings. B1 and B2 were both player-visible defects that the first
  pass's 20/20 green could not have caught, because no test ever drove the page: the server had been
  producing a real result receipt since stage C, and the client threw it away at the transport boundary, so
  the player still never saw what their choice did. This pass fixes all five and, more importantly, changes
  how the work is verified — the new suite drives the real gateway over a real content01 run and feeds the
  receipt into the page's own render model, then exercises the page's own handlers.

whyTheFirstPassMissedB1: >-
  parseCommandResult in packages/wechat-shell/src/index.ts returned `{ok, commandId, stateVersion}` and
  discarded `domainEffects` and `narrative`. Everything downstream was therefore correct and unreachable at
  the same time: command-gateway.ts built a truthful receipt inside the settling transaction, the page had
  the result.* copy for every line kind, and WXML had no pane to render any of it into. A test that asserts
  on algorithms cannot see this, which is exactly the Controller's point about test quality.

changes:
  - file: packages/wechat-shell/src/index.ts
    what: >-
      B1. `parseReceipt()` reads `domainEffects` and `narrative` off a confirmed result and runs both
      through `assertNoServerSecrets`, the same guard `parseRunOfferResult` already used, so a leaked
      rootSeed or hidden Cause fails the whole response rather than riding along inside a receipt. An absent
      receipt stays absent: an older server deployment simply yields no panel, and the page says the choice
      completed instead of inventing a result.
  - file: miniprogram/pages/v2-live/v2-live.js
    what: >-
      B1/B2/B4. Adds `buildResultReceipt()` (one line per settled effect, no-gain stated honestly, no roll
      or tier rendered), `resolvedAnEventOption()` (the panel's gate, see below), `buildTimeline()`,
      `buildPeopleRows()`, `buildTrackRows()`, `buildCauseRows()`, `resolveCopy()`, `presentTerminalLabel()`
      and BUILD_STAGE_LABELS/NPC_STATUS_LABELS/RESOURCE_LABELS. `buildRenderModel` takes the receipt as a
      parameter so it stays a pure function of its inputs and a test can drive it without a page instance.
      `runIntent` captures the receipt and is the only place that sets it; `onDismissResult` clears it and
      submits nothing; `onRetry` captures a settlement that finally lands. `buildTerminal` computes one
      `counts` object that ENDING, LIFE_BOOK and REBIRTH_RESULT all read, and `buildArchive` projects the
      recorded `choiceId`.
  - file: miniprogram/pages/v2-live/v2-live.wxml
    what: >-
      B1/B2/B4. Adds the 本次结果 panel (full-screen like the archive overlay, one dismissal control, gated
      on `vm.hasResult`), rebuilds LIFE_BOOK as a timeline plus people/tracks/causes/terminal sections,
      gives ENDING a real cause line and a 此生记录整理中 fallback, and shows the taken choice in the live
      archive with 此前选择未记录 when a save has none.
  - file: miniprogram/pages/v2-live/v2-live.wxss
    what: >-
      B1. The result panel's own styles. Declares box-sizing itself, uses no banned WXSS construct, and the
      integrity audit reports 51 statically referenced classes all defined.
  - file: packages/core/src/reducer.ts
    what: >-
      B2. Extracts `lifespanEnding()` and calls it from BOTH paths that can cross maxAge. Previously only
      the core-action path wrote `ending` and `deathRecord`; the Event path set status "dying" and nothing
      else, so a run that spent its last year inside an Event entered ENDING unable to name its own cause,
      permanently. The action path's bytes are unchanged (verified: same field order, actionId still carried)
      and the Event path stops losing the cause.
  - file: server/src/command-gateway.ts
    what: >-
      B1. `resultReceipt()` now adds `eventId` / `choiceId` / `appliedTier` only when they exist. It used to
      write `eventId: (envelope.command).eventId` unconditionally, so a START_RUN or CHOOSE_ACTION receipt
      held a key whose value was `undefined`; the idempotency store persists the receipt as JSON, JSON drops
      that key, and a duplicate submission therefore came back different from the recorded result. That was
      a pre-existing defect from stage C, invisible until this pass ran tests/ui04d.test.mjs.
  - file: packages/content/src/content01-v1.ts
    what: >-
      B3. See the B3 entries below. 46 money-granting options became 14; the four named contradictions and
      their two same-class siblings are fixed; the pack is re-sealed (checksum 0a6f02c5).
