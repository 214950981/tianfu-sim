  - >-
    miniprogram/runtime/ is committed generated output inside miniprogramRoot. The repository already
    commits one such artifact (miniprogram/pages/v2-preview/v2-fixtures.js, generated by
    tools/ui02-preview-fixture-module.mjs), so this follows an accepted precedent rather than introducing a
    new policy.
  - >-
    The generated files are not byte-stable across Node major versions, because Node's type stripper decides
    how much whitespace replaces erased type syntax. The freshness check treats any such change as STALE,
    which is the correct conservative behaviour: a Node upgrade requires a reviewed
    "npm run ui04b:artifact:write". The check's failure message names the first differing line. No Node
    version is embedded in the artifact bytes, so the artifact does not churn merely because a different
    Node ran the check.
  - >-
    The artifact keeps the accepted sources' ES2022 private class fields and private methods (the transform
    does not rewrite them). Whether the WeChat DevTools enhanced compiler accepts them cannot be proven in
    this repository, which has no WeChat packager; it is listed as manual DevTools item 2 in
    docs/UI04B_WECHAT_RUNTIME_ARTIFACT.md and is NOT claimed as verified.

toolingObservations:
  - topic: Node's built-in TypeScript type stripper is usable as a zero-dependency derivation path
    observation: >-
      Node 22.22.2 exposes module.stripTypeScriptTypes(code, { mode: "strip", sourceUrl }) from node:module
      WITHOUT any CLI flag; it only prints an ExperimentalWarning. It is the same code path Node uses to
      execute this repository's .ts fixtures directly, so it can derive a JavaScript artifact from accepted
      TypeScript in a repo that has no node_modules, with no compiler or bundler dependency.
    evidence: >-
      A node --no-warnings -e probe on Node v22.22.2 printed "has stripTypeScriptTypes: function" and
      stripped "export const a = 1 as const;", "import type", "export type", "readonly #p: number;" and a
      generic class correctly. Verified end to end in tools/ui04b-wechat-runtime-artifact.mjs.
    impact: >-
      Any future task that must emit WeChat-loadable JavaScript from TypeScript here can reuse this instead
      of adding esbuild/webpack/rollup or requiring an npm install.
    workaround: >-
      mode "strip" refuses TypeScript-only syntax that needs real transformation (enums, namespaces,
      parameter properties); use mode "transform" only when a source genuinely needs it. The stripper also
      appends a "//# sourceURL=<source path>" marker, which the generator removes because that path does not
      exist inside the miniprogram package.
  - topic: stripTypeScriptTypes output is Node-version sensitive, so freshness must be strict
    observation: >-
      The amount of whitespace that replaces erased type syntax is an implementation detail of the stripper;
      two Node versions can produce different bytes from identical input.
    impact: >-
      A Node upgrade makes the committed artifact STALE. That is the desired conservative behaviour, but it
      must be expected rather than diagnosed as a hand edit.
    workaround: >-
      Regenerate with "npm run ui04b:artifact:write" after a Node upgrade and review the whitespace-only
      diff. The freshness check reports the first differing line, and no Node version or generator hash is
      embedded in the artifact bytes, so a different Node running the CHECK does not by itself cause churn.
  - topic: node:vm CommonJS module loading - one context and a wrapper function, not a mutated context
    observation: >-
      The straightforward recipe of setting context.module / context.exports / context.require and calling
      vm.runInContext(source) breaks for a module graph: a nested require overwrites the outer module
      binding, so the parent module's trailing "module.exports = ..." throws ReferenceError.
    evidence: >-
      Hit while first implementing tools/ui04b-wechat-runtime-smoke.mjs; the failure surfaced as
      "ReferenceError: module is not defined".
    workaround: >-
      Compile the source once inside the context as "(function (exports, module, require) { ... })" with
      vm.runInContext, then invoke the returned function with the host module object. Top-level var/function
      declarations stay module-scoped, instanceof stays consistent within the realm, and no context binding
      has to be restored. Implemented in loadRuntimeArtifact().
  - topic: Cross-realm values break prototype-based validation and strict equality in vm-based tests
    observation: >-
      A generated CommonJS module validated inside a vm realm rejects host-realm literals when the code
      checks Object.getPrototypeOf(value) !== Object.prototype - the command wire codec does exactly that
      for envelopes. Separately, assert.deepStrictEqual fails across realms even for identical contents.
    evidence: >-
      Feeding a host-realm envelope to the generated codec produced "envelope: must be a plain object" while
      the equivalent TS module accepted it.
    workaround: >-
      Re-materialise host values INSIDE the realm with vm.runInContext("(JSON.parse(<json>))", context)
      before feeding them to generated code, and normalise realm values back with
      JSON.parse(JSON.stringify(x)) before comparing. Both patterns are implemented in
      tools/ui04b-wechat-runtime-smoke.mjs. Do not conclude the artifact is broken - a real mini program is
      one realm.
  - topic: A line-oriented code scanner must compute the first code character per line
    observation: >-
      Using a "lineHasCode" flag that is reset when the scanner meets a newline misses every export that
      follows a block comment, because the block-comment skip consumes up to the newline and the loop then
      steps past it without resetting the flag. The result was a generated file that still contained
      "export" statements.
    evidence: >-
      The first generator run failed with "miniprogram/runtime/command-wire.js: generated code does not parse
      as JavaScript (Unexpected token 'export')" on Node v22.22.2; the first module headings after a JSDoc
      block were miss-detected.
    workaround: >-
      Build a comment/string mask over the whole source, then for each line find the first index with
      mask === 1 and test the token there. Implemented as moduleHeadings() in
      tools/ui04b-wechat-runtime-artifact.mjs. The general lesson is worth keeping: compile every generated
      file with vm.Script before writing it.
  - topic: source.replace() negative controls must assert the anchor exists
    observation: >-
      Two negative controls silently did nothing. A mutation targeting the string "var APP_ERROR_CODES"
      never applied, because the type stripper removes the "export" keyword and the generated declaration is
      "const APP_ERROR_CODES = [", so the control passed for the wrong reason until the missing anchor was
      noticed. Separately, a static facade-export parser that matched only the "module.exports = { ... }"
      literal could not see a later "module.exports.name = ..." assignment, so a grown-surface control was
      not detected.
    evidence: >-
      Both were assert failures inside tests/ui04b.test.mjs during this task's own development, both fixed
      before the result was written.
    workaround: >-
      Every surgical mutation in tests/ui04b.test.mjs goes through replaceOnce()/withoutRequire(), which
      assert the anchor exists first. facadeExportKeys() in tools/ui04b-wechat-runtime-audit.mjs parses both
      publication forms. Consider adopting both patterns in future negative-control tasks.
  - topic: checkFixtureRequire makes the v2-preview packager seam unaddable without weakening a guard
    observation: >-
      tools/ui02-preview-fixture-module.mjs checkFixtureRequire requires EXACTLY ONE require() call in
      miniprogram/pages/v2-preview/v2-preview.js, and tests/ui02r1.test.mjs asserts its ok flag directly;
      tests/ui02entry.test.mjs also parses that file's require arguments.
    impact: >-
      Any future task that wants a second require in that page (for example UI04C wiring the runtime) must
      update those accepted assertions deliberately and disclose it. It cannot happen as a side effect.
    workaround: none needed; recorded so the next task does not rediscover it.
  - topic: .b2base is excluded through .git/info/exclude, not .gitignore
    observation: >-
      The shared control directory is excluded by the line ".b2base/" in <common>/.git/info/exclude, and
      "git check-ignore -v .b2base" confirms it. It therefore never appears in git status and cannot leak
      into a task commit.
    workaround: >-
      Keep using .b2base for scratch trees, logs and throwaway harnesses. "git archive <base> | tar -x -C
      .b2base/base" remains the safest untouched-base reproduction recipe and produced no nested .git.
