toolingObservations:
  - >-
      A generic platform error code must never be a discriminator. `-1` is what the platform returns for
      permission, network, transaction and malformed failures too, so any rule of the form "code === -1
      means empty" would silently convert operational outages into data loss. Pair the code with a fully
      anchored message that pins the operation, the subject, a well-formed id and the claim.
  - >-
      Anchor the whole message, not just the interesting substring. The new regex is anchored at both ends
      so a truncated sentence, a trailing "(retrying)", a leading platform prefix or a wrong operation all
      stay fatal. A substring match would have accepted every one of those.
  - >-
      Requiring a well-formed id is a cheap, high-value discriminator. Because the store only ever addresses
      `documentIdFor` output, a 32-hex id proves the failing read is one this store issued; the six bad-id
      near-misses (31/33 chars, non-hex, ObjectId, uuid, empty) all stay fatal for free.
  - >-
      Keep the new branch AFTER the collection-absence guard and give it its own anchored match rather than
      extending the shared SUBJECT/CLAIM regexes. Sharing them would have let `-1` reach the old uncoded
      literal-message branch and widened what `-1` accepts; keeping it separate means the LIVEFIX01 branch
      still accepts its short `_id abc` form, which the new 32-hex rule would otherwise have rejected.
  - >-
      A selectable error shape in a fake harness is how you prove one code path serves two real wire
      shapes. `missingDocumentShape` drives the same store, service and host under both, and an
      unrecognised value throws so a typo cannot silently fall back to the permissive default.
  - >-
      The committed cloud host does NOT throw on an operational error: `cloudfunctions/tianfu2/index.js`
      logs and returns a bounded `{ok:false, error:{code:"INTERNAL", retryable:true}}` envelope. A test that
      asserts "it must reject" against the host is asserting the wrong contract — assert the envelope, the
      absence of a runId, that nothing was written, and that no server detail leaked. Probing the real
      return value first is faster than reasoning about it.
  - >-
      Idempotency assertions must reuse the SAME envelope object. Rebuilding an "identical" command with a
      fresh commandId (or a stale expectedStateVersion) yields STATE_CONFLICT, which looks like a
      persistence bug and is not one. Two of this task's own failures were this mistake.
