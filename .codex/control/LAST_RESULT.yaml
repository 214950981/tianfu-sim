summary: >-
  UI02R2 is a presentation-only visual polish of the 2.0 dev preview RUN_HOME. Every UI02R1 structural
  contract is preserved verbatim: the one-screen layout, the viewport matrix bands, the safe-area
  reservations, the scroll ownership boundaries, the exactly-four core action dock, the server-gated
  breakthrough CTA, the at-most-three attention summaries plus one condition row, the four read-only
  drawers and the fixed dev overlay are all unchanged in structure; the layout audit (96 checks) and
  the WXSS compatibility audit pass without modification, re-deriving the first-screen budget from the
  updated tokens (worst case 320x500: 431.4px stack + 34px safe-area = 465.4px of 500px, slack 34.6px;
  touch floors and the 20rpx readability floor untouched).

  What changed is hierarchy, rhythm and Chinese-facing presentation:

  - Hero: the realm name (52rpx, weight 600) is the only large type; the realm order renders as 第N境
    in the single restrained dark-gold accent, and order 0 (凡人) renders 未入修行 instead of the old
    "第 0 境". The lifespan track gains a slightly stronger 3rpx rule.
  - Vitals: 修为/道基/灵石 become one divided strip (hairline column separators), values promoted to
    30rpx/600 ink, labels demoted to 20rpx faint.
  - Attention: retitled 眼下要务 with a 10rpx gold square marker so it reads as a priorities panel;
    tags become outlined chips; the row chevron uses gold-soft. The hint copy is tightened.
  - Dock: the breakthrough CTA is now the single primary control (solid ink background, paper text,
    32rpx/600/8rpx letter-spacing, gold target), and the four core actions stay uniform light outline
    secondaries (30rpx/500/8rpx). A new --radius-card: 8rpx is shared by CTA/action/dock-note/option/
    failure/dev-trigger; the frozen --radius: 4rpx remains for tags and chips. Section rhythm tokens
    (--vitals-h, --attn-slot-h, --attn-head-h, --hero-meta-h, --life-h, --dock-gap) were raised for
    breathing room within the audited budget.
  - Decision/archive: decision title weight 600, option cards use the shared radius, risk tiers render
    as chips; EVENT participant slots, risk tiers and reason keys render in Chinese.
  - Presentation label layer: v2-preview.js adds label tables that mirror ONLY structural contract
    enums (six realm ids with the official content displayNames 凡人/炼气/筑基/金丹/元婴/化神, core
    BUILD_STAGES, condition kinds, affinity/trust semantics, observed npc roles, participant slots,
    risk tiers, known reason keys, death causes, archive entry kinds). presentLabel() falls back
    verbatim to the raw value for anything unknown, the tables contain no per-run fixture values, and
    narrative content keys (titleKey/bodyKey/labelKey/summaryKey prose) are deliberately NOT mapped —
    that is content i18n, not presentation, and mapping them would fabricate copy. No gameplay value,
    eligibility, projection field or intent id changed; the numeric realm order stays in the projection.

  Control files: the UI02R2 task definition was added (.codex/tasks/UI02R2.yaml, modeled on UI02R1),
  INDEX.yaml sequence gained UI02R2, UI03 blockers moved from [UI02R1] to [UI02R2] (UI03 remains
  blocked), and NEXT_TASK.yaml on this branch now dispatches UI02R2 with the UI02R1-chain baseCommit
  recorded. The UI02R1 leak-sample test's "mortal" entry was replaced with per-run fixture values
  (npc:core:mentor, hint_cause) because the six contract realm ids are now legitimate presentation
  table keys; tests/ui02r2.test.mjs pins exactly which contract enum keys may appear, that per-run
  values still never appear, and the verbatim-fallback behaviour.

