changes:
  packages/core/src/director.ts:
    - "DirectorRules gains contextualGapScenes: number (declared directly after randomDangerGapNodes)."
    - "Added function contextualGapGate(state, rules): returns true when state.run.director.recentScenes.slice(-rules.contextualGapScenes) contains a record with slot === 'P5'; returns false when the window is <= 0. Pure read; no RNG, no state write."
    - "scoreDirectorEvent: added one branch immediately after the existing core-npc-repeat-gate branch, so P4 semantics are untouched: if (slot === \"P5\" && contextualGapGate(state, rules)) return { eligible: false, weight: 0, reasons: [], actorIds: [], buildIds: [], riskTier, exclusionReason: \"contextual-gap\" };"
    - "No other line of the selector, scorer, or index mapping changed; no weight or precedence constant was edited."
  packages/content/src/director-v1.ts:
    - "validateDirectorPack: 'contextualGapScenes' added to the exact() rule-key whitelist and to the integer() range loop."
    - "validateDirectorPack: the frozen-v1 equality check extended to '|| rules.contextualGapScenes !== 2' with the existing 'v1 pacing constants are frozen' message."
    - "DIRECTOR_V1.rules: added contextualGapScenes: 2."
  .codex/contracts/director.ref:
    - "Appended one paragraph documenting the P5 contextual-gap gate: it counts DirectorSceneRecords rather than node distance, exists because the P5 tier is otherwise populated at essentially every action node, reads only the bounded recentScenes ring, changes P5 candidate eligibility only, and adds no state, counter, timer or RNG draw. v1 value contextualGapScenes = 2."
  tests/director.test.mjs:
    - "5 seed-slot corrections only (P5 -> P6), 5 lines changed. Five pre-existing tests seeded a P5 DirectorSceneRecord and then scored a P5 candidate to assert scoring behaviour; the new P5 gate now correctly short-circuits that path before scoring, so the seeds were changed to P6 to keep each test exercising the scorer rather than the gate. Asserted behaviour is unchanged (T17 continuity 4 / weight 180, T21 major-gap, T22 danger-gap all still observed)."
  tests/loopfix02c.test.mjs:
    - "New 15-test suite C-A..C-O covering rule presence/value 2, versioned validation and the frozen-v1 pin (3 / NaN / -1 / 2.5 / missing all rejected), gate on 1 and 2 trailing P5 records, reopening after exactly two non-P5 scenes, P5-only scope (P4 and P6 never report contextual-gap), zero RNG consumption and zero state-shape growth, strict precedence preservation including P2 winning on first-run and P6 fallthrough, P6 selection when P4 is empty and P5 is gated, P5 not being blanket suppressed, an alternating 40-step sequence proving P6 is no longer starved, P4 eligibility equivalence with and without a trailing P5 record, a 23-key deep-equal of the frozen rule table, determinism and order-independence, absence of new persistent state, and a source-level assertion that the gate reads rules.contextualGapScenes and recentScenes, inspects slot === 'P5', consumes no RNG, and is wired as slot === \"P5\" && contextualGapGate(state, rules)."
  package.json:
    - "Added script test:loopfix02c and appended tests/loopfix02c.test.mjs to the aggregate test file list."
