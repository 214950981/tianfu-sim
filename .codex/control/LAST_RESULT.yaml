recommendedCommitMessage: |-
  feat(ui02r2): polish RUN_HOME hierarchy, rhythm and Chinese presentation labels

  Presentation-only refinement of the 2.0 dev preview on top of the accepted
  UI02R1 one-screen structure. No Core, Content, Director, server projection,
  shell intent, route or contract change; the layout audit, the WXSS
  compatibility audit and every UI02R1 structural contract pass unchanged.

  Visual hierarchy and rhythm:
  - hero: realm name is the only large type (52rpx/600); the realm order
    renders 第N境 in the single gold accent, and order 0 renders 未入修行
    instead of the old "第 0 境".
  - vitals: one divided strip, values 30rpx/600 ink, labels faint 20rpx.
  - attention: retitled 眼下要务 with a gold mark; tags become chips.
  - dock: the breakthrough CTA is now the single solid-ink primary control;
    the four core actions stay uniform light outline secondaries. Shared
    --radius-card: 8rpx for buttons and cards; frozen --radius stays.
  - rhythm tokens raised within the audited budget (320x500 worst case still
    fits with 34.6px slack); touch floors and the 20rpx floor untouched.

  Chinese presentation labels:
  - new label tables mirror only structural contract enums (realm ids with
    the official content displayNames, build stages, condition kinds,
    affinity/trust semantics, roles, participant slots, risk tiers, known
    reason keys, death causes, archive entry kinds).
  - presentLabel() falls back verbatim for unknown ids; per-run fixture
    values and narrative content keys are never mapped — this is not a locale
    layer and invents no copy.

  Tests: new tests/ui02r2.test.mjs (15 tests) pins the enum coverage, the
  verbatim fallback, the absence of per-run values and narrative keys, the
  rendered Chinese labels across RUN_HOME/EVENT/LIFE_ARCHIVE, and the polish
  structure. The UI02R1 leak-sample list now distinguishes contract enum keys
  from per-run fixture values. Full suite 329/329; layout audit 96/96; WXSS
  compat audit green; typecheck/lint/content-lints/secret-scan green.

  Control files: UI02R2 task definition added per the repo pattern; INDEX
  sequence updated; UI03 blockers moved to UI02R2 (UI03 stays blocked);
  NEXT_TASK dispatches UI02R2 based on the UI02R1 result head 9ecb7d1.
  Manual visual QA in DevTools is still required and documented as not
  performed here.
