summary: >-
  UI04C wires the accepted UI03/UI04A/UI04B client runtime to a real RPC boundary for the first time, as
  one complete vertical slice, and proves the whole round trip with an injected cloud-call API instead of
  a deployed backend.

  TRANSPORT. packages/wechat-shell gains createWeChatCloudTransport({ api, cloudFunctionName }) over an
  injected "callFunction", exactly the way createWeChatPlatformStorage binds an injected storage API. The
  neutral package still names no platform global: it never mentions wx, it only calls the function it was
  handed. Three operations - createRunOffer, fetchView, sendCommand - and every response is validated
  before it is returned: structural checks, contract-enum checks, cross-field consistency (the offered
  runId/rulesVersion/contentVersion must equal the returned ViewModel's), and a recursive, depth-capped
  refusal of any server-only key (rootSeed, rngState, drawIndex, echoBudget, salience, selectorWeights,
  futureEventIds, checkSpec, difficulty, effectSpec, internalTrace, antiCheat, hiddenCause(s),
  specialNotes, serverSecret). Anything else raises TransportProtocolError instead of being handed on, so
  the controller never sees an unvalidated settlement wrapper.

  BOOTSTRAP. bootstrapWeChatRun() returns session { playerId, runId, rulesVersion, contentVersion,
  clientBuild } plus the authoritative PublicViewModel. runId and the locked versions come from the server;
  playerId and clientBuild are client facts supplied by the caller. There is no second source of run truth
  and no secret crosses the boundary.

  DESTINY_OFFER -> START_RUN. The server already publishes the authoritative offer as currentInteraction
  (interactionId === the run's offerId, one option per offered candidate), so the client derives START_RUN
  from it and nothing else: the chosen option must be one the server offered, exactly one published
  candidate may own it, innate offers key on selectionId, legacy offers on destinyId, and a candidate that
  publishes both is refused rather than guessed at. START_RUN still goes through
  CommandSubmissionController, so commandId / pending / retry / conflict semantics are unchanged.

  PAGE. miniprogram/pages/v2-live/ (js, wxml, wxss, json) is registered LAST in app.json;
  pages/start/start stays first and the tabBar is byte-identical. It loads the generated artifact through
  the static literal require("../../runtime/index.js") and imports nothing outside miniprogramRoot. One
  coherent chain: bootstrap -> 择命 -> START_RUN -> RUN_HOME -> core action -> EVENT/SPECIAL_NODE -> option
  -> authoritative refresh, plus server-projected breakthrough, LIFE_ARCHIVE open/close, loading and
  submitting, transient retry, STATE_CONFLICT refresh with explicit reconfirmation and a fresh commandId,
  and a bounded fatal / bootstrap error state. Every page state, action, option, risk tier, breakthrough
  flag and archive row is read out of the PublicViewModel; the page computes no outcome, risk,
  eligibility, odds, RNG, RuleState, Director or Cause resolution - it only formats.

  PROOF. tests/ui04c.test.mjs contains one fake, the injected callFunction, and it only forwards
  { name, data } to the REAL CommandGateway, ServerViewModelBuilder and reducer, so every ViewModel the
  client sees is authoritative. The page harness loads the committed v2-live.js itself - as CommonJS in a
  node:vm realm with Page and wx stubbed - so the code under test is the code WeChat will run.

  ARTIFACT. Client-safe source changed, so miniprogram/runtime/ was regenerated with
  "npm run ui04b:artifact:write"; freshness, audit and smoke are green, the UI04A closure audit is green,
  and the facade grew by exactly the three names the live seam needs (createWeChatCloudTransport,
  bootstrapWeChatRun, TransportProtocolError), which the generator allow-list, the smoke's independent
  literal and tests/ui04b.test.mjs all pin.

