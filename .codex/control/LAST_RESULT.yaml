toolingObservations:
  - >-
    WXML chain semantics are the trap in this fix: an wx:else binds to the immediately preceding
    wx:if/wx:elif SIBLING, so placing a fallback after an unrelated chain silently changes what it
    matches. A regression test for this class must model the chain, not grep for wx:else.
  - >-
    When walking a WXML chain backwards to find its head, stop when the CURRENT element is an wx:if.
    Testing the PREVIOUS element instead walks past the chain head into the preceding chain and
    evaluates the wrong chain - it produced a wrong negative-control result here first.
  - >-
    A vm fixture for a WXML conditional test must supply every field the condition dereferences. A
    null terminal projection made all four terminal branches unreachable and the negative control
    "leaked" on all eight states - a fixture artefact that looked like a product bug.

