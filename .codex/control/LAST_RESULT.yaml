summary: >-
  SIM02 attempt 1 verification-only run. Executed exactly 600 deterministic CONTENT01 simulation runs through
  the repository's existing tools/content-sim.mjs path (6 policies x seeds 0..<100, maxActions 50); config
  recorded verbatim above and byte-identical across two independent invocations. Independently recomputed
  director slot reachability from the ordered per-scene log: P2=1200 P3=1329 P4=17371 P5=7133 P6=0 P1=0. 10 of
  the 11 acceptance criteria PASS. The single unmet criterion is P6-observed-at-least-once: P6 was selected 0
  times in the required 600 runs and 0 times in a 1800-run escalation control. Root cause proven on the live
  run, not inferred: selectDirectorEvent iterates its slot list in strict order and returns at the first slot
  with an eligible candidate, while the reducer offers [P4,P5,P6]. Across 5205 action-driven nodes the P4 tier
  was empty 3383 times, and at every one of those nodes the P5 tier still had an eligible candidate (P5
  populated at 5205/5205 nodes). The P5 'contextual' and P6 'ordinary' index slices are disjoint - 12 events
  each, zero overlap - so P5 cannot exhaust P6's pool, and scoreDirectorEvent marks any unblocked candidate
  eligible through baseWeightDefault = 100. P6 is therefore shielded by strict precedence ordering, not by
  rarity; the ordinary fallback is effectively dead on CONTENT01 v1 under the accepted LOOPFIX02B3 rules. This
  is a Director precedence/index-slice matter, both inside SIM02 forbiddenScope, so per SIM02 design the task
  stops BLOCKED with evidence instead of widening scope. Note that LOOPFIX02B3's own accept criterion
  'gated-P4-with-no-P5-candidate-allows-P6-selection' is satisfiable in a unit fixture but not reachable in the
  shipped content pack - exactly the gap SIM02 was written to expose. The accepted LOOPFIX02B3 same-core-NPC P4
  repeat gate holds at scale: 0 violations across 11976 genuinely consecutive P4->P4 pairs, with all 600 per-run
  counters equal to an independent recompute. Cause echo/closure is healthy with no invalid regression
  (origins=1344 eligible=1329 echo=1329 resolved=1329 expired=0); no cause.invalid marker appears anywhere.
  Recurrence/terminal behaviour reported:
  endReasonDistribution={"death":82,"lifespan":0,"ending":0,"right_censored":518,"other":0} with 0
  ordinary-event repeat violations and 51 distinct events observed. Reporting-only instrumentation was added to
  packages/content/src/content-sim.ts because the shipped report exposed no scene ordering or scene actor ids,
  leaving the consecutive-P4 acceptance metric unobservable; it changes no rule, weight, precedence, RNG,
  content or balance value and writes nothing to state. No gameplay, rule or balance change was made. npm test
  249/249 and all audits remain green.
