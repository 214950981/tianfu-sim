recommendedCommitMessage: >-
  LIVEFIX05: replace the terminal chain's wx:else with an explicit fallback condition

  The v2-live fallback block was an unconditional wx:else at the end of the TERMINAL condition
  chain, so it inherited that chain's fall-through: every non-terminal state matched it. On a real
  DESTINY_OFFER cloud session the page therefore rendered the offered candidates and, below them, an
  unrelated "this page state comes from the server projection" note.

  An wx:if opens its own chain, so making the condition explicit both fixes the leak and makes the
  intent checkable. The fallback now requires !isOffer && !isHome && !isDecision && !isTerminal,
  which no view-backed state can satisfy; only a genuinely unknown server projection still reaches
  it, and that is the case the copy was written for.

  tests/livefix05.test.mjs models real WXML chain semantics and asserts the fallback is absent for
  all eight known page states, present for an unknown one, structurally a wx:if chain head, and that
  the former terminal-chain wx:else leaks on exactly the four non-terminal views. Server-projected
  option lists, onOption and the ending/life-book/rebirth advance CTAs plus the explicit next-life
  CTA are all asserted preserved.

  Gates: livefix05 6/6, ui04c 18/18, wxss-integrity, package-closure, package-mirror, route-guard,
  lint, secret-scan all PASS. No visual QA, no redeploy, no cloud invocation. The pre-existing local
  dirty files remain uncommitted per the Controller disposition.