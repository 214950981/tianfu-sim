summary: >-
  PLAYCHECK02 is a verification-only pre-UI playability audit of the accepted LOOPFIX02C rules. No gameplay
  code was changed. I built a deterministic trace probe that replays the exact content-sim.mjs loop
  (identical ACTION_PLAN, initial fixture, choose() policy mapping and shouldAttemptBreakthrough() gate) while
  additionally projecting director scenes, Cause lifecycle, NPC state, Build evidence/transitions, risk
  conditions and death records per step. The probe was validated against the repository's own simulator before
  being trusted: 30/30 runs matched exactly on realm, death category, node count and slot distribution
  ({"P1":0,"P2":60,"P3":57,"P4":708,"P5":286,"P6":256}), 0 mismatches.

  A 30-run sample (6 established policies x seeds 0-4, maxActions 50, include-runs) completed deterministically:
  two invocations were byte-identical, runtimeFailures=0, deadlocks=0, AI calls=0, and all 6 policies are
  represented. The 12 fixed representative traces (cautious/aggressive/sword_seeking/body_seeking/
  alchemy_seeking/fortune_seeking at seeds 0 and 4) were deep-read.

  Verdict: PASS. No reproducible structural playability defect was found. Every acceptance item is satisfied,
  including both regression guards carried over from LOOPFIX02C: sameCoreNpcConsecutiveP4Count=0 across 708 P4
  scenes and p5ContextualGapViolations=0 across 286 P5 scenes. Cause is healthy (58 instances, invalid=0,
  observable dormant->echoed->resolved chains). Risk and death are fully explainable (4/4 deaths carry a
  RISK01 trace with threat id, outcome tier, rngRoll, effectiveDifficulty, modifier sources and lethal=true,
  plus 2 populated warningFacts each, resolved only on an explicit player take-risk choice). Progression,
  Build formation and NPC accumulation are all reachable in representative traces.

  Eight non-blocking observations were recorded as BACKLOG and deliberately left unfixed, per the task's
  decision rule that only a reproducible structural playability defect blocks UI02:
  B1 cautious never forms a Build nor creates a Cause in 5/5 runs (all four affinities exactly 0, dom=none,
  causes=none) because choose() maps cautious to consider and never selects a build-affinity engage option,
  so the policy produces a structurally flat identity-less life; this is test-harness policy expressiveness,
  not a rules defect.
  B2 alchemy_seeking ends both traced runs at spirit-transformation with cultivationFinal=0, and 8 runs sample-
  wide finish at cultivation 0.
  B3 progression tracks policy path more than cultivation investment: fortune_seeking reaches the highest
  realms observed (golden-core x4) with the lowest action count for a surviving policy, while cautious, which
  maximises cultivation to 10000, only reaches nascent-soul.
  B4 Cause echo richness is exactly 1 in practice: 57/58 causes finish finalEcho=1 and the starting echoBudget
  of 2 is never fully consumed, so multi-echo causes are unreachable; a resolved cause additionally keeps
  re-emitting an identical resolved@node#e1 log line every subsequent node (resolvedTail avg 57.28 entries,
  max 96), which is correct semantics but semantically noisy bookkeeping.
  B5 generated NPCs are inert: 173 instances, knownFacts>0 = 0, knownTraits>0 = 0, promotedToA = 0, encounter
  histogram {1:22, 2:84}, i.e. they cap at 2 encounters and never accumulate knowledge or promote.
  B6 maxAge is never the terminator: 26/30 runs right-censor at the 50-action harness cap and observed ages
  span 44-151 against maxAge values of 120-500, so no life ends from its lifespan ceiling.
  B7 Build stage regression is contract-legal but frequent: 10 regressions (refined->formed, emerging->
  latent) because build.ref makes stage a derived function of a mutable affinity that "may rise or fall";
  a design-feel question only, with 0 contract violations.
  B8 P4 and P5 event sets overlap heavily: 32 of 42 distinct P5 events also appear under P4, which is
  eligibility-driven by design but reduces slot distinctiveness.
  One further cosmetic note: warningFacts for a poison or special death carry risk.reason.injury as their
  second fact. risk.ref does not pin the content of that array, the category fact is correct in every case
  (risk.category.poison / risk.category.special), and no lethal resolution occurred without a warning, so
  this is naming verbosity rather than a contract breach.

  Deliberate non-actions respecting scope: no gameplay rule, Director precedence, Director weight or gap,
  CONTENT01 content, Cause semantic, NPC state machine, recurrence rule, Build/Risk/Progression number, new
  RNG, new persistent state or UI02 work was touched; the 600-run suite was not rerun; no report-only
  instrumentation was needed because every acceptance observation was reachable from the existing trace
  surface.

