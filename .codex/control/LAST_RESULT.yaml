verification:
  automated:
    - command: node tools/ui02r1-layout-audit.mjs
      proves: >-
        Structural: page-overflow policy, scroll ownership per page state, dev layer outside the
        product flow, four-action dock, gated breakthrough CTA, safe-area reservations, touch-target
        and readability floors, string clamping, and a first-screen budget that fits all six matrix
        viewports with the safe area reserved. It is code-derived (re-parsed from the WXSS) and has its
        own negative controls, so a green run is falsifiable rather than tautological.
    - command: node tools/wxss-compat-audit.mjs
      proves: >-
        That the stylesheet stays inside the WXSS-supported syntax subset: no universal selector, no
        attribute selectors, no parameterised pseudo-classes/pseudo-elements, selectors limited to the
        documented forms, at-rules limited to @media, media conditions limited to
        (min|max)-(width|height) px, and an explicit border-box on every box the derived requirement
        covers.
    - command: node --test tests/ui02r1.test.mjs
      proves: >-
        Both audits are green and non-vacuous (14 + 7 negative controls), that the preview fixture the
        page loads is the generated artifact and identical to the JSON and to a fresh generator run,
        that the fixture is loaded with a statically analysable literal require and that no miniprogram
        module uses a non-literal require (syntactic guard with its own positive and negative controls,
        including one that rewrites the real call site), that a load failure is reported with a
        sanitized staged diagnostic (behaviourally tested by running the page's own sanitizer), that
        every page the fixture can load projects a discriminator the committed markup actually tests
        (executed, not text-matched: the page module is loaded in a vm with the real fixture module and
        its own onLoad/onSelectTab handlers are driven, with six negative controls including the
        committed source with the kind assignment deleted), and byte-equivalence of every out-of-scope
        tree to the task base.
    - command: node tools/ui02-preview-fixture-module.mjs
      proves: >-
        The committed fixture module and its JSON sibling are exactly what the real generator produces
        right now, AND that the entry point requires "./v2-fixtures.js" with a static literal, that the
        diagnostics constant equals that literal, and that no miniprogram module uses a non-literal
        require argument.
    - command: npm test
      proves: "No regression anywhere else in the repository (314/314)."
  structuralInference:
    - >-
      The first-screen budget is a box-model computation over the committed token values, not a
      rendered measurement. WeChat's flex/scroll-view sizing, font metrics and ellipsis behaviour are
      assumed to follow standard behaviour; the audit asserts the structural preconditions, not the
      rendered pixels.
    - >-
      Safe area is modelled with a 34 px worst-case home-indicator reservation. The actual inset is a
      device value supplied by env(safe-area-inset-bottom) at runtime.
    - >-
      tools/wxss-compat-audit.mjs is a curated subset check derived from the WXSS documentation plus
      one observed compiler error. The real WXSS compiler is not available in this repository, so this
      tool can prove the absence of the known hazards and of the constructs the file deliberately
      avoids — it cannot prove the stylesheet compiles.
    - >-
      The fixture module's freshness, byte-equality with the JSON and CommonJS loadability are proven
      here by executing the generator and the module in Node. The page's own behaviour in the WeChat
      sandbox (that require() of the module resolves at runtime) is inferred from module placement and
      the standard CommonJS form; only a DevTools run confirms it.
    - >-
      The static-require guard analyses source syntax, not a runtime. It proves the argument is a plain
      string literal and that the literal resolves to the committed module relative to the page; it
      cannot execute the WeChat packager, so the packager's acceptance of that call is still inferred.
      The guard is also fail-closed beyond the bug it was written for: concatenation, template literals
      and computed arguments are all rejected, even though only the variable form has been observed to
      fail.
    - >-
      The discriminator guard proves that the value present() produces is one the committed markup
      tests, by executing both. It does not prove the WeChat template engine evaluates those wx:if
      expressions the way Node evaluates the equivalent JavaScript, nor that the matching branch renders
      correctly once it is reached — it removes the "no branch can ever be true" failure mode, which is
      the one observed, and leaves rendered pixels to the manual pass. The PAGE_KIND_BY_PAGE_STATE table
      is exhaustive for the page states the current fixture uses; a future page state that is not added
      to it fails closed (present() returns null and the view-stage diagnostic reports it) rather than
      rendering a blank surface.
  manualVisualQaRequired:
    status: NOT PERFORMED
    statement: >-
      No device or simulator rendering was executed in this sandbox. The automated results above are
      structural only and must NOT be read as "verified on all phones". The three DevTools attempts that
      prompted the repairs in this branch were performed by the controller/user, not here, and each
      failed differently (WXSS compile; fixture load; blank product surface). A human must still confirm
      the following in WeChat DevTools / on a real device before UI02R1 is treated as visually accepted.
    items:
      - "Compile once in WeChat DevTools, confirm no WXSS syntax error appears, and confirm the preview page enters RUN_HOME with VISIBLE product content — identity/lifespan header, cultivation status, attention summaries and the four-action dock. This is the authoritative check for the WXSS subset audit, the fixture load path, the static require and, now, the product page discriminator; none of the tools can prove the rendered result."
      - "Switch through all four views (修行主页 / 事件 / 特殊节点 / 命书) and confirm each renders its own page with content rather than an empty surface. A blank surface with no failure panel is the shape of the defect this commit fixes, so report it immediately if it reappears."
      - "Switch to 突破未成·变体 and 能力缺省·变体 and confirm both render the 修行主页 layout (not a blank surface) and that the four actions keep exactly the same position as the normal RUN_HOME."
      - "If the failure panel does appear, report its 阶段 / 代码 / 详情 / 模块 / 提示 verbatim — it is bounded and sanitized by design, so it contains no secrets and is the intended rework input. If the error is still a module-resolution error, note the exact wording: that distinguishes a packager dependency problem from a genuine throw inside the fixture module."
      - "Open the preview route and confirm RUN_HOME cannot scroll vertically at all (no page displacement on drag)."
      - "Step through 320x500, 360x560, 375x603, 390x750, 414x820 and 430x850 in the device simulator; confirm core status and all four actions are first-screen visible with no horizontal scrollbar, and that removing the blanket border-box reset did not change the expected box heights."
      - "Confirm the four core action blocks and the breakthrough CTA still feel >= 44 CSS px and that text was not shrunk to fit."
      - "Tap each summary row and confirm the read-only drawer opens from the bottom, scrolls internally, closes on 收起, and changes nothing about the product layout behind it."
      - "Open the dev overlay and confirm it overlays the product without moving it; switch views and confirm the overlay collapses."
      - "Enter 事件 / 特殊节点 and confirm long body copy scrolls only inside the decision viewport while the headline stays pinned."
      - "Enter 命书 and confirm it scrolls internally without moving the page."
      - "On a device with a home indicator, confirm the action dock and the event options are not covered by the indicator."
    docs: docs/UI02_PREVIEW.md sections 4.6, 4.7 and 6

