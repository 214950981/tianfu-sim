toolingObservations:
  - >-
    生成目录 tools/content01-zh-cn-module.mjs 在新增 content 文案后会报 STALE，必须 --write 重新生成后再跑
    freshness，否则客户端 resolveCopy 静默返回空串，表现为「文案没改」的假象。
  - >-
    miniprogram/pages/v2-live/content01-zh-cn.js 导出的是 [key, copy] 键值对数组，不是对象；测试里读它
    必须先 Object.fromEntries，否则每个键都查不到。
  - >-
    route-guard / closure / 文案类断言会把 WXML 与 JS 注释当代码扫描。注释中逐字引用被禁字符串会被判为
    真实违规；注释要绕开写法，测试断言也要先剥掉注释。
  - >-
    用 createOfferedRun + destinyId 起局会留下 identity.innateProfile === undefined，而 viewmodel 的
    specialActions 对没有 innateProfile 的局一律返回空数组。要测首页突破入口，必须用
    generateServerDestinyOffer + selectionId 起局，否则会「证明」凡人局显示「此境已无常规前路」是正确行为。

