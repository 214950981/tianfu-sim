recommendedCommitMessage: |-
  fix(ui02r1): project the product page kind the WXML actually switches on

  Fourth repair on this page, and the first one that was not a compile or load
  failure. Manual DevTools review of the previous commit showed the fixture
  loading, the failure panel gone and the debug overlay reading a real
  vm.gatedEntries — and every product page completely blank.

  Root cause, a shape mismatch between the projection and the markup: present()
  returned a base object with `pageState` but no top-level `kind`, while all
  four product branches in the WXML test `vm.kind`. vm was non-null and fully
  populated and every branch was still false, so the surface rendered nothing
  and — because nothing had actually failed — no diagnostic fired.

  The fix is the smallest consistent one:

  - New PAGE_KIND_BY_PAGE_STATE translates the server-authoritative pageState
    into the product page kind the markup switches on, and present() emits it
    as the top-level `kind` next to the untouched `pageState`.
  - The translation is explicit rather than implicit because the two
    vocabularies are not identical: page-state.ref keeps ENDING and
    LIFE_ARCHIVE distinct and the fixture's ended run projects ENDING, so using
    pageState directly would have left LIFE_ARCHIVE blank.
  - RUN_HOME variants carry pageState RUN_HOME and so keep kind RUN_HOME, which
    is asserted; a fixture key is never used as a kind.
  - A page state with no product page now fails closed and is named by the
    reworded view-stage diagnostic instead of rendering a blank surface.

  The guard is behavioural, not textual. tests/ui02r1.test.mjs loads the page
  module in a vm whose require returns the real generated fixture module,
  extracts the discriminator vocabulary from the committed WXML, and requires
  every emitted kind to match a WXML branch and every branch to be reachable.
  It also drives the page's own onLoad/onSelectTab handlers for every dev tab
  and requires failure === null plus a matching kind — the closest automated
  reproduction of what the human saw. Six negative controls keep it honest,
  including one that deletes the kind assignment from the COMMITTED page
  source and requires the guard to reject the resulting blank surface.

  Scope: two files. miniprogram/pages/v2-preview/v2-preview.js and its own
  suite. WXML, WXSS, page json, generated fixture module and JSON, both audit
  tools, the fixture generator and package.json are unchanged. No server
  projection, wechat-shell intent mapping, Core, Content, Director, contract or
  route change; no transport wiring, no new dependency, no RNG draw. UI03 was
  not started.

  Verification: 314/314 npm test, 32/32 ui02r1, 96/96 layout audit, 14/14 WXSS
  compatibility audit, fixture freshness + require-contract check green,
  18/18 ui02, 6/6 viewmodel-ui,
  typecheck/lint/content-lint/content01-lint/secret-scan green. Manual visual QA
  in DevTools is still required and is documented as not performed here.
