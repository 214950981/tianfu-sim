summary: >-
  UI02ENTRY is a UI_FAST_LANE presentation task that extends the accepted UI02R2A2 visual system to the
  pre-run flow START -> MODE_SELECT -> DESTINY_OFFER -> RUN_OPENING, so a reviewer can see a coherent
  launch-to-entering-a-life experience on the same 2.0 dev preview route. It adds no game authority, no
  transport wiring and no route change.

  Where the data comes from (one generated truth, no second gameplay copy):

  - DESTINY_OFFER is the REAL public server offer: the fixture is built with the same production chain as
    the accepted in-life fixtures (generateServerDestinyOffer -> reduce(START_RUN) ->
    ServerViewModelBuilder.build -> buildWeChatPageShell), and the resolved public candidate fields come
    from projectDestinyOfferView. The page renders exactly the public fields the accept contract names
    (spiritualRoot / talent / majorDestiny display names plus the server-projected option id) and nothing
    else. tests/ui02entry.test.mjs rebuilds the dev offer with an INDEPENDENT call of that same chain and
    asserts the committed fixture equals it, then scans the whole entry collection for any seed, RNG
    state, draw index, weight, odds, difficulty or rule-internal key/value.
  - MODE_SELECT invents no mode: it renders the contract capability vocabulary (main contract flow plus
    今日命局 / 商行 / 分享此命) and READS availability from the accepted shell projection
    (buildWeChatPageShell.visibleEntries). A capability-off entry is rendered as clearly unavailable and
    names the missing capability; the main flow is always available. The page declares exactly four mode
    ids and no other.
  - RUN_OPENING formats only already-public data: the selected spiritual root / talent / major destiny
    (resolved display names, never raw ids), the run name, lifespan and the four public attributes. No
    START_RUN outcome is re-derived and nothing is submitted.
  - START reads no state at all. Its copy is documented product copy, and provenance is asserted against
    the documents: the core line and the positioning line must appear verbatim in docs/PROJECT-BRAIN.md
    and the product name in docs/UI02_PREVIEW.md, so the copy cannot drift into invented lore or promises.

  Fixture layout (one deliberate structural decision): the four pre-run screens live in a NEW `entry`
  collection rather than in `states`. START and MODE_SELECT happen before any authoritative Run exists, so
  the server has no PageState or ViewModel to project for them (derivePageState only knows run status and
  the current interaction); putting them in `states` would force a fabricated run into every pre-run
  screen. With `entry` separate, `states`/`variants` stay exactly "server-authoritative pages" and the
  in-life fixture assertions are untouched. DESTINY_OFFER inside `entry` really is a server page state
  (run.status === "offered").

  Presentation (reusing the accepted language, not a new one): each screen is a `.page` flex child of
  `.surface`, so the one-screen policy is structural rather than per-screen. The per-screen primary
  control `.entry-cta` carries the same solid-ink treatment as the breakthrough CTA without reusing that
  class; list rows read as chips; candidate cards are raised comparison surfaces whose selected state is
  carried by an inset fill plus a strengthened edge rather than colour alone. Two bounded scroll regions
  (mode list, candidate list) reuse the accepted `.attention-scroll` pattern, so below the baseline they
  degrade into internal scroll instead of hidden clipping. No new media band was introduced and no frozen
  token, interaction floor or readability floor changed; the only new tokens are the `--entry-*` rhythm
  tokens, declared once.

  Honesty about the one-screen claim: the layout audit gained a second, per-screen budget table
  (ENTRY_STACKS) summed from the same tokens the stylesheet consumes, worst case per screen (full mode
  vocabulary / full candidate set / primary action available, including the margins and paddings each
  screen really renders). At the supported baseline 320x500 the tightest screen is DESTINY_OFFER at
  351.6px + 34px safe-area of 500px (114.4px slack); the other three leave more. That proves the budget,
  not the rendering — see the manual checklist note below.

