summary: >-
  UI04A removes the client runtime's dependency on the gameplay Core package. UI03's accepted
  CommandSubmissionController reached the command/envelope wire codec through the Core barrel
  (`packages/core/src/index.ts`), which drags reducer, state, rng, destiny, event, cause, progression,
  risk, build, npc, director and participants into a real miniprogram bundle. That edge is now gone.

  The codec was MOVED, not copied, into a new lower-level client-safe package
  `packages/command-wire/src/index.ts`: GameCommand shapes, CommandEnvelope, CommandResult,
  APP_ERROR_CODES, CommandValidationError and the four functions validateGameCommand /
  validateCommandEnvelope / serializeCommandEnvelope / parseCommandEnvelope. That module has NO IMPORTS
  AT ALL - not even from `packages/core` - which is what makes the boundary real rather than a
  re-pointed import. There is still exactly ONE validator and ONE canonical serializer in the
  repository: `packages/core/src/command.ts` is now a compatibility re-export of that module, and
  `tests/ui04a.test.mjs` asserts object identity (`core.validateGameCommand === wire.validateGameCommand`
  and the same for every other binding), so the shim can never drift into being a parallel definition.

  Compatibility: reducer.ts, persistence.ts, the Core barrel and server/src/command-gateway.ts keep
  their original import specifiers untouched and observe identical behaviour. Only two client files
  changed their specifier: application-ui now imports the codec at runtime from `command-wire`, and
  wechat-shell points even its *type-only* command import there, so neither package has any import of
  any kind into gameplay Core.

  A machine-executable runtime-dependency audit was added (tools/ui04a-client-runtime-audit.mjs). It
  walks the RUNTIME import graph from application-ui and wechat-shell, failing on any reach into
  `packages/core/**` (barrel and compat shim included), `packages/content/**` or `server/**`, and it
  fails closed on an unresolvable relative specifier. `import type` is erased by the compiler and is
  therefore not an edge - and that is proven, not asserted: the audit is driven to a NON-ZERO exit by
  tests/fixtures/ui04a-client-runtime/forbidden-edge.ts (a real runtime import of
  packages/core/src/reducer.ts, reported together with the whole transitive gameplay closure) and to a
  ZERO exit by tests/fixtures/ui04a-client-runtime/type-only-edge.ts (a type-only import of GameState).
  The audit also requires the real client closures to still contain `packages/command-wire/src/index.ts`
  (and wechat-shell to contain application-ui), so a closure that stopped importing anything cannot pass
  vacuously.

  Protocol behaviour is frozen, not argued. Before writing the expectations, the codec was compared
  against a pristine `git archive caff831` tree with a 37-line behaviour matrix covering valid and
  invalid envelopes for the four named commands plus every rejection path; output was byte-identical,
  including every error message and code. See tests/ui04a.test.mjs UI04A_wire.

  Scope honesty: `packages/core/src/command.ts` genuinely changed (it is now a re-export), so the two
  pre-existing Core digest pins that guard against gameplay drift had to be updated on purpose -
  tests/ui02r1.test.mjs's `packages/core/src` entry (plus application-ui and wechat-shell, which really
  did change) and tests/ui02.test.mjs's `packages/core/src` entry - and each is disclosed in the test's
  own comment as its comment requires. A third, subtler consequence was found and fixed rather than left
  broken: tools/phase2-drift-audit.mjs asserted that the literal `ATTEMPT_BREAKTHROUGH` is present in
  packages/core/src/command.ts, which is now a pure re-export. That check was re-pointed at
  packages/command-wire/src/index.ts (the module that now owns the marker) instead of being deleted; it
  was verified to return overall PASS, and the same change was verified to make the audit go from PASS
  (untouched base) to BLOCKED (before the fix), so the audit is still meaningful and the fix is not
  cosmetic. Nothing else moved: packages/platform-contract/src, server/src, packages/content/src, the
  1.0 pages, miniprogram/app.json and the preview surface are byte-identical to the base.

  NOT DONE, BY DESIGN: no miniprogram page wiring, no wx.request, no cloudfunction or production
  deployment, no default-route change, no legacy 1.0 page change, no UI04B work, and no gameplay rule,
  reducer, RNG, Director, Cause, Progression, Risk, Build, NPC, Content or server ViewModel semantics
  were touched. The boundary and the remaining UI04B work are documented in
  docs/UI04A_CLIENT_WIRE_BOUNDARY.md.

