summary: >-
  完成锁定设计的 B、C、D 三阶段，E 阶段部分完成。B1 首页现在显示服务器已解析的灵根名、境界、修为/10000
  差额、剩余寿元、伤势层数，以及一句由服务器 specialActions 决定的近期目标和被禁用突破按钮的中文原因
  （未知枚举退化为「暂不可行」，绝不打印 key）。B2 结算面板按 eventId + choiceId + appliedTier 读取 Content
  包授权的已结算过程文案，严格按合同顺序 事件→选择→经过→真实变化→后续→继续 呈现；人生书每一条记录附上
  该存档选项的实际结算句，开场 body 不再被当作结局。B3 二十场全部施工完成（18 场选项级 settlements +
  2 场风险场 tierSettlements），风险场 success/costlySuccess/failure 分层赔付，两处道途场的准备/退出改为
  记进度与耗时间。B4 去掉「第 N 节点」技术标签与三个重复的黑色决策按钮（选项卡片本身成为点击目标），
  死因区分寿尽与提前终结并点名未尽的年数。C 阶段用同一 measurement v2 装置重跑同 18 局，状态指标与 before
  一致——本轮改的是可见性而非数值，这一点在报告 §5 明确说明，未改善项在 §6 逐条列出，不标为已修。

