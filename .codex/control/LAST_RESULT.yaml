      退化；早死/寿尽的死因文案；模板去掉技术标签与重复按钮；二十场全覆盖与其余 46 场零改动的范围守卫；
      风险分层赔付；客户端目录与源文案逐字节一致。
  - file: docs/PLAYFEEL01-AUTOPLAY-REPORT.md
