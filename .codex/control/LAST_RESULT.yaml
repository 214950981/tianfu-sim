ebusyEvidence:
  summary: >-
    Classified as environment noise only after BOTH proofs the task requires, exactly as UI02FINAL did.
    Proof 1 - the exact three failures reproduce on the UNTOUCHED base tree. Proof 2 - every underlying
    direct tool succeeds when invoked from the shell.
  proof1_base_reproduction: >-
    The pristine base was materialised without touching any git ref: `mkdir .b2base/base && git archive
    ce916d7 | tar -x -C .b2base/base`, then `node --test tests/import-boundary.test.mjs tests/replay.test.mjs`
    with cwd inside that extracted tree. Result: identical failure names and identical class - "clean Core
    passes the import boundary", "forbidden Core fixture fails the import boundary", "replay CLI returns
    the verified final hash", with the last one printing
    `spawnSync C:\\Users\\...\\node.exe EBUSY`, code EBUSY. 8 tests, 5 pass, 3 fail - the same 3.
  proof1_reason: >-
    tests/import-boundary.test.mjs and tests/replay.test.mjs use spawnSync/execFileSync to launch a nested
    node.exe, which is the spawn class this sandbox blocks with EBUSY; they fail identically on code that
    UI03 never touched.
  proof2_direct_tools:
    - tool: tools/check-import-boundaries.mjs
      result: "exit 0, 'Core import boundary: PASS'."
    - tool: "tools/check-import-boundaries.mjs --root tests/fixtures/core-forbidden"
      result: "exit 1 with 'forbidden import' on stderr - the negative control the blocked test asserts."
    - tool: tools/replay.mjs
      result: >-
        exit 0. The blocked test's contentPack/setup/envelope/journey bodies were copied verbatim into a
        throwaway generator under .b2base/, which writes .b2base/replay-input.json and
        .b2base/replay-pack.json; the CLI was then run from the shell as
        `node tools/replay.mjs .b2base/replay-input.json .b2base/replay-pack.json`. It printed
        finalRuleStateHash 978d3e8b3caa46ced017a8e4d593af8a6f11b34107caafb1c1f871ca3a184534 with
        2 checkpoints; the in-process ruleStateHash(finalState) computed by the same verbatim journey is
        the identical 978d3e8b...534, which is exactly what the blocked test asserts (it also asserts
        checkpoints.length === 2). The throwaway generator is disclosed here as the substitute for the
        blocked in-process call; it is scratch, not a committed deliverable.

