recommendedCommitMessage: |
  LIVEFIX01: normalize real CloudBase empty-document reads and prove the empty-database first run

  - add one narrow classifier plus one shared read helper in the CloudBase store, used by readRun and by
    all four transactional read kinds (run, command receipt, bootstrap mapping, terminal receipt)
  - never swallow a missing COLLECTION: it shares the -502005 ResourceNotFound family, so the discriminator
    is the error shape and message, not the code
  - make the fake CloudBase harness reject a missing-document read the way production does, and keep the
    old empty-snapshot behaviour only as an explicit contrast mode
  - prove empty four-collection first createRunOffer, same-bootstrap retry, first command settlement and
    first terminal settlement, each exactly-once, plus 14 near-miss shapes that must stay fatal
  - regenerate the cloud runtime once after source stabilised; freshness, dependency audit and smoke green
  - document that all four collections may be empty and the first request creates its own documents
