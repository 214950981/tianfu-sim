recommendedCommitMessage: |-
  feat(ui02r2a2): recompose RUN_HOME into grouped game-home surfaces

  Presentation-only second visual pass on the accepted-pending UI02R2 tree,
  answering the three visual findings from the UI02R2 review. No Core, Content,
  Director, server projection, shell intent, application UI controller, route or
  legacy 1.0 page change; v2-preview.js is untouched, so the UI02R2 Chinese
  presentation-label layer and its verbatim fallback are intact by construction.

  Grouped surfaces with distinct roles:
  - hero is now a raised identity plate with the single cinnabar left edge.
  - vitals is one raised card with a full hairline edge and shared inset, so
    修为 / 道基 / 灵石 read as one cultivation-status component.
  - 眼下要务 is an inset sunken panel, and the four core actions sit on one
    recessed tray so they read as a single operation group.

  Compact identity treatment:
  - the realm order becomes a dark-gold bordered chip instead of loose text.
  - the lifespan becomes a rounded, clipped gauge instead of a numeric line.

  The dead middle gap is closed by responsive allocation, not by scrolling:
  - the priorities panel is the only flexible box, so unused height landed
    there as an empty field (136.2px at 390x750, 144.6px at 430x850).
  - the tall bands (min-height 750 / 820) now give that height back to the
    content by raising the non-interactive rhythm tokens, leaving 26.0 / 24.8 /
    25.4px (3.0-3.5% of the viewport) while the worst case still fits.
  - every unit of height added is expressed through the same tokens the layout
    audit sums, so the audited budget stays a true value, not an approximation.
  - no new media band; the six UI02R1 bands are unchanged.

  Tests: new tests/ui02r2a2.test.mjs (15 tests) pins the budget, the dead-space
  ceiling with a negative control that reverts the rhythm tokens, the unchanged
  band list, the per-viewport interaction floors, the distinct surface roles,
  the deterministic row marker and the preserved UI02R1/UI02R2 contracts.
  tests/ui02r1.test.mjs gains one explicitly named extra box-sizing entry
  because the priorities panel is now a definite-sized padded box.

  Fast lane: ui02r2a2 15/15, ui02r2 15/15, ui02r1 32/32, ui02 18/18,
  viewmodel-ui 6/6, layout audit 96/96, wxss compat 14/14, fixture freshness
  green, tsc 5.9.3 clean. Full suite was also run (341/344; the 3 failures are
  nested-spawn EBUSY environment failures that fail identically on the base).

  Manual visual QA in DevTools is still required and is recorded as not
  performed here; UI03 stays blocked.
