    detail: >-
      tsc is not a local dependency, so typecheck must run as npx tsc --noEmit rather than
      node node_modules/typescript/bin/tsc. Carried forward from LOOPFIX02C.
  - id: TIMEOUT-BINARY-MISMATCH
    severity: info
    detail: >-
      Windows timeout is not coreutils, so time-boxed commands must use spawnSync timeout rather than the
      timeout binary. Carried forward from LOOPFIX02C.
  - id: SHELL-UTILS-UNAVAILABLE
    severity: info
    detail: >-
      In this sandbox bash cannot resolve dirname/ls/grep/head/tail, so node -e is used as the shell and
      tsx is unavailable in favour of node --experimental-strip-types.

recommendedCommitMessage: |-
  chore(playcheck02): record lightweight pre-UI playability verification as PASS

  Verification-only audit of the accepted LOOPFIX02C rules. No gameplay code changed.

  - Validated a deterministic trace probe against the repo simulator: 30/30 runs, 0 mismatches.
  - 30-run sample (6 policies x seeds 0-4, maxActions 50): deterministic, runtimeFailures 0,
    deadlocks 0, AI calls 0; slots {P2:60, P3:57, P4:708, P5:286, P6:256}.
  - Deep-read the 12 fixed representative traces (seeds 0 and 4 for all 6 policies).
  - Regression guards hold: sameCoreNpcConsecutiveP4Count 0 (708 P4 scenes),
    p5ContextualGapViolations 0 (286 P5 scenes).
  - Cause healthy: 58 instances, invalid 0, observable dormant->echoed->resolved chains with real P3 echoes.
  - Death explainable: 4/4 with full RISK01 trace, warningFacts and player take-risk attribution.
  - 22/22 named tests and audits green.
  - 8 BACKLOG observations recorded (no Build/Cause for cautious, cultivation reads 0 at high realm,
    path-driven progression, single-echo causes plus redundant resolved logging, inert generated NPCs,
    maxAge never binding, legal-but-frequent stage regression, P4/P5 event overlap).

  Status: PASS. No reproducible structural playability blocker remains before UI02.
