summary: |
  One combined repair + completion + final-audit task, executed in that order without stopping.

  1. TRANSPLANT. The blocked UI04E_R2 candidate (83c4882, parent c6dce60) was cherry-picked --no-commit
     onto the current remote source HEAD f309c38. f309c38 only advances .codex/docs, so the transplant
     was conflict-free. No .workbuddy path entered the tree.

  2. THE KNOWN DEFECT, FIXED. TianfuLiveService.createRunOffer returned only `GameState` from all three
     paths (mapped-existing, deterministic-existing, newly-generated) and projected it with
     `builder.build(state)`. That drops `StoredRun.terminal`, so bootstrapping onto a run already at
     NEXT_LIFE projected `pageState: "ENDING"` with `state.terminal === undefined` while `fetchView` on
     the same run projected NEXT_LIFE with the full sidecar — the reload landed on ENDING and the
     "开启下一世" CTA was unreachable. All three paths now settle the COMPLETE StoredRun and project
     through `buildFromStoredRun`, the same terminal-aware builder fetchView uses. One projection rule.

  3. COMPLETION, NOT A STOP. Two acceptance criteria had no evidence anywhere in the tree, so they were
     proven directly against the real service over the real CloudBase store:
       - createRunOffer recovery and fetchView project the SAME terminal-aware PublicViewModel at
         ENDING / LIFE_BOOK / REBIRTH_RESULT / NEXT_LIFE (deep-equal, byte for byte);
       - the prior run stays gameplay byte-identical (state, commandLog, ruleStateHash) and parked at
         NEXT_LIFE after the next life is created.

  4. BOUNDED DEFECTS FOUND BY THE FINAL AUDIT — all fixed in this same task, no new micro-cycle:
       - ui04b WeChat runtime smoke pinned a facade export surface that UI04E legitimately grew by
         `TerminalUnavailableError`; the pin was re-pointed, not deleted.
       - UI04E changed `derivePageState` so a `dying` run projects ENDING instead of an empty
         SPECIAL_NODE dead-end. That made the ui02 preview fixtures stale AND, because v2-preview.wxml
         has no ENDING branch, would have regressed the preview into a blank surface. The preview's
         SPECIAL_NODE fixture is now an *active* run facing the same authoritative special node, so the
         fixture keeps proving SPECIAL_NODE; the fixtures were regenerated.
       - UI02R1/UI04B digest pins for packages/wechat-shell/src, packages/platform-contract/src,
         server/src (+terminal-flow.ts), cloudfunctions, miniprogram/pages/v2-preview and the fixture
         generator were stale for the same reviewed reason; each was re-pinned with a comment naming the
         intentional tree change (per TOOLING_RUNBOOK "digest-pinned scope tests").
       - UI03's SPECIAL_NODE back-lock test used a `dying` run, which is now ENDING; it was split into a
         genuine SPECIAL_NODE (active run) back-lock plus a dying -> ENDING projection assertion that
         proves the terminal page refuses ordinary event-option submission at the controller.

  5. FINAL AUDIT. Aggregate `npm test` 489 tests: 485 pass. The 4 failures are environment noise, each
     proven in ONE bounded batch (details under `tests` and `toolingObservations`). Every named gate is
     green. No gameplay/Core/Content/reducer/RNG/Director semantics were touched, so 600-run remains
     unnecessary.
