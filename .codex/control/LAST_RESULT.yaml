  - >-
    tests/ui04b.test.mjs keeps ONE failure that is PRE-EXISTING and is not caused by this task. Its
    UI04B_scope pins `cloudfunctions` and `server/src` to digests from the UI04B/LIVEFIX01 era. Measured at
    the task base (2b84b553, extracted with `git archive`) those trees already hashed to c3bc1592 and
    9d9ccc95 against pins b9e1e056 and 39f0ec63, so the suite was already red before this pass began; it is
    red now for the same reason with different values (c6ac7c36 and 09a17ce7). The pins were NOT re-pinned,
    because that guard belongs to another task and the Controller asked for accepted tests to be left
    intact. The digest values are reported so the Controller can re-pin deliberately — the file's own
    comment records LIVEFIX01 doing exactly that.
  - >-
    The decline options on the ~35 remaining template Events settle 修为 rather than time, for the reason
    recorded under b3Semantics.declineDimension. This is a compromise against the spec's preference for a
    genuine no-gain, and it is the one B3 point where I did not take the first-choice remedy.
  - >-
    Those same ~35 Events still carry generic option wording (顺势而行 / 停步细看 / 见好便收 and the risk
    template's trio). Their money is fixed; their phrasing is not. Counted, not estimated.
  - >-
    Manual visual QA was NOT performed. Everything here is proven against the real engine, the real
    transport and the page's real render model, but not on a device or in WeChat DevTools. The concrete
    smoke steps are: open v2-live, choose a destiny, take a core action, resolve the opening Event, and
