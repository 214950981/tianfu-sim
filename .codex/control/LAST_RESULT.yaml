    statement: >-
      CONTENT01-016 and CONTENT01-019 reach Cause-linked echo Events through a direct
      forced entry (the tests' local enter() helper) that carries no P3 provenance, then
      resolve a closure-bearing choice. The new closure effects resolve the triggering
