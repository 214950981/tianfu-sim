backlog:
  - id: B1
    severity: BACKLOG
    title: cautious never forms a Build and never creates a Cause
    evidence: >-
      All 5 cautious runs show dominantBuildId=none with all four build affinities exactly 0 and causes=none;
      cautious/0 and cautious/4 also have P3=0. choose() maps cautious to consider and the cautious
      ACTION_PLAN is [cultivate, worldly], so no build-affinity engage option is ever selected.
    impact: A legal, apparently reasonable policy produces a structurally flat identity-less life.
    suggestedOwner: PLAYBACK or a policy/test-harness task
  - id: B2
    severity: BACKLOG
    title: cultivation resource reads 0 at high realm for some policies
    evidence: alchemy_seeking/0 and alchemy_seeking/4 both end spirit-transformation with cultivationFinal=0; 8 runs sample-wide finish at cultivation 0.
    impact: Cultivation progress stops being visible exactly where it matters most.
    suggestedOwner: PROGRESSION tuning task
  - id: B3
    severity: BACKLOG
    title: progression tracks policy path more than cultivation investment
    evidence: >-
      fortune_seeking reaches the highest realms observed (golden-core x4) with the lowest action count of
      any surviving policy (avgActions 50 but maxAge 114), while cautious maximises cultivation to 10000 and
      only reaches nascent-soul.
    impact: Investment in cultivation does not read as the main driver of realm advance.
    suggestedOwner: balance task
  - id: B4
    severity: BACKLOG
    title: Cause echo richness is always exactly 1 and resolved causes keep re-logging
    evidence: >-
      57/58 causes finish finalEcho=1; echoBudget starts at 2 but is consumed to 1; resolvedTail has 57
      entries with average 57.28 and max 96 identical resolved@node#e1 log lines per cause.
    impact: Multi-echo causes are unreachable and Cause bookkeeping is dominated by no-op log growth.
    suggestedOwner: CAUSE02 or a Cause verbosity task
  - id: B5
    severity: BACKLOG
    title: generated NPCs are inert
    evidence: >-
      173 instances, knownFacts>0=0, knownTraits>0=0, promotedToA=0, encounter histogram {1:22, 2:84}.
    impact: Generated NPCs never grow beyond a shallow two-encounter acquaintance.
    suggestedOwner: NPC02
  - id: B6
    severity: BACKLOG
    title: maxAge is never the terminator
    evidence: >-
      26/30 runs right-censor at the 50-action harness cap; observed ages span 44-151 against maxAge values
      of 120-500. No run ended from lifespan.
    impact: Lifespan is currently a ceiling that never binds, so the end of a life is never authored by the rules.
    suggestedOwner: a lifespan/ending task
  - id: B7
    severity: BACKLOG
    title: Build stage regression is contract-legal but frequent
    evidence: >-
      10 regressions observed (refined->formed, emerging->latent). build.ref states affinity "may rise or
      fall" and stage is derived and never stored, so this is legal; 0 contract violations.
    impact: A player can watch their Build visually regress a stage, which may read as a loss of progress.
    suggestedOwner: design-feel review
  - id: B8
    severity: BACKLOG
    title: P4 and P5 event sets overlap heavily
    evidence: 32 of 42 distinct P5 events also appear under P4 (e.g. content01.cen.*, jiang.*, build.*, onboarding.*).
    impact: Slot distinctiveness between core-NPC and contextual scenes is low.
    suggestedOwner: CONTENT02 authoring
  - id: B9
    severity: BACKLOG
    title: generic reason id reused across death categories in warningFacts
    evidence: >-
      aggressive/1 (poison) and aggressive/3 (special) both carry risk.reason.injury as the second
      warningFact. risk.ref does not pin the array content and the category fact is correct in every case.
    impact: Cosmetic naming verbosity only; no lethal resolution occurred without a warning.
    suggestedOwner: RISK02 polish

