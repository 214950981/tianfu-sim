summary: >-
  LOOPFIX02C adds one deterministic P5 contextual pacing rule to the Director selector so the P6 ordinary
  fallback stops being dead code, exactly as the controller decided (strategy deterministic-P5-contextual-gap,
  contextualGapScenesV1 = 2, which is OPT-B from the SIM02 result). Root cause carried forward from SIM02:
  selectDirectorEvent iterates its slot list in strict order and returns at the first slot with an eligible
  candidate while the reducer offers [P4,P5,P6], and the P5 contextual tier was populated at 5205 of 5205
  action nodes, so P6 was shadowed by precedence rather than scarce. The fix paces P5 eligibility instead of
  reordering tiers or retuning weights. DirectorRules gains contextualGapScenes (v1 value exactly 2) and
  scoreDirectorEvent gains one P5-only branch: a P5 candidate is ineligible with exclusionReason
  'contextual-gap' while any of the last contextualGapScenes DirectorSceneRecords is itself a P5 scene. The
  gate counts DirectorSceneRecords, not node distance, so two later non-P5 scenes reopen P5 on their own; it
  reads only the existing bounded recentScenes ring plus the versioned rule, consumes no RNG, and adds no
  persistent state, counter, or timer. Strict P1-P6 precedence, P4 eligibility, the accepted LOOPFIX02B3
  same-core-NPC repeat gate, P6 eligibility, all scoring weights and all CONTENT01 content are untouched.
  The rule is validated as versioned Director content: validateDirectorPack whitelists contextualGapScenes,
  ranges it as a safe integer, and the frozen-v1 check pins it to exactly 2, so 3 / NaN / -1 / 2.5 / a
  missing field all throw. One post-change 600-run verification was executed (the only one, as required):
  6 policies x seeds 0..<100, maxActions 50. P3=1212 P4=14579 P5=5701 P6=4824 and P1=0 P2=1200. P6 went
  from 0 to 4824 selections and now appears in 583 of 600 runs (max 2 consecutive), while P5 remains the
  dominant contextual tier at 5701. Independent recomputation from the ordered scene log found 0 P5 gate
  violations across 5701 P5 selections and 0 P6 selections that fired while the previous two scenes were
  both P5. The P4 repeat gate still holds at scale: 0 same-core-actor violations across 8851 genuinely
  consecutive P4->P4 pairs over 27516 observed scenes, with all 600 per-run counters equal to an
  independent recompute. Cause closure is healthy (origins=1226 eligible=1212 echo=1212 resolved=1212
  expired=0) with no cause.invalid. runtimeFailures=0 deadlocks=0 AIcalls=0 and two invocations of the
  required configuration produced byte-identical slot distributions. npm test 264/264 green (was 249;
  the 15 new tests are registered). No source-branch push and PLAYCHECK02 was not started.
