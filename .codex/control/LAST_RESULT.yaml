summary: >-
  UI02R1 is a presentation-only repair. The accepted UI02 data and authority boundary are untouched;
  what changed is the information architecture, responsiveness and safe-area behaviour of the 2.0 dev
  preview, so RUN_HOME behaves like a game control surface instead of a scrollable data sheet. No
  server ViewModel, wechat-shell intent mapping, application UI controller, Core/Content gameplay,
  Director, contract, legacy 1.0 page or app route was modified, and UI03 was not started.

  One-screen is structural, not cosmetic. The preview route now sets disableScroll: true, `page` is
  height:100% with overflow:hidden, and the product root is a 100vh flex column whose children are
  constrained with flex + min-height:0 instead of natural document growth. Nothing uses
  min-height:100vh. RUN_HOME therefore cannot page-scroll; the only vertical scrolling anywhere is
  inside explicit scroll-view viewports (the attention region, the EVENT/SPECIAL_NODE decision
  viewport, the LIFE_ARCHIVE archive viewport, the dev overlay and the read-only drawers).

  RUN_HOME was restructured into exactly four layers: (1) a compact identity/lifespan header, (2) core
  cultivation status (修为 / 道基 / 灵石) in one row, (3) at most three public attention summaries
  (dominant Build, one public Cause, one known person) plus a single public-condition row, and (4) a
  bottom action dock. Exactly four core actions stay first-screen visible in a stable 2x2 dock, and the
  Primary breakthrough CTA is rendered only through wx:if on the accepted server-projected
  available flag; the unavailable variant renders at most one compact reason line, reserving no large
  CTA block, and because the flexible space is in the middle of the layout the four actions do not move
  when the CTA appears or disappears. Disabled action slots keep their grid cell, so there is no layout
  jump.

  Density was reduced by removing duplication, not by shrinking text or touch targets. Summarising is
  never a dead end: each summary row opens a read-only drawer, and the one-screen surface offers
  exactly four public detail drawers (Builds / Causes / conditions / People) that only format the
  already-public projection, contain no submission control and surface no hidden Cause or NPC state.
  Every dynamic public string is either single-line ellipsized or line-clamped, and wrapping blocks
  break long raw labelKeys, so long run names, realm ids, cause labels, person names and risk reasons
  cannot wrap the stack taller or create horizontal overflow.

  EVENT and SPECIAL_NODE share one fixed full-screen decision container: the headline, participants and
  the locked-while-unresolved badge are pinned above a single bounded scroll-view holding the narrative
  and the options, so many options or long body copy can never push the decision content off the
  surface. The unresolved decision still cannot be escaped from the product surface because the
  ordinary-back probe now lives only in the dev overlay.

  The dev preview layer is a collapsed floating "调试" trigger plus a fixed overlay, both outside the
  product `.surface` subtree and both position:fixed, so tabs, lastIntent, decisionId, interaction
  state, the blocked-back probe and the capability-entry diagnostics consume zero product layout height.
  Switching a view collapses the overlay so the one-screen result is directly observable. Detail
  drawers are fixed bottom sheets with an explicit 46vh internal scroll viewport. The bottom action
  dock, the decision viewport, the archive viewport and the drawer all reserve
  env(safe-area-inset-bottom) so the home indicator cannot cover controls.

  Responsiveness is an explicit contract rather than a hope: the WXSS declares the supported baseline
  (windowWidth >= 320, windowHeight >= 500 CSS px) and the full viewport matrix
  320x500 / 360x560 / 375x603 / 390x750 / 414x820 / 430x850 as width and height token bands, and every
  matrix viewport resolves to at least one width band and one height band (or the baseline token set).
  Compact-height bands tighten non-interactive spacing only: --touch-min, --cta-h and --dock-row-h are
  identical in every band, so the fit is never bought by shrinking controls. At windowWidth 320 the core
  action target is 44.37 CSS px, and no product font size goes below 20rpx.

  Proof is structural and derived, not asserted. tools/ui02r1-layout-audit.mjs re-parses the committed
  WXSS (base `page` tokens plus every matching media band, with the CSS cascade order honoured) and the
  committed WXML, then prints a per-viewport first-screen budget table. Worst-case RUN_HOME stack +
  34 px reserved safe area vs viewport height: 320x500 -> 412.6+34 <= 500 (53.4 px slack); 360x560 ->
  476.6+34 <= 560 (49.4); 375x603 -> 513.5+34 <= 603 (55.5); 390x750 -> 561.1+34 <= 750 (154.9);
  414x820 -> 626.5+34 <= 820 (159.5); 430x850 -> 650.7+34 <= 850 (165.3). It also proves the pinned
  decision head takes 22.5% of the baseline viewport, leaving the rest to the options.

