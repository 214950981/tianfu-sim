summary: >-
  PLAYUX01 asked for a player-facing experience pass over the Content01 vertical slice, with the
  product design owned by the Controller and only the implementation delegated. Stage A first mapped
  every product promise onto the function that actually settles it, because three of the promises had
  no settlement path at all. Stage B made the opening Events readable and gave the Director a real
  semantic slot to match an action against. Stage C built the authoritative result receipt the spec
  asked for, out of the reducer's own output rather than an inference. Stage D stopped the terminal
  screens printing server enum ids and reporting zero achievements for a life that has not been
  summarised yet. Stage E wrote the ten Cause-linked echo resolutions by hand and added the suite
  that keeps them from regressing.

  Net effect on the slice: 0 of 66 Events carried a template tail before stage B, 66 of 66 carry
  authored prose now. The life book printed 66 raw content01.* keys per row before stage C. The
  terminal printed lifespan-hard-ceiling as a death cause before stage D. None of those were
  rendering bugs in the ordinary sense — each was the player being shown a key because the layer that
  should have named it did not exist.

mappingFirst: >-
  docs/PLAYUX01-DESIGN-MAPPING.md (408 lines) records the fixed design against the source function
  and the public authoritative data that carries it, and states plainly where the design and the
  engine disagreed. Three findings changed the work rather than the design. (1) The spec's "an action
  should reach Events about that action" had no matching mechanism: queryIndex() narrows only by the
  event's declared actionAffinity, so an action reached whatever was left in the ordinary index.
  (2) The spec's "an ordinary Event may still be relevant to an action" could not be expressed by
  adding ordinary Events to actionAffinity, because that index is built from
  actionAffinity.length === 0 and filling it would empty the registry fallback and break CONTENT01-010.
  Both were resolved by a new independent field, not by loosening an invariant. (3) The spec wanted a
  clear "nothing gained" result; OUTCOME_TIME_DELTA turned out to be a registered, settled, publicly
  observable state with real time cost and no resource gain, so no invented sentinel was needed.

changes:
  - file: packages/content/src/registry.ts
    what: >-
      Adds directorHints.ordinaryActionTags as an independent optional field, used only to filter P6
      candidates. It is deliberately NOT actionAffinity: an ordinary Event that declared an action
      would leave index.ordinary, and that index is what makes the registry fallback work. The new
      field carries no weight, does not enter P5, and cannot affect scoring, ordering or the RNG draw
      count, so the Director's existing distribution is unchanged.
  - file: packages/core/src/director.ts
    what: >-
      Applies the three-state rule to queryIndex().narrow(): an Event that declares the action is
      always in, an Event that declares nothing for that slot is kept (a legitimate cross-action
      Event), and an Event that declares the tag without the action is excluded. This is what makes
      "still reachable" true without touching the fallback index.
  - file: packages/content/src/content01-v1.ts
    what: >-
      Authored prose for all 66 Event bodies, replacing 66 generated template tails; authored choice
      sets for the ten Cause-linked echoes; an authored choiceSet for content01.onboarding.rain-shelter,
      which was a real defect because stage B gave it a body and left its options on the template; and
      explicit ADD_BUILD_EVIDENCE on the three build-tagged echoes, because the choiceSet authoring
      branch does not auto-append buildEffect the way choices() does. content01.ordinary.night-rain
      keeps its engage/consider/leave ids, which LIVEFIX06 pins.
  - file: packages/content/src/build-v1.ts
    what: >-
      build.fortune now declares its stages explicitly. The definition() default builds
      build.${id}.${stage}, and since the id is already build.fortune that produced
      build.build.fortune.latent — a key no catalog can translate, so the client rendered it verbatim.
  - file: packages/core/src/state.ts
    what: >-
      run.events.history gains an optional choiceId, validated with optionalString and deliberately
      absent from the required set, so a save written before this field existed still loads and the
      result surface says the choice was not recorded rather than inventing one.
  - file: packages/core/src/reducer.ts
    what: One line: the history entry now carries the option the player actually took.
  - file: server/src/command-gateway.ts
    what: >-
      resultReceipt() turns the reducer's own ReduceOutput into the receipt, and the success branch
      writes it in the same transaction as the idempotency record. It is first in the spec's ranking
      of data sources because it is the only one that is not inferred: an effect the reducer did not
      apply cannot appear. trace is dropped so the RNG state, roll and selector never leave the
      server; ADJUST_NPC_RELATION is reduced to its public edge because it carries hidden affinity the
      player has not earned the right to read; Cause effects are reported as state transitions rather
      than by echoing the op, so no hidden cause id leaks. An empty line list is a true statement
      about a settlement that changed nothing measurable, and the client writes 此行没有明显收获.
  - file: server/src/viewmodel.ts
    what: >-
      The history summaryKey was ${eventId}.history, a suffix no content pack ever declared, so every
      life-book row rendered its raw key; it is now the pack's own .body, which is a real
      one-sentence account and is already translated. choiceId is projected when present, on both the
      life book and the terminal's public events.
  - file: miniprogram/pages/v2-live/v2-live.js
    what: >-
      TERMINAL_LABELS translates every deathCauseId and endingId the engine can currently emit, taken
      from reducer.ts:275-276 and risk-v1.ts:48-56 rather than guessed; an unknown id still falls
      through to the raw id so a missing catalog entry stays visible. buildTerminal gained hasLifeBook
      because buildPublicTerminal() returns undefined until the sidecar exists, and reporting 0 往事 /
      0 故人 / 0 道途 in that case is a fabricated verdict about a life nobody has summarised. Adds
      the result.receipt copy and, from stage B, the 16 build.* stage labels.
  - file: miniprogram/pages/v2-live/v2-live.wxml
    what: >-
      The ENDING and LIFE_BOOK count rows are guarded by hasLifeBook, and the NEXT_LIFE copy is fixed —
      it contained unbalanced parentheses.
  - file: miniprogram/pages/v2-live/content01-zh-cn.js
    what: Regenerated from CONTENT01_ZH_CN by tools/content01-zh-cn-module.mjs --write (329 keys).
  - file: tests/playux01.test.mjs
    what: >-
      New, 20 tests in five groups. A: action-semantic slots, including a sealed synthetic pack that
      proves the registry accepts the new field without loosening the fallback. B: authored copy, no
      template tails, playability audit clean, no generic wording, every authored Event has at least
      one option with an observable effect. C: receipt truth, including that a time-only option really
      settles time and claims no resource, that the PublicView leaks no hidden information, and that
      replaying one commandId lands the same result. D: terminal honesty, including that every
      reachable death cause is translated and that a missing sidecar is distinguishable from an empty
      life. E: the constraints already accepted — night-rain ids kept, all 16 build stage labelKeys
      translated, client catalog fresh.
  - file: tools/playux01-{mapping,nogain,ending,receipt,terminal,verify}-probe.mjs
    what: >-
      Six probes. mapping, nogain and ending were written in stage A before any product code changed,
      which is what let the design be checked against the settlement rather than argued about. receipt
      compares what the gateway claims against an independently computed public-view diff. terminal
      evaluates the real render model. verify walks the whole slice.
  - file: docs/PLAYUX01-DESIGN-MAPPING.md, .gitignore
    what: The mapping table, and a .playux01/ entry so the local probe scratch directory stays untracked.

