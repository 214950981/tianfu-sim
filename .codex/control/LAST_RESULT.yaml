      Regenerated, because the derived cloud runtime carries the content module and that module changed. Not a
      deployment.
  - file: tests/playux01b.test.mjs
    what: >-
      Eight new tests (14 -> 22) covering F1's shell-to-page flow, the death-at-choice CTA, the conservative
      unknown-key fallback, the F2 life-book split and introduction, and the F3 wording, provenance and
      pursuit-honesty audits.

