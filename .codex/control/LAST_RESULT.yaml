changes:
  - file: packages/command-wire/src/index.ts
    kind: added
    note: >-
      The command/envelope wire codec moved verbatim out of gameplay Core: APP_ERROR_CODES,
      AppErrorCode, ClientPlatform, GameCommand, CommandEnvelope, CommandResult,
      CommandValidationError, validateGameCommand, validateCommandEnvelope, serializeCommandEnvelope,
      parseCommandEnvelope. Dependency-free by construction: zero imports, so no path from a client
      bundle to packages/core exists through it. The Core helper assertSafeInteger was inlined as a
      3-line Number.isSafeInteger guard with the identical acceptance set and identical failure text
      ("must be a finite safe integer"), verified by the byte matrix. COMMAND_ACTION_IDS is the
      PROTOCOL action vocabulary taken verbatim from .codex/contracts/command.ref; the rule-side
      ACTION_TYPES stays in packages/core/src/state.ts and a test pins the two equal, so there is one
      validator and no silently duplicated vocabulary.
  - file: packages/core/src/command.ts
    kind: modified
    note: >-
      Reduced to `export * from "../../command-wire/src/index.ts";` plus a comment naming the boundary
      and the identity guarantee. Kept in place so reducer.ts, persistence.ts, the Core barrel and the
      server gateway keep importing the same bindings from the same specifier with unchanged behaviour.
  - file: packages/application-ui/src/index.ts
    kind: modified
    note: >-
      The runtime import of parseCommandEnvelope / serializeCommandEnvelope (and the CommandEnvelope /
      CommandResult / GameCommand types) now points at ../../command-wire/src/index.ts. No behavioural
      change; CommandSubmissionController's envelope, commandId, pending persistence, retry and
      STATE_CONFLICT reconfirmation semantics are untouched.
  - file: packages/wechat-shell/src/index.ts
    kind: modified
    note: >-
      The remaining type-only command import now points at ../../command-wire/src/index.ts as well, so
      this package has no import - runtime or type - into gameplay Core. No code, logic or signature
      changed.
  - file: tools/ui04a-client-runtime-audit.mjs
    kind: added
    note: >-
      New machine-executable client-runtime dependency audit. Exports auditClientRuntime(roots) for
      in-process use (so the dedicated suite does not have to spawn a child process, which is exactly
      the operation this sandbox fails with EBUSY) and provides a CLI with --root and real exit codes.
      Runtime-only graph walk: `import`/`export ... from`, side-effect imports, dynamic import() and
      require(); type-only clauses are skipped. Forbidden prefixes: packages/core/, packages/content/,
      server/. Fails closed on an unresolvable relative specifier. Requires the real client closures to
      still contain the wire module so a green result cannot be vacuous.
  - file: tests/fixtures/ui04a-client-runtime/forbidden-edge.ts
    kind: added
    note: >-
      Negative control: imports reduce from ../../../packages/core/src/reducer.ts at runtime. Never
      imported by product code. The audit must exit non-zero on it, which is what makes the green run
      on the real roots meaningful.
  - file: tests/fixtures/ui04a-client-runtime/type-only-edge.ts
    kind: added
    note: >-
      Opposite control: `import type { GameState }` from packages/core/src/state.ts. The compiler
      erases it, so the audit must exit zero - proving the audit walks the runtime graph rather than
      substring-matching `packages/core`.
  - file: tests/ui04a.test.mjs
    kind: added
    note: >-
      16 dedicated tests: frozen canonical bytes for START_RUN / CHOOSE_ACTION / CHOOSE_EVENT_OPTION /
      ATTEMPT_BREAKTHROUGH (+ an optional field case and a key-order case); the invalid-envelope matrix
      with exact paths and text; parse round-trip and rejection; object identity between the Core
      surface and the wire module; the protocol/rule action vocabulary pin; the zero-import proof for
      command-wire; server/caller compatibility through the real CommandGateway; the audit's green run,
      its negative control, its type-only control and its fail-closed behaviour on an unresolvable
      specifier; UI03 retry / pending-byte / STATE_CONFLICT regression through the real gateway stack;
      registration, documentation and route-scope guards.
  - file: tests/ui02r1.test.mjs
    kind: modified
    note: >-
      Three BASE_TREE digests recomputed on purpose with the algorithm documented in the file
      (packages/core/src, packages/application-ui/src, packages/wechat-shell/src) and the disclosure
      comment extended with the UI04A reason. File lists are unchanged. The other ten pinned trees -
      including platform-contract, server, Content, the 1.0 pages and the preview surface - still match
      their original digests, which is the evidence that nothing else moved.
  - file: tests/ui02.test.mjs
    kind: modified
    note: >-
      The `packages/core/src` entry of BASE_TREE_DIGESTS recomputed on purpose, with the reason written
      into the existing comment block. This pin exists to prove no Core/Content *gameplay* source moved;
      only the compat shim changed, and packages/content/src plus the 1.0 pages are still byte-identical.
  - file: tools/phase2-drift-audit.mjs
    kind: modified
    note: >-
      Necessary consequence of the extraction, disclosed rather than hidden. Its PROG01 frozen-marker
      check asserted the literal ATTEMPT_BREAKTHROUGH is inside packages/core/src/command.ts; that file
      is now a pure re-export, so the check re-points at packages/command-wire/src/index.ts, the module
      that now owns the protocol marker, and a comment records why. Verified: untouched base = overall
      PASS; task tree before this fix = BLOCKED on that single conflict; after the fix = overall PASS,
      so the check is still real and still fails if the breakthrough command disappears.
  - file: package.json
    kind: modified
    note: >-
      Registers `test:ui04a` and `ui04a:audit`, and appends tests/ui04a.test.mjs to the aggregate
      `test` script.
  - file: docs/UI04A_CLIENT_WIRE_BOUNDARY.md
    kind: added
    note: >-
      Documents the boundary, the single-source guarantee, the Core/server compatibility path, the audit
