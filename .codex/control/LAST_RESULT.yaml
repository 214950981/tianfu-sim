changes:
  - file: tools/content01-zh-cn-module.mjs
    what: >-
      New deterministic generator and freshness gate. It imports CONTENT01_ZH_CN directly from the
      production TypeScript source — no regex transcription of the Chinese strings anywhere — selects the
      340 content01.* keys, sorts them, validates them fail-closed, and emits the CommonJS module. Exports
      loadSourceCatalog / selectContent01Keys / validateCatalog / buildModuleSource /
      checkCatalogFreshness, so a test can prove freshness instead of asserting that a script exists.
      Run without --write it reports staleness and exits 1; with --write it regenerates.
  - file: miniprogram/pages/v2-live/content01-zh-cn.js
    what: >-
      New GENERATED artifact: 340 [key, copy] pairs, 40023 bytes. Requires nothing, imports nothing and
      contains only data, so the WeChat runtime package stays closed and free of server/TS-only
      dependencies. A module rather than JSON because the WeChat runtime cannot require() a .json file.
  - file: miniprogram/pages/v2-live/v2-live.js
    what: >-
      Renamed the hand-maintained table to PAGE_CONTENT_COPY (19 keys, wording unchanged) and built
      CONTENT_COPY by merging the generated Content01 pairs first and the page-specific entries second,
      so page-specific copy keeps precedence and no key is invented. The merged catalog holds 359 keys.
      presentLabel() is unchanged, so an unknown key still falls through to the key itself and remains a
      detectable failure rather than misleading invented copy. Net +48/-2 lines.
  - file: tests/livefix06.test.mjs
    what: >-
      New 20-test suite: full source-key coverage; the exact observed night-rain title, body and three
      choices resolving to Chinese copy; every key the content pack projects being renderable; one event
      from each of the ten Content01 families; destiny and cause-origin surfaces; determinism and
      order-independence of generation; the static-literal require contract; the closed runtime package;
      and scope guards proving options, order, option ids, command envelope, stateVersion submission,
      submission locking, content semantics and the LIVEFIX05 fallback are all untouched.

