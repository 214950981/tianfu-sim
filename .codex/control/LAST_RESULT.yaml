summary: >-
  UI04D puts a real, deployable, authoritative cloud backend behind the UI04C RPC boundary: a thin WeChat
  cloud function over a mechanically derived CommonJS runtime, a CloudBase document store that keeps every
  accepted CommandGateway semantic under a real server-side transaction, and OPENID-derived identity with
  bootstrap-idempotent run creation. No gameplay was written: every state transition still comes from the
  accepted reducer through the accepted CommandGateway, and every response still comes out of the accepted
  ServerViewModelBuilder.

  IDENTITY. cloud.getWXContext().OPENID is the only trusted fact about the caller. The host converts it
  once into an opaque playerId ("p-" plus a domain-separated sha256 prefix) and then discards it:
  serviceFor() reads no field of event at all, so a client-sent playerId, OPENID or rootSeed is not
  sanitised, it is never looked at. Raw OPENID never reaches the client, RuleState, a command envelope or
  a public ViewModel. fetchView and sendCommand compare the run's stored owner against the trusted id; a
  foreign run and a non-existent run produce the identical UNAUTHORIZED / run.not_owned answer, and the
  refusal does not echo the run id, so the endpoint cannot be used to probe existence.

  SERVICE. TianfuLiveService owns exactly the three operations the live client already speaks:
  createRunOffer, fetchView, sendCommand. createRunOffer builds the real CONTENT01 registry (pack plus the
  CONTENT01 NPC pack, over progression/risk/build/director v1), calls generateServerDestinyOffer with a
  server-only entropy provider for runId and rootSeed, and returns
  { runId, playerId, rulesVersion, contentVersion, view } - a shape the UI04C fail-closed parser already
  validates, including the recursive refusal of rootSeed, rngState, checkSpec, hiddenCause and friends.

  BOOTSTRAP IDEMPOTENCY. createRunOffer takes a client-generated, locally persisted bootstrapId. The
  mapping (playerId, bootstrapId) -> runId is written inside the SAME transaction that creates the run, so
  a retry after a lost response, a page reload, or a cold handler instance recovers the same offered run
  instead of manufacturing another life. A different bootstrapId starts a new run. v2-live persists
  "tianfu2:bootstrap-id" and no longer stores the UI04C dev-local player id; the session's playerId is now
  the server's.

  STORE PORT. CommandGateway was given a persistence port, GatewayStore / GatewayTransactionView, whose
  reads may be asynchronous; reads are awaited and InMemoryGatewayStore keeps its synchronous surface for
  the existing tests. Nothing else moved: idempotency fingerprints, STATE_CONFLICT, ownership, snapshot
  cadence, replay and the failure envelope are still decided inside CommandGateway, and
  tests/server-gateway.test.mjs is 6/6 without a single assertion change.

  CLOUDBASE STORE. CloudBaseGatewayStore addresses three collections - tianfu2_runs, tianfu2_commands,
  tianfu2_bootstraps - by deterministic 32-hex document ids derived from the logical key, so the
  transactional path never queries: there is no ".where(" in the module at all, and the harness's fake
  database throws if one is attempted inside a transaction. Writes are staged in the view and flushed after
  the operation resolves but still inside runTransaction, so the transaction is read-your-writes and a
  thrown operation commits nothing. Nothing is cached across requests, which is what makes a cold start
  settle against the same documents as the instance that timed out.

  DEPLOYABLE ARTIFACT. cloudfunctions/tianfu2/index.js is a thin host - identity, database handle,
  server-only entropy, dispatch, and a structuredClone shim installed BEFORE the runtime is required
  because the generated modules clone content at load time. It contains no reducer, no gateway, no
  ViewModel builder and no content. Everything it calls lives in cloudfunctions/tianfu2/runtime/: 34
  modules plus a bounded facade, generated by tools/ui04d-cloud-runtime-artifact.mjs from the accepted
  server + Core + Content TypeScript closure using Node's own built-in type stripper. No bundler, no new
  dependency. The generator fails closed on a bare or "node:" specifier, on any module heading it does not
  fully understand, and on a facade export the owning module no longer publishes. wx-server-sdk is confined
  to cloudfunctions/tianfu2/package.json; no client manifest depends on it.

  PROOF. tests/ui04d.test.mjs loads the COMMITTED host itself as CommonJS in a fresh node:vm realm per
  call (a cold start), with a fake wx-server-sdk whose getWXContext().OPENID is the identity source, a
  CloudBase-like database with real runTransaction semantics, and deterministic crypto. The request payload
  is serialised into the handler's realm and the response back out, so a cross-realm prototype cannot
  satisfy a validator by accident. A post-commit timeout is modelled by throwing after the writes landed,
  and the exact retry is proven not to double-settle state, RNG, time or the command log.

