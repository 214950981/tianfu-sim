ebusyEvidence:
  classification: environment-noise-proven
  taskRequirement: >-
    The task permits classifying the known nested-process EBUSY failures as environment noise ONLY with
    exact base reproduction AND underlying direct-tool success. Both were performed.
  aggregateFailures:
    - "tests/import-boundary.test.mjs :: clean Core passes the import boundary (assert.equal(result.status, 0), actual null)"
    - "tests/import-boundary.test.mjs :: forbidden Core fixture fails the import boundary (status null, not a real tool failure)"
    - "tests/replay.test.mjs :: replay CLI returns the verified final hash (execFileSync returned status null)"
  errorSignature: >-
    error: 'spawnSync <node.exe> EBUSY' with code 'EBUSY' and errno -4082. The tests reach their tool
    through spawnSync/execFileSync(process.execPath, ...); spawning node.exe from inside a Node process is
    what this sandbox blocks.
  baseReproduction:
    how: >-
      The worktree was returned to the pristine task base (the only task change, package.json, was
      reverted with git checkout so `git write-tree` again equalled the base tree
      d716344dc399a39084fb66b0a8c9e6323770b674 and status was clean), then both suites were re-run with no
      task change present.
    result: >-
      Identical failure set on the untouched base: 8 tests, 5 pass, 3 fail - "clean Core passes the import
      boundary", "forbidden Core fixture fails the import boundary", "replay CLI returns the verified final
      hash", with EBUSY present. The failures are therefore independent of this task and of the UI02 chain.
  directToolSuccess:
    - tool: tools/check-import-boundaries.mjs
      command: "node tools/check-import-boundaries.mjs"
      result: "exit 0, stdout 'Core import boundary: PASS'"
    - tool: tools/check-import-boundaries.mjs --root tests/fixtures/core-forbidden
      command: "node tools/check-import-boundaries.mjs --root tests/fixtures/core-forbidden"
      result: >-
        exit 1, stderr 'forbidden.ts: forbidden import ../../../packages/platform-contract/src/index.ts'
        - i.e. the negative control behaves exactly as the test asserts (non-zero status plus /forbidden
        import/ in stderr).
    - tool: tools/replay.mjs
      command: "node tools/replay.mjs <input.json> <pack.json>"
      result: >-
        exit 0. The input was rebuilt through the same public modules and the same helper bodies the test
        uses (ContentRegistry / sealContentPack / createOfferedRun / reduce / executeLoggedCommand /
        createCommandLog / createSnapshot, plus the test's own contentPack/setup/envelope/journey bodies),
        then the real CLI was invoked from the shell. It returned finalRuleStateHash
        978d3e8b3caa46ced017a8e4d593af8a6f11b34107caafb1c1f871ca3a184534 - identical to the in-process
        ruleStateHash of the final state and to what the test asserts - with checkpoints.length === 2.
        REPLAY_DIRECT_TOOL_OK.
  conclusion: >-
    Both proofs pass: the 3 failures reproduce identically on the untouched base and every underlying
    direct tool works when invoked from the shell. They are sandbox environment noise, not repository
    defects, and they are the only non-green part of the full regression.

