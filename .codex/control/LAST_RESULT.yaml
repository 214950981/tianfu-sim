summary: |
  Carry forward the valid UI04E terminal sidecar / public projection / advanceTerminal exactly-once /
  ownership / cloud runtime / four-stage rendering work, and repair the single lifecycle invariant
  the Controller rejected: REBIRTH_RESULT -> NEXT_LIFE is now a sidecar-only presentation
  transition. advanceTerminal never creates a next-run document, never writes a bootstrap mapping,
  and never carries nextBootstrapId / nextRunId on the success envelope or on the receipt. The
  next life is created only by an explicit, client-driven createRunOffer call from the NEXT_LIFE
  page's "开启下一世" CTA. The page persists a dedicated pending next-life bootstrap id BEFORE the
  server call, reuses the same id on retry/reload, and only promotes it to the current bootstrap
  key after a successful createRunOffer. The OLD run's canonical gameplay bytes are byte-identical
  before and after the NEXT_LIFE advance.
