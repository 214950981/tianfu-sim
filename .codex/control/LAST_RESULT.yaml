toolingObservations:
  - id: sandbox-nested-node-spawn-reconfirmed
    evidence: |
      import-boundary x2 and replay x1 failed with spawnSync null status / EBUSY inside `npm test`.
      Bounded proof batch: (1) `git archive f309c38 | tar -x` into a scratch tree reproduced EXACTLY the
      same three failures on the untouched base; (2) invoked directly from the shell, every underlying
      tool succeeds — `node tools/check-import-boundaries.mjs` exit 0, its negative control
      `--root tests/fixtures/core-forbidden` exit 1 with "forbidden import" in the output, and
      `node tools/replay.mjs <input> <pack>` exit 0 with finalRuleStateHash matching the expected value
      and checkpoints = 2.
    impact: aggregate regression reports 3 false failures in this sandbox; product code is unaffected.
    workaround: classify by untouched-base reproduction + direct-tool success, never by error text alone.
  - id: sandbox-safe-delete-guard-blocks-test-cleanup
    evidence: |
      NEW signature, not the nested-process one. `tests/ui04a.test.mjs` writes a temporary negative
      control fixture `tests/fixtures/ui04a-client-runtime/unresolvable-edge.ts` and removes it with
      `fs.rmSync(..., { force: true })` in a `finally`. Inside the aggregate the sandbox's
      `node-safe-delete-shim.cjs` threw
      `[safe-delete][SAFE_DELETE_BULK_CONFIRM_REQUIRED] {"count":323,"threshold":50,"scope":"turn"}`,
      so the cleanup call itself failed and the test aborted. Standalone the same file passes 16/16 on
      three consecutive runs, the temp file is still gone afterwards, and `git status` shows no
      untracked leftovers. Direct tool proof: `auditClientRuntime`/`formatAuditReport` invoked from a
      plain script (no test runner, no delete) reproduce the non-vacuity assertions exactly — the
      forbidden edge is detected (reducer.ts + rng.ts, transitively) and the type-only edge is clean.
    impact: |
      A test that deletes its own temp fixture may fail inside a long aggregate run purely because the
      per-turn delete counter crossed the sandbox threshold. It is an environment artefact, not a
      regression, and it is order/volume dependent — it does NOT reproduce standalone.
    workaround: |
      Do not classify this as a product failure. Confirm with (a) the standalone suite run, (b) the
      underlying audit function invoked directly without a delete, and (c) a `git status` check proving
      no temp fixture leaked into the tree.
  - id: presentation-contract-change-invalidates-preview-fixtures-and-pins
    evidence: |
      UI04E changed `derivePageState` so a `dying` run projects ENDING rather than an empty SPECIAL_NODE
      dead-end. Three downstream consequences surfaced only in the final audit, all in-scope: stale
      ui02 preview fixtures; a SPECIAL_NODE preview fixture that would have blanked the preview page
      because `v2-preview.wxml` renders no ENDING branch; and stale digest pins in UI02R1/UI04B.
    impact: |
      A page-state contract change is not contained to the page that owns it — generated fixtures and
      digest pins elsewhere can go stale, and a preview surface that lacks the new branch can silently
      regress into a blank screen.
    workaround: |
      When a projection contract changes, grep `tests/` and `tools/` for the affected pageState, for the
      fixture generator that produces it, and for every digest pin over the trees involved. Prefer
      re-pointing the fixture to the state it was meant to prove over widening the surface that renders
      it.
