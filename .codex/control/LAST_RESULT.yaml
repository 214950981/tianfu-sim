toolingObservations:
  - id: fake-database-semantics-must-match-the-platform-rejection-shape
    evidence: |
      Every prior suite passed while the product could not perform a first request on a real empty CloudBase
      database, because the fake database answered a missing document with `{ data: undefined }` while real
      CloudBase rejects `collection(name).doc(id).get()` with `-502005`. The gap only surfaced in
      `cloud1-8glg1sird4d40bc0`.
    impact: |
      A fake that is *friendlier* than the platform is not a neutral test double — it silently deletes an
      entire error path from coverage, and the first real deployment is what discovers it.
    workaround: |
      For any persistence seam, make the double reproduce the platform's failure shape (including the error
      code and the rejection, not just the empty result), and keep the friendlier behaviour only as an
      explicitly named contrast mode a test can select.
  - id: regenerate-generated-runtime-after-touching-its-source
    evidence: |
      With `server/src/cloudbase-store.ts` fixed, `tests/ui04d.test.mjs` and `tests/ui04e.test.mjs` still
      failed 7 and 8 tests respectively, because the deployable `cloudfunctions/tianfu2/runtime/*.js` had
      not been regenerated. One `--write` after source stabilisation turned both fully green with no test
      edits.
    impact: |
      A stale generated artifact produces failures that look like product regressions but are only build
      drift. Chasing them without regenerating wastes a bounded verification budget.
    workaround: |
      Stabilise the TypeScript source first, regenerate once, and only then attribute any remaining
      failure. Do not relax a test to accommodate stale generated bytes.
