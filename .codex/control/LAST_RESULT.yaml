blockers:
  - id: SIM02-P6-UNREACHABLE
    severity: task-acceptance
    criterion: P6-observed-at-least-once
    detail: >-
      P6 was selected 0 times in the required 600 runs and 0 times in the 1800-run escalation
      control. Root cause proven on the live run: selectDirectorEvent returns at the first
      non-empty slot, the reducer offers [P4,P5,P6], and at all 3383 action nodes where the P4
      tier was empty the P5 tier still had an eligible candidate (P5 populated at 5205/5205
      nodes = 100%). The P5 'contextual' and P6 'ordinary' index slices are disjoint (12 events
      each, 0 overlap) so P5 cannot exhaust P6's pool, and scoreDirectorEvent makes any
      unblocked candidate eligible via baseWeightDefault = 100. P6 is therefore shielded by
      strict precedence ordering, not by rarity. Making it reachable requires a Director
      precedence/weight change or a CONTENT01 index-slice change, both outside SIM02 scope.
      Not a P0/P1 invariant failure: no determinism, security, fairness, data-loss or idempotency
      invariant is violated. It is a reachability observation that SIM02 itself gated on.
toolingObservations:
  - id: CONTEXT-LOADER-MALFORMED-TASK
    severity: P2
    detail: >-
      node .codex/context.mjs SIM02 exits 2 with "MALFORMED_TASK: .codex/tasks/LOOPFIX02B3.yaml:15 unknown field design".
      .codex/context-lib.mjs ALLOWED_FIELDS has no "design" key, and discoverTaskDefinitions parses every
      .ya?ml under .codex/tasks/, so one non-conforming file breaks the loader for all tasks, including SIM02.
      Files using "design": LOOPFIX02B3.yaml and SIM02.yaml. INDEX.yaml is skipped by name so it is not affected.
      Proven pre-existing: the same failure reproduces at base commit 2dc7fb77 before any SIM02 change.
      Not repaired here because SIM02 forbiddenScope excludes task-contract and tooling changes, and fixing it
      would alter LOOPFIX02B3.yaml/SIM02.yaml, which are controller-owned dispatch artifacts.
      Recommendation: controller either adds "design" to ALLOWED_FIELDS as a non-list pass-through field, or
      moves the "design" body into the existing "in" list for both task files.
recommendedCommitMessage: "SIM02: report-only scene-order instrumentation; 600-run verification BLOCKED on P6 reachability (0/600 and 0/1800, precedence shadowed by a 100%-populated P5 tier); 10/11 acceptance criteria PASS, B3 P4 gate 0 violations"
