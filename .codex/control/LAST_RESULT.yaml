summary: |
  RECONSTRUCTED. The legacy game stylesheet was historically truncated, so real DevTools rejected the
  package with `pages/game/game.wxss(253:14): unexpected token`. The truncated final declaration was closed
  and a missing suffix was reconstructed from the committed game.wxml/game.js plus the surviving
  stylesheet's own conventions; the package copy was then refreshed through the existing mirror tool, so
  both sides of the mirror are byte-identical and structurally complete.

  The durable half of the task is the new gate. LIVEFIX02 proved a mirrored file equals its source and the
  build still failed, which is the whole defect class: a freshness gate cannot answer "is the source
  syntactically complete". `tools/wxss-integrity-audit.mjs` now answers that question fail-closed for every
  registered page stylesheet and both sides of every mirrored WXSS, and it is wired into the route guard,
  so a future mirror cannot be fresh-but-invalid again.

  Static class coverage went from 67 undefined classes (packaged template) to 0, with all 6868 surviving
  pre-truncation bytes preserved verbatim and the repair kept strictly append-only.
