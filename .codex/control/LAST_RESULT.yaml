summary: >-
  Fixed the Content01 live-client copy coverage defect. packages/content/src/content01-v1.ts has
  always carried the authoritative Chinese wording in CONTENT01_ZH_CN (340 keys), and the real EVENT the
  Controller observed in WeChat DevTools — content01.ordinary.night-rain at stateVersion 4 — projected
  夜雨 with a full body and three choice labels. The client rendered all of them as raw content01.*
  keys because v2-live.js kept a hand-maintained CONTENT_COPY of 18 page/dev keys, and presentLabel()
  returns the key verbatim on a miss. The server projection and CloudBase were correct throughout; only
  the client catalog was incomplete. The Content01 catalog is now GENERATED from CONTENT01_ZH_CN by
  tools/content01-zh-cn-module.mjs into a static WeChat-safe module and merged into CONTENT_COPY by
  exact key, with the page-specific entries layered on top so no existing displayed string changes.
  Coverage is complete for all 340 committed keys, not only night-rain.

