gates:
  wxssIntegrity: >-
    FAIL on the base tree with 6 violations correctly pinpointing line 253 on both the source and the
    mirrored copy; PASS after the repair. This is the gate that did not exist when DevTools failed.
  negativeControls: >-
    The exact line-253 truncation, an unbalanced closing brace, a stray closing brace, an unterminated
    block comment, an unterminated string, an unclosed function argument list and a dangling trailing
    comma are all rejected. Two positive controls — braces/quotes/parens appearing inside strings and
    comments, and an escaped quote — are correctly accepted, so the audit is not simply flagging every
    brace it sees.
  routeGuardIntegration: >-
    A negative control feeds the real truncated bytes to the route guard through its injected reader and
    requires a violation naming line 253, proving the integration fails closed rather than merely calling
    the audit and ignoring the result.
  mirrorVsValidity: >-
    The gate and the mirror are asserted independently on purpose. Freshness alone is what let a truncated
    file ship, so the two facts are proven separately and neither is inferred from the other.
