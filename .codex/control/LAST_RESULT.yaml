summary: >-
  UI02 is the first deliberately player-visible Tianfu-sim 2.0 slice: a dev-only WeChat preview route
  that renders the in-life core loop in the frozen paper/ink/cinnabar/restrained-dark-gold visual
  language, built entirely on authoritative server projections. No gameplay rule, contract or content
  file was touched.

  New preview route miniprogram/pages/v2-preview/v2-preview is registered as the LAST entry of
  miniprogram/app.json pages, is not the first page and is not a tabBar entry. The four required visual
  states render: RUN_HOME, EVENT, SPECIAL_NODE and LIFE_ARCHIVE. RUN_HOME presents public status, public
  lifespan pressure (derived only from already-public age/maxAge), public conditions, public Cause
  clues, Build identity, known people and exactly the four core action intents
  cultivate/travel/worldly/pursuit. EVENT is a full-page decision state showing public participants,
  server-built riskPresentation per option, and locked ordinary-back while unresolved. SPECIAL_NODE
  renders the same generic authoritative interaction/retry boundary through the identical builder and
  shell path, with no second breakthrough rules engine. LIFE_ARCHIVE is read-only and aggregates only
  public history, explicit/hinted Causes, known people, public Build identity and the public death
  projection.

  Three implementation pieces make this real rather than mocked:
  (1) server/src/viewmodel.ts gains a public breakthrough special-action projection in publicRun
  (specialActions), emitted only for a non-terminal run with a configured InnateProfile and an ordinary
  successor realm, whose available flag mirrors the reducer legality exactly (active status, no pending
  interaction, cultivationBps 10000, successor realm) and whose only payload is
  actionId/kind/available/labelKey/optional blockedReasonKey plus the target realm's id and displayName.
  It exposes no difficulty, odds, RNG, check spec, hidden modifier, score, retention or lifespan value.
  (2) packages/wechat-shell/src/index.ts gains platform-neutral presentation mapping:
  mapCoreActionIntents (bounded to the four core action ids, dropping unknown/malformed projections
  rather than guessing) and mapSpecialActionIntents (emits ATTEMPT_BREAKTHROUGH purely from the
  server-projected availability flag), plus buildArchiveView for the read-only LIFE_ARCHIVE selection.
  (3) tools/ui02-preview-fixtures.mjs generates miniprogram/pages/v2-preview/v2-fixtures.json through
  the production chain generateServerDestinyOffer -> reduce(START_RUN) -> ServerViewModelBuilder.build
  -> buildWeChatPageShell -> the two intent mappers -> buildArchiveView, so the preview page renders
  real projection output and never invents a rule.

  Scope guarantees were verified by content, not by assertion: the UI02 test suite pins base tree
  digests for miniprogram/pages/start, miniprogram/pages/game, miniprogram/pages/rank,
  packages/core/src, packages/content/src and miniprogram/app.wxss and asserts they are unchanged, so
  legacy 1.0 gameplay logic and all Core/Content gameplay sources are byte-equivalent to the task base.
  The suite also asserts the committed fixture is exactly what the real code regenerates, that the
  fixture contains no authoritative rule state, that hidden Causes and unmet NPC state never surface,
  that capability-disabled entries stay hidden, and that preview code contains no legacy 1.0 neon value.

  Evidence highlights: 282/282 full npm test (was 264), 18/18 dedicated UI02 tests, 6/6 viewmodel-ui
  (A12 security boundaries intact), typecheck/lint/content-lint/content01-lint/secret-scan all green.
  The projected breakthrough availability is proven equivalent to the authoritative reducer on five
  distinct states rather than merely asserted.

