summary: >-
  UI03 wires the accepted UI02 presentation layer to a reusable live-session controller. A new
  `WeChatRunController` (packages/wechat-shell) consumes only PublicViewModel + ApplicationTransport +
  PlatformStorage + the accepted shell mappers: it loads the authoritative ViewModel, maps a player
  intent to a GameCommand, submits it, exposes the pending/retry/reconfirmation state, and projects the
  next page model. Gameplay authority stays entirely server-side - the controller rolls no RNG, resolves
  no outcome and computes no eligibility, risk or breakthrough odds.

  The controller owns only the in-life UI02 loop: RUN_HOME core actions, EVENT option submission,
  ATTEMPT_BREAKTHROUGH, SPECIAL_NODE option submission, and LIFE_ARCHIVE as a local read-only side-page
  overlay over RUN_HOME.

  CommandSubmissionController remains the SINGLE owner of the envelope, commandId generation and
  persistence, retry, and STATE_CONFLICT reconfirmation. WeChatRunController wraps exactly one instance,
  persists nothing itself, and passes its snapshot straight through - proven both structurally (the shell
  never calls the storage port) and behaviourally (a fresh controller recovers the identical pending
  commandId over the same raw storage).

  ONE SERVER-SIDE PROJECTION DEFECT HAD TO BE FIXED TO MAKE THE TASK POSSIBLE. The COMMAND contract keys
  CHOOSE_EVENT_OPTION by `eventId`, but the public CurrentInteraction only exposed `interactionId`, which
  is an *instance* identity: a real reducer-produced event carries
  `instanceId = "event:<commandId>:<eventId>"` (verified empirically, not assumed), so it is not equal to
  `eventId` and cannot be parsed back into one without guessing. Before UI03 the public ViewModel could
  therefore not construct the contract's own command at all: a client had to rebuild the id from
  `interactionId` or from a presentation key. The fix is the smallest additive one - the server projects
  the authoritative `state.run.events.current.eventId` verbatim onto the decision interaction - and it
  publishes nothing new: past event ids are already public through `history[].data.eventId`, and an event
  id is content identity, not authority or hidden state. `destinyOffer` deliberately carries no `eventId`
  because it precedes any run event. See scope / contractExtension / disclosedScopeNotes.

  All E2E evidence uses the REAL CommandGateway + GatewayApplicationTransport + ServerViewModelBuilder;
  only PlatformStorage and the commandId factory are injected doubles, exactly as the platform boundary
  requires. Verified end to end: a real core action -> EVENT -> event-choice round trip on the real
  gateway; a real ATTEMPT_BREAKTHROUGH round trip from a server-projected available state (mortal ->
  qi-refining); retry of a transient failure reusing the identical commandId and payload with exactly one
  commit; STATE_CONFLICT refreshing the latest ViewModel and demanding an explicit reconfirmation with a
  fresh commandId against the latest stateVersion; unresolved EVENT and SPECIAL_NODE back protection; and
  LIFE_ARCHIVE navigation that submits nothing and mutates nothing.

  NOT DONE, BY DESIGN: the production WeChat transport is not wired and the default route is unchanged.
  The integration seam and the UI04 boundary are documented in docs/UI03_LIVE_CONTROLLER.md.

