summary: |
  One bounded live fix at the CloudBase persistence boundary, plus the proofs that make it trustworthy.

  1. FIX, IN ONE PLACE. `server/src/cloudbase-store.ts` now owns a single classifier
     (`isMissingDocumentError`) and a single read helper (`readDocumentData`). `readRun` and the
     transactional read for ALL FOUR kinds — run, command idempotency receipt, bootstrap mapping,
     terminal-transition receipt — go through that one helper. A collection that exists but has no such
     document reads as `undefined`; everything else is rethrown unchanged. No copy-pasted catches, and no
     change anywhere else: the client, the gameplay layer, the gateway semantics and the schema are
     untouched.

  2. THE CLASSIFIER IS DELIBERATELY NARROW. It requires two independent pieces of evidence — the message
     is about a *document* (naming its `_id`) AND it says that document is absent — plus either the exact
     `-502005` code (shape A) or the literal production sentence recorded from the live environment
     (shape B). A message that names a missing COLLECTION is checked FIRST and always loses: swallowing it
     would turn "the deployment did not create the collections" into "your data is empty". Permission,
     network, transaction conflict, malformed, uncoded and unknown errors all fail closed.

  3. THE HARNESS NOW LIES LESS. `tools/ui04d-cloud-harness.mjs` reproduces the real rejection by default
     (`missingDocumentMode: "reject"`, `errCode: -502005`); the old friendlier behaviour is kept as
     `"empty"` only so a test can contrast the two. `provisionedCollections` makes a missing collection
     separately reproducible. This is why the incompatibility survived every previous suite: the old fake
     answered `{ data: undefined }`, so nothing ever exercised the rejecting path.

  4. PROOFS, NOT ASSERTIONS OF INTENT. `tests/livefix01.test.mjs` (15 tests) is registered as
     `test:livefix01` and in the aggregate. It proves: both accepted shapes; 14 near-miss shapes that must
     stay fatal (including collection-not-found with the same numeric code); all four read kinds;
     collection-absence remaining fatal with zero writes; a completely empty four-collection database
     supporting the first `createRunOffer` (exactly one run + one bootstrap mapping, one transaction);
     same-bootstrap retry and cold start recovering the same run; first command and first terminal
     settlement with no prior receipt, each settling exactly once on an exact retry; `readRun` unknown-run
     compatibility with the existing fail-closed ownership answer; and the deployable host
     `cloudfunctions/tianfu2/index.js` driving a first run on an empty database.

  5. ARTIFACT, ONCE. The cloud runtime was regenerated a single time after source stabilised; freshness,
     dependency/closure audit and the 15-check smoke are all green.

  6. DOCS. `docs/UI04D_CLOUD_BACKEND.md` gained an "空库首次使用（LIVEFIX01）" section stating that all
     four collections may be empty and the first request creates its own documents, that a missing
     collection is an unmet deployment prerequisite, and that the response to a `-502005` naming
     `collection` is to create the collection — never to widen the classifier. The data-model table also
     gained the fourth collection, which the doc had never listed.
