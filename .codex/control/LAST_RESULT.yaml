toolingObservations:
  - id: TIMEOUT-BINARY-MISMATCH
    severity: P2
    detail: >-
      The Windows timeout binary on PATH is the native Windows tool and rejects the coreutils form
      (timeout 150 node ...) with "错误: 无效语法。默认选项不允许超过 '1' 次。". Any harness that shells out to
      timeout will silently misbehave. Use spawnSync(..., { timeout }) from Node instead. Recorded for the
      controller's harness conventions; not a task defect.
  - id: TSC-NOT-LOCAL-DEP
    severity: P2
    detail: >-
      node node_modules/typescript/bin/tsc fails with MODULE_NOT_FOUND because typescript is not a local
      dependency of this workspace; the typecheck gate only resolves via the tsc on PATH. Use
      npx tsc --noEmit (exit 0 here). Recorded because a fresh agent will otherwise misreport the
      typecheck gate as failing.
