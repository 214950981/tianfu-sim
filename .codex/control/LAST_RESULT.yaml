      commerce/ads, ITEM01, TECH01, SECT01 or WORLD01.

toolingObservations:
  - id: T1
    severity: INFO
    title: this session's proxy port is 127.0.0.1:46226 and reads succeeded on the first attempt
    evidence: >-
      `env | grep -i _proxy` reported http_proxy/https_proxy/HTTP_PROXY/HTTPS_PROXY all as
      http://127.0.0.1:46226 (a THIRD port after the 18036 and 23843 recorded in TOOLING_RUNBOOK.md).
      `git fetch --no-tags origin dev/tianfu-2.0` succeeded on attempt 1 with no 502 and no retry needed,
      and both `git ls-remote` calls also succeeded first try. The documented 40x retry loop was prepared
      but never entered.
    impact: >-
      Reinforces the runbook rule: read the port from the environment, never hard-code it. Network
      quality varies per session, so the retry loop must stay in place even when one session is clean.
    workaround: >-
      Use the runbook's bounded background retry loop; it remains correct and cost nothing here.
  - id: T2
    severity: INFO
    title: positioning a worktree on a remote HEAD without any ref write works and is the safest recipe
    evidence: >-
      `git read-tree -u --reset <sha>` followed by writing the worktree HEAD file (<common>/.git/worktrees/
      <name>/HEAD) with "<sha>\n" produced a clean status and `git rev-parse HEAD` == the sha, with zero
      git-side ref writes. `git write-tree` then equalled `<sha>^{tree}`, which is the byte-identity proof.
      Object, index and worktree state were all unaffected by the documented ref-write deletion issue.
    impact: >-
      The synthetic-tree fallback (allowSyntheticTreeBase: true) was NOT needed this session, but this
      recipe is what made real-ancestry base setup safe and is worth keeping as the default.
    workaround: >-
      Position worktrees this way; only fall back to synthetic-tree if the remote commit object truly
      cannot be fetched.
  - id: T3
    severity: INFO
    title: reproducing an untouched-base failure without git ref writes, via git archive
    evidence: >-
      `mkdir .b2base/base && git archive <baseCommit> | tar -x -C .b2base/base` materialises an exact
      pristine base tree read-only, and the failing suites can then be run with cwd inside it. This
      reproduced the 3 EBUSY failures identically (see ebusyEvidence.proof1_base_reproduction).
    impact: >-
      This is a strictly safer alternative to `cp package.json .b2base/... && git checkout -- package.json`
      for a task whose diff spans more than one file, and it needs no ref write and no stash.
    workaround: >-
      Prefer git archive for base reproduction; remove the extracted .git directory if a stray
      `git init` was run inside the scratch tree, so the outer repo does not see a nested repository.
  - id: T4
    severity: INFO
    title: a transient sandbox error can abort a multi-command Bash call with no side effects
    evidence: >-
      Two composite Bash calls (several chained commands with `&&`/`;`) failed as a whole with
      `Error: sandbox-center cmd decisionRecord missing actual resource subject` and printed no command
      output; splitting them into single-purpose calls succeeded immediately. One of the aborted calls
      included a `git status`, so no partial state was written.
    impact: >-
      A composite command is all-or-nothing at the sandbox layer, so a failure there can look like a
      command failure. It is a harness artefact, not a repo or test problem.
    workaround: >-
      Split long chains into single-purpose Bash calls when this appears; re-run the pieces rather than
      debugging the command itself.
  - id: T5
    severity: INFO
    title: nested-node EBUSY is unchanged this session and still needs the two-proof standard
    evidence: >-
      3 aggregate failures, all spawnSync/execFileSync EBUSY, reproduced identically on the untouched base
      (proof 1) with every direct tool green (proof 2). See ebusyEvidence.
    impact: >-
      The aggregate `npm test` exits 1 in this sandbox. Report it as "green apart from proven environment
      noise", never as plain green.
    workaround: >-
      Keep the two-proof standard. This session added a reusable base-reproduction recipe (T3) that makes
      proof 1 cheap for multi-file tasks.
  - id: T6
    severity: INFO
    title: WeChat DevTools worktree pollution did NOT occur this session
    evidence: >-
      `git status` after all edits shows exactly the 8 intended task files plus the two new files, and no
      `miniprogram/project.config.json`, no page-level `project.config.json`, and no
