toolingObservations:
  - id: T1
    severity: ENVIRONMENT
    inherited: true
    title: nested node process spawn fails with EBUSY in this sandbox
    evidence: >-
      execFileSync / spawnSync of process.execPath (and of git.exe by absolute path) returns status null
      with EBUSY in this worktree, so any tool that shells out cannot run from inside a Node script here.
      git itself works when invoked from the shell, which is how the base was built and pushed. This does
      not affect the targeted fast-lane suites, which run in-process.
    impact: >-
      Unchanged from the UI02R2A2 report: the three nested-spawn tests in a full-suite run report EBUSY
      regardless of repository content. Judge them as environment noise.
  - id: T2
    severity: PROCESS
    title: the agent network proxy is flaky and the sandbox destroys git ref writes
    evidence: >-
      git ls-remote / fetch against origin intermittently fail through the proxy and succeed on retry. Any
      git command that updates a ref (commit / reset) can exit 0 while leaving the branch ref absent, so
      this run used object-only plumbing plus a hand-written ref file, and verified both the work branch
      and the unchanged source branch with a retried ls-remote.
    impact: >-
      Informational; no action needed. Consistent with the runbook.
  - id: T3
    severity: TOOLING
    title: no WXSS compiler exists in this repository
    evidence: >-
      tools/wxss-compat-audit.mjs is a curated subset check. It verifies no universal selector, no
      attribute selectors, no parameterised pseudo-classes, only supported at-rules and media conditions,
      and that every definite-sized padded/bordered box declares border-box (now 22 boxes), but it cannot
      prove the stylesheet compiles or renders.
    impact: >-
      The new entry stylesheet's real compile and rendering must be confirmed in WeChat DevTools during
      the human pass; a compile error would show up as a red build, not as a failed audit here.

