toolingObservations:
  - >-
      route-guard and package-closure scan JavaScript COMMENTS as code. A comment that quotes the
      non-literal require form verbatim is reported as a real violation, so a page cannot document the
      anti-pattern it is avoiding. Reword the comment rather than weakening the audit. This was caught by
      ui04c on the first run.
  - >-
      Editing files in this Windows worktree with python io.open(...,'w') rewrites LF sources to CRLF and
      silently inflates the git diff: a 48-line edit displayed as 1424 changed lines. After any scripted
      edit, compare with `git diff --stat --ignore-cr-at-eol` and normalize back to LF before staging.
  - >-
      The Write/Edit tools intermittently report success without the file changing on disk in this
      worktree. Re-read or grep the file to confirm a scripted edit landed before reasoning about the
      resulting test failure, or you will debug a fix that was never applied.
  - >-
      When a Node test slices a miniprogram page source to evaluate part of it in a vm context, the slice
      must include the whole of any helper it binds. Cutting at a helper's own signature excludes its
      body and yields "<helper> is not defined", which reads like a product failure.
  - >-
      Arrays produced inside a vm realm have a different Array.prototype, so assert.deepEqual fails on
      prototype identity alone. Round-trip through JSON.parse(JSON.stringify(...)) before comparing, or
      use deepStrictEqual on plain data.

