changes:
  - file: tools/ui04b-wechat-runtime-artifact.mjs
    kind: added
    note: >-
      The generator and freshness check, 615 lines. Exports the pinned RUNTIME_MODULES table (source ->
      artifact -> sibling specifier), the bounded FACADE_EXPORTS allow-list, buildRuntimeArtifact({ read })
      as a pure source-bytes to artifact-bytes function, checkRuntimeArtifact({ root, read, files }) and
      writeRuntimeArtifact(). Contains the ESM to CommonJS transform, a comment/string mask used for
      statement detection, the per-file provenance header, and assertCommonJs() which compiles every
      emitted file with vm.Script and rejects leftover module statements, non-literal requires, requires
      outside the pinned sibling set and any TypeScript-only syntax marker. CLI: the default is a freshness
      check that exits 1; --write regenerates and is idempotent. Uses only node:crypto, node:fs,
      node:module and node:vm.
  - file: miniprogram/runtime/command-wire.js
    kind: added
    note: >-
      GENERATED, 10915 bytes. Derived from packages/command-wire/src/index.ts (sha256
      402d9316ed1878d53705aba8e5f8a5f3dfcccb51739b927f28b725ac3edaa602). Publishes the same names the
      accepted module exports and has zero require edges, because the accepted module has zero imports.
  - file: miniprogram/runtime/application-ui.js
    kind: added
    note: >-
      GENERATED, 6961 bytes. Derived from packages/application-ui/src/index.ts (sha256
      58d8d44f092eb9731a5b4f6816c5d52432a241a1ee9bd7312e163cf33929b529). Its single runtime import of the
      wire codec became require("./command-wire.js"); its type-only platform-contract import was erased by
      the stripper and creates no runtime edge.
  - file: miniprogram/runtime/wechat-shell.js
    kind: added
    note: >-
      GENERATED, 21180 bytes. Derived from packages/wechat-shell/src/index.ts (sha256
      1e73f1cccd6e63037a3032bbcaadc91ace7fd051c7b6424403c57b54d5e67949). Its named import of application-ui
      became require("./application-ui.js"); its type-only imports of command-wire and platform-contract
      create no runtime edge; its named re-export was folded into module.exports.
  - file: miniprogram/runtime/index.js
    kind: added
    note: >-
      GENERATED bounded facade, 1388 bytes. The only entry point a page should load. Requires exactly
      ./command-wire.js and ./wechat-shell.js with static string literals and re-publishes the eight pinned
      names verbatim. Generated from FACADE_EXPORTS, not from whatever the modules happen to export.
  - file: tools/ui04b-wechat-runtime-audit.mjs
    kind: added
    note: >-
      Generated-artifact audit, 275 lines. Pure auditWeChatRuntimeArtifact({ root, files, read }) so a test
      can drive every check to failure against an in-memory mutation without touching the worktree; exports
      facadeExportKeys() which parses both the module.exports literal and later direct assignments. Reuses
      the accepted requireArguments / nonLiteralRequireArguments from tools/ui02-preview-fixture-module.mjs
      rather than duplicating the code mask, which is also what keeps comment prose from being read as a
      call. CLI exits 1 on any violation.
  - file: tools/ui04b-wechat-runtime-smoke.mjs
    kind: added
    note: >-
      Node-executable CommonJS smoke, 442 lines. loadRuntimeArtifact() compiles each committed artifact file
      inside ONE shared node:vm context through a CommonJS module wrapper, so top-level var/function
      declarations stay module-scoped; the shim refuses non-relative specifiers and any specifier that
      escapes the artifact directory. runSmoke() performs the eight checks described in summary, including
      the differential comparison against the accepted TypeScript sources and the end-to-end controller
      parity with byte-identical submitted envelopes. Exports runSmoke(), loadRuntimeArtifact() and
      fixtureViews() so the dedicated suite consumes the same code path instead of a second implementation.
      CLI exits 1 on failure.
  - file: tests/ui04b.test.mjs
    kind: added
    note: >-
      16-test dedicated suite, 530 lines: derivation provenance, determinism including CRLF-independence and
      idempotent write, freshness for source drift / artifact drift / extra files, six generation
      fail-closed cases, one facade-completeness fail-closed case, the audit green plus eleven negative
      controls, the literal-require sweep over every miniprogram module, the smoke green plus three loader
