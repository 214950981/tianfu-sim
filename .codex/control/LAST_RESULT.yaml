recommendedCommitMessage: |
  LIVEFIX02: close the whole MiniProgram package and gate it permanently

  - mirror four root-level legacy files into miniprogramRoot byte-exactly, not just the two dispatched:
    start/data.js, game/game.js, and the two page stylesheets whose templates use 74 and 101 static classes
  - add a manifest-driven mirror tool with freshness check and write mode, so 1.0 semantics are preserved by
    construction and drift is a gate rather than a convention
  - add a static package-closure audit that reads miniprogramRoot from project.config.json and proves every
    registered page has a committed Page(...) entry and the whole relative-require graph closes transitively
    inside the root; a root-level file can never satisfy a package dependency
  - wire the closure audit into the route guard as check I, so "v2-live is registered" implies "v2-live boots"
  - re-pin the two UI04B digest pins that LIVEFIX01 left stale, with attribution, and stop the digest from
    counting the package-lock.json that the documented npm install step writes
