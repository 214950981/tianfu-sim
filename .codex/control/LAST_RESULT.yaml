toolingObservations:
  - >-
    The choices() template branch auto-appends buildEffect(spec.build) to the engage option, but the
    choiceSet authoring branch only appends what the author declared. Rewriting an event from
    choices() to choiceSet therefore SILENTLY drops its 道途 evidence and breaks CONTENT01-019, which
    requires a build-tagged Event to have an engage. Any future authoring of a build-tagged event must
    declare ADD_BUILD_EVIDENCE explicitly.
  - >-
    actorBindingKey resolves through the event's participants, so an effect carrying it on an Event
    with no participants fails at APPLY time as npc.invalid, not at load time. Two echo Events
    (road.kindness-echo, road.conflict-echo) have no participant by design and had to lose their
    significance effects rather than be given a participant the fiction does not have.
  - >-
    Editing files in this Windows worktree rewrites LF sources to CRLF and silently inflates the git
    diff: a 95-line change displayed as 399 insertions and 348 deletions across three files. After any
    scripted edit, normalize back to LF with sed -i 's/\r$//' before staging, then re-run the suites
    that read those files. Caught immediately before the stage E commit.
  - >-
    content01-zh-cn-module.mjs only emits content01.-prefixed keys, so the 16 build.* stage labels
    cannot come from the generator and must live in PAGE_CONTENT_COPY. Regenerating the module will
    never fill them in.
  - >-
    When a Node test slices a miniprogram page source to evaluate part of it in a vm context, the
    slice must include the whole of any helper it binds, or the helper's body is excluded and you get
    "<helper> is not defined", which reads like a product failure. Evaluating the whole module with a
    Page stub avoids the trap entirely.

