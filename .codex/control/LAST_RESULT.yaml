productConflicts:
  - what: >-
      F2 asks for a 关键转折 section selected "only using non-hidden public significance signals", and also
      says to reuse only persisted, published facts. Those two cannot both be satisfied for per-Event
      ranking, because the LIFE_BOOK projection publishes no per-Event significance at all.
    measured: >-
      viewmodel.ts buildPublicTerminal projects publicEvents as { entryId, eventId, nodeIndex, resultTier?,
      choiceId? } and publicCauses as { publicId, level, titleKey?, summaryKey? } — a cause carries no origin
      node, so there is nothing to join an Event to a cause on.
    resolution: >-
      Implemented the fallback F2 itself names: the chronological section is 此生经历, and the public
      cause/build/person changes are presented separately as the life's shape. Adding an origin node or a
      per-Event salience to the public projection would close the gap, but F2 says to reuse what is
      published, so it was not done without authorisation.
  - what: >-
      The ui04b scope pins for `cloudfunctions` and `server/src` remain stale, and F4 forbids re-pinning them.
    measured: >-
      pins b9e1e056 (cloudfunctions) and 39f0ec63 (server/src); task base 2b84b553 measured c3bc1592 and
      9d9ccc95 over a `git archive` extraction, so the suite was already failing before this task began.
      Current values: cloudfunctions f595e4a4 (moved this pass because the content source changed and the
      derived cloud runtime carries it), server/src 09a17ce7 (unchanged this pass).
    resolution: >-
      Left alone and disclosed. Regenerating the derived cloud runtime is required for tests/ui04d.test.mjs
      to hold, and that suite's own freshness assertion is not compatible with freezing these bytes; the two
      pins and the freshness gate cannot both be satisfied once a source changes. Recorded rather than
      resolved, because the guard belongs to another task.

residualRisks:
  - >-
    Manual visual QA was NOT performed. Everything above is proven against the real engine, the real
    transport and the page's real render model. The concrete smoke steps: open v2-live, choose a destiny,
    take a core action, resolve the opening Event and confirm the panel names the Event and prints
    你选择了：<the option label> above the effect lines; let a choice end the run and confirm the button
    reads 查看终局; open 生平录 and confirm the chosen option is named; and at ENDING confirm the life book
    shows 此生经历, the 此生如何走到终局 introduction and the separate 此生的变化 section.
  - >-
    The 11/4/2 live observation from stage A is still not reproduced from a real run. What was reproduced
    and fixed is the mechanism that allowed such a mismatch: two different count definitions reaching three
    screens. A derived fixture proves the screens now agree; the original live run is not available.
  - >-
    Two of my own new tests failed on real defects rather than on the fixture, which is worth naming. The
    page referenced UNKNOWN_LABEL, a constant the earlier B4 pass had already renamed away — a
    ReferenceError that only a test executing that path would find. And the receipt key `.outcome` tripped
    ui04c's crude substring guard. Both were fixed in the product or in my own naming, not by weakening a
    guard.
  - >-
    `resolutionNote` is rendered only when nothing beyond time was gained, and no current reachable scene
    both authors a note and settles a gain, so that guard is a safety net rather than an exercised path.

toolingObservations:
  - >-
    A content-only change legitimately leaves the pack checksum identical, because the checksum covers pack
    structure and labelKey/bodyKey are derived from ids. A freshness gate must therefore compare the
    translation artifact separately, which tools/content01-zh-cn-module.mjs already does.
  - >-
    Changing a source tree requires regenerating its derived runtimes in the same commit. The cloud runtime
    carries the content translation map too, so a pure copy pass can still make it stale.
  - >-
    `wbpush drain` spends its budget across worktrees and can starve the task at hand when older jobs in
    other worktrees keep retrying; `wbpush resume <id>` targets one job.

