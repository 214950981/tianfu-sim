toolingObservations:
  - id: devtools-stub-hides-a-missing-committed-page-entry
    evidence: |
      With `miniprogramRoot: "miniprogram/"` and `miniprogram/app.json` registering `pages/game/game` while
      no `.js` was committed, WeChat DevTools created an untracked `miniprogram/pages/game/game.js`
      containing a `Page({})` with empty lifecycle methods. The page then registers and renders nothing.
    impact: |
      An untracked editor-generated file converts a loud boot failure into a silent blank page, and it also
      makes `git status` noisy in a way that reads like ordinary DevTools pollution. Treating it as pollution
      and deleting it would have restored the boot error without fixing the cause.
    workaround: |
      Classify an untracked page stub as evidence of a missing committed page entry, never as a file to
      commit. `tools/miniprogram-package-closure.mjs` now gates the whole class: every registered page needs a
      committed `.js` that actually calls `Page(`, and the whole package's relative-require graph must close
      inside the declared root.
  - id: filesystem-walking-tree-digests-are-unpassable-after-documented-deploy-steps
    evidence: |
      `tests/ui04b.test.mjs` pins trees with a `fs.readdirSync` walk. The documented deployment step for
      `cloudfunctions/tianfu2` is `npm install` inside that directory, which writes `package-lock.json` next
      to the manifest. The walk counted it, so the `cloudfunctions` pin could never pass on a machine where
      anyone had followed the deployment instructions. `node_modules` was already excluded for exactly this
      reason; `package-lock.json` was not.
    impact: |
      A digest pin that measures the working tree rather than the committed tree produces false failures that
      look like product regressions, and the natural (wrong) response is to re-pin a value that includes build
      output, which then breaks on the next clean checkout.
    workaround: |
      Skip dependency artefacts by rule, the way `node_modules` already is, and keep the pin meaning "the
      committed source did not change". Do NOT shell out to `git ls-files` for this: nested process spawn is
      unreliable in this sandbox (TOOLING_RUNBOOK "Nested Node process EBUSY") and a pin that depends on it
      would fail for environmental reasons.
  - id: accepted-commits-can-leave-digest-pins-stale
    evidence: |
      LIVEFIX01 (f8d5450, ACCEPTED) legitimately changed `server/src/cloudbase-store.ts` and regenerated
      `cloudfunctions/tianfu2/runtime/server-cloudbase-store.js`, but did not re-pin the two UI04B digests over
      those trees. Proven by recomputing each digest over `git archive` extractions of 814f0b6, f8d5450,
      2f95adc and dfeacd2: both MATCH at 814f0b6 and first DIVERGE at f8d5450, with file counts unchanged
      (41 and 10).
    impact: |
      A stale pin fails on every subsequent run, so it gets classified as environment noise and the real
      signal — "this tree is unguarded right now" — is lost. Two trees were unguarded from LIVEFIX01 until
      LIVEFIX02.
    workaround: |
      When a task legitimately changes a pinned tree, re-pin it in that same task and say so in
      `changedFiles` + `toolingObservations`. When a stale pin is discovered later, attribute it by
      recomputing the digest over successive `git archive` extractions rather than guessing, and re-pin with
      a comment naming the commit that moved it — never delete the check.
