disclosedScopeNotes:
  - >-
    Editing tests/ui02.test.mjs and tests/ui02r1.test.mjs was unavoidable: both pin a sha256 of
    packages/core/src, and the mandated extraction changes exactly that tree. Both files' own comments
    state that a later task legitimately allowed to change a pinned tree must update the digest on
    purpose. Every recomputed value is listed under changes, and all other entries in both maps still
    match their original values.
  - >-
    tools/phase2-drift-audit.mjs is the one file changed that the task did not name. It is a direct
    consequence of moving the protocol marker out of packages/core/src/command.ts, it was verified to
    have been broken by the change before being fixed, and the fix re-points a grep at the marker's new
    owner rather than weakening or deleting the check. The controller may prefer a different target.
  - >-
    packages/platform-contract/src/index.ts still type-imports CommandEnvelope / CommandResult /
    GameCommand from the Core barrel. That import is `import type`, so it is erased and creates no
    runtime edge; the task only requires application-ui and wechat-shell to leave the gameplay Core
    runtime graph, and neither package names platform-contract as a client runtime root here. It is
    left untouched to keep the diff minimal. A future task may want to re-point it for type-graph
    consistency.
  - >-
    packages/wechat-shell already declared its own CORE_ACTION_IDS constant before this task. It was
    deliberately NOT refactored onto command-wire's COMMAND_ACTION_IDS: that is presentation-layer
    vocabulary, not the wire codec, and touching it would widen the diff for no boundary benefit.
  - >-
    The audit is a static source-graph analysis, not a bundled-artifact inspection. It proves the
    runtime import graph is Core-free; it does not run the WeChat packager. No miniprogram bundler
    exists in this repository.

toolingObservations:
  - id: TOOL-UI04A-01
    title: spawnSync of node.exe fails in-process but every equivalent CLI works from the shell
    observed: >-
      Reproduced again on the pristine base: tests/import-boundary.test.mjs and the replay CLI test fail
      under `npm test` because `spawnSync(process.execPath, ...)` yields status null (no exception, no
      stderr) or throws EBUSY, while the identical commands run fine through the Bash tool. Note the two
      import-boundary cases do NOT print the word EBUSY - they surface as `null !== 0` and as an
      undefined-stderr assertion, so a future task must not classify by the literal string EBUSY.
    impact: >-
      Any new test that needs a CLI's exit code cannot use spawnSync, or it inherits a guaranteed
      failure that has to be written up as environment noise.
    workaround: >-
      Export a pure function from the tool and import it in the test (the pattern already used by
      tools/ui02r1-layout-audit.mjs and now by tools/ui04a-client-runtime-audit.mjs), and verify real
      CLI exit codes from the shell. Keep the CLI's isDirectRun guard so importing does not set
      process.exitCode.
    runbookCandidate: true
  - id: TOOL-UI04A-02
    title: digest-pinned scope tests silently break when a legitimate extraction changes a pinned tree
    observed: >-
      packages/core/src is pinned by BOTH tests/ui02.test.mjs (BASE_TREE_DIGESTS) and
      tests/ui02r1.test.mjs (BASE_TREE, which additionally pins the exact file list). Making
      packages/core/src/command.ts a re-export broke tests/ui02.test.mjs's UI02_purity case, which is
      NOT in the task's named test list and was only found by running the full aggregate.
    impact: >-
      A task that updates only the pins its own task definition mentions will still fail the aggregate.
    workaround: >-
      After any change inside a preview-pinned tree, grep the whole tests/ and tools/ tree for the OLD
      digest literal before assuming the pin set is complete, and always run the full `npm test` rather
      than only the named suites.
    runbookCandidate: true
  - id: TOOL-UI04A-03
    title: grep-based frozen-semantic-marker audits are stale after a code move
    observed: >-
      tools/phase2-drift-audit.mjs asserts that the literal `ATTEMPT_BREAKTHROUGH` appears in
      packages/core/src/command.ts. After the wire-codec extraction that file contains no declarations,
      so the audit went from overall PASS (untouched base) to overall BLOCKED with exactly one conflict,
      even though the protocol still declares the command.
    impact: >-
      Marker audits placed on an implementation file rather than on the owning module report false
      drift after a legitimate move.
    workaround: >-
      Re-point the marker at the module that now owns it (packages/command-wire/src/index.ts here) and
      record the before/after evidence; do not delete the check. Tools that grep a specific file for a
      marker should be revisited whenever that file becomes a re-export or a facade.
    runbookCandidate: true
  - id: TOOL-UI04A-04
    title: canonical-byte compatibility is cheaply provable with git archive
    observed: >-
      `git archive <baseCommit> | tar -x -C .b2base/base` plus one parameterised harness that imports a
      codec module by ABSOLUTE path (via pathToFileURL) produced a 37-line behaviour matrix that could
      be diffed between the untouched base and the task tree. The whole proof took two node runs.
    impact: >-
      Stronger and far cheaper than asserting bytes from memory, and it covers error text and codes too.
      Requires the codec module to be importable in isolation, which a dependency-free boundary is.
    workaround: >-
      Import the target module by absolute path rather than by relative specifier, so a single harness
      file can be pointed at two different trees without being copied into both.
    runbookCandidate: true
  - id: TOOL-UI04A-05
    title: value/type identity between a compat re-export and its source is directly assertable
    observed: >-
      `export * from "<module>"` preserves object identity, so a test can assert
      `core.validateGameCommand === wire.validateGameCommand` (and the same for the const and class) and
      thereby prove a compatibility shim never becomes a second implementation. TypeScript types are
      erased so only runtime bindings can be compared this way - that is sufficient here because the
      whole hazard being guarded is a duplicated runtime validator.
    impact: >-
      Turns "we kept one source of truth" from a review claim into a machine check.
    workaround: Use the identity assertion in any task that introduces a compatibility re-export.
    runbookCandidate: true
  - id: TOOL-UI04A-06
    title: proxy port and network behaviour this session
    observed: >-
      HTTPS_PROXY was 127.0.0.1:47905 (a port not seen in earlier sessions). One `ls-remote` and one
      `git fetch` both succeeded on the first attempt, and no push retry loop was needed. This confirms
      the runbook's rule to read the proxy port from the environment rather than hardcode it.
    impact: Informational; no workaround required.
    workaround: None needed.
    runbookCandidate: false

recommendedCommitMessage: >-
  UI04A: extract the command/envelope wire codec into a client-safe boundary

  Move the command/envelope wire codec out of gameplay Core into a new dependency-free
  packages/command-wire module, leave packages/core/src/command.ts as a compatibility re-export, and
  point application-ui and wechat-shell at the new boundary so the client runtime graph no longer
  reaches packages/core, packages/content or server.

  Byte-compatible by construction and by test: the same validator, the same canonical serialization
  and the same error text as the untouched base, confirmed against a git-archive of the task base.

  Add tools/ui04a-client-runtime-audit.mjs with a forbidden-edge negative control and a type-only
  control, plus tests/ui04a.test.mjs (16 tests). Re-point the PROG01 marker in phase2-drift-audit and
  update the three ui02r1 / one ui02 Core digest pins that this extraction necessarily invalidates.
  No gameplay, Content, server ViewModel, route or 1.0 page change.
