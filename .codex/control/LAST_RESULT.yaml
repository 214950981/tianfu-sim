summary: >-
  LOOPFIX02B3 attempt 2 provenance repair. Attempt 1 (commit 038cadb on wb-LOOPFIX02B3)
  was CONDITIONALLY_REJECTED: its P4 repeat gate was correct in shape, scope, precedence
  and reporting, but sceneCoreActorIds re-derived a missing P3 actor identity from the
  current Event npcRoleAffinityTags via matchingActorIds. That is a content lookup
  heuristic and can bind the wrong actor when several active core NPC instances share one
  role. The repair removes that helper entirely and makes provenance exact:
  (1) The P4 gate now reads DirectorSceneRecord.actorIds verbatim and nothing else.
  coreNpcRepeatGate(state, coreActorIds) takes no content handle; its body contains no
  getEvent / getCauseTemplate / npcRoleAffinityTags / matchingActorIds / roleIndex /
  templateId reference. It consults only recentScenes.at(-1), so one intervening scene
  with no matching core actor still clears it. Eligibility only; precedence, weights,
  scoring, ordering and RNG are untouched.
  (2) Provenance is written at record time, not re-derived at read time. When the reducer
  records a selected P3 Cause echo it persists actorIds from the exact selected
  CauseInstance.actorIdsByRole, resolved by the causeId already returned by selectCauseEcho
  and already persisted as events.current.triggeringCauseId. The resolve is
  state.run.causes.byId[causeId]; there is no templateId, role, salience or
  unique-active-Cause lookup. Both P3 record sites (chooseAction and chooseEventOption)
  pass it. No new state field, no schema change.
  (3) .codex/contracts/director.ref now states the exact P3 actorIds provenance instead of
  leaving re-derivation implicit.
  Because a P3 echo record now carries the actors it was actually bound to, the gate stays
  exact when two active core NPC instances share a role: the echo's own actor is gated, a
  same-role sibling is neither gated nor mis-bound. B3-P/Q/R/S prove this against the real
  fixture (content01.npc.pei-zhaochuan and content01.npc.cen-bugui both declare roleTags
  ["wanderer"]; a cause bound to pei records [pei] and never cen).
  SCOPE NOTE: the remote source HEAD moved e0e758be -> 733a45ab during this attempt. The
  delta touches only .codex/control/NEXT_TASK.yaml (the controller's dispatch commit);
  no gameplay, core, content or test file changed. The synthetic base was rebuilt against
  733a45ab and the working tree was proven byte-identical to it (tree SHA match) before
  editing, then attempt 1 and attempt 2 changes were re-applied. This attempt is evidence
  only; the controller transplants accepted changes onto the unchanged source HEAD.
