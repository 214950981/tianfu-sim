changes:
  - file: miniprogram/pages/v2-preview/v2-preview.wxml
    what: >-
      Rebuilt the preview markup as a constrained one-screen product surface plus fixed dev/drawer
      overlays. RUN_HOME is now hero + vitals + attention summaries + bottom dock; breakthrough CTA is
      wx:if-gated on vm.runHome.breakthrough.enabled with a compact wx:elif note; EVENT/SPECIAL_NODE
      share one pinned head plus a bounded scroll-view; LIFE_ARCHIVE scrolls only inside its own
      viewport; dev tabs, lastIntent, decisionId, the blocked-back probe and capability diagnostics
      moved into the dev overlay; four read-only drawers added for Builds / Causes / conditions /
      People. REPAIR 2: the "缺少 v2-fixtures.json" notice was replaced by the staged failure panel
      (阶段 / 代码 / 详情 / 模块 / 提示) and the product block now renders only when there is no failure;
      the dev overlay's capability section states that capability entries are unknown while the preview
      data is unavailable instead of claiming "全部可用".
  - file: miniprogram/pages/v2-preview/v2-preview.wxss
    what: >-
      Added the one-screen layout contract: `page` height/overflow lock, .screen 100vh constrained
      flex column, compressible .surface/.page/.home-body/.attention chains, dock and CTA tokens,
      env(safe-area-inset-bottom) reservations, clamps/ellipsis for every dynamic public string, and
      the width/height media bands covering the supported viewport matrix. UI02 paper/ink/cinnabar/
      restrained-dark-gold tokens are unchanged; no legacy neon value, text-shadow or box-shadow was
      introduced. Dead UI02 selectors replaced by the new structure were removed. REPAIR: the
      universal `* { box-sizing: border-box }` rule (which the WXSS compiler rejects) was deleted and
      replaced by explicit box-sizing on the 15 boxes that have a definite size plus padding/border;
      the header now documents the WXSS constraints the file is held to. REPAIR 2: added the bounded
      failure-panel styles (.failure / -title / -row / -key / -value / -hint) using only existing UI02
      tokens, >= 20rpx text and no box-shadow; no definite-sized padded box was added, so the WXSS
      compatibility audit's derived border-box set is unchanged.
  - file: miniprogram/pages/v2-preview/v2-fixtures.js
    what: >-
      NEW generated artifact: the same public-only fixture as a static CommonJS module
      (module.exports = <payload>). The WeChat runtime cannot require() a .json file, which is why the
      preview page could not load its data. Produced by tools/ui02-preview-fixture-module.mjs from the
      existing buildPreviewFixtures(), so it is not a second source of truth: its payload is byte-equal
      to the committed JSON and to a fresh generator run, and tests/ui02r1.test.mjs asserts all three.
  - file: tools/ui02-preview-fixture-module.mjs
    what: >-
      NEW tool that emits the generated fixture as the static JS module the WeChat runtime loads. Its
      only imports are node:fs, node:path and tools/ui02-preview-fixtures.mjs (asserted by test), so it
      cannot rebuild the projection itself; it serializes exactly JSON.stringify(fixtures, null, 2) and
      the JSON writer is the same canonical payload. CLI reports freshness (exit 1 when stale) or
      regenerates with --write.
  - file: miniprogram/pages/v2-preview/v2-preview.js
    what: >-
      Fixture loading rewritten. The page now requires the generated ./v2-fixtures.js module, and a load
      failure produces an explicit staged failure (module / shape / view) instead of being swallowed
      into a "file is missing" message: the previous require of the .json sibling threw at runtime, the
      catch discarded the error, and the page blamed the fixture file while that file was present and
      complete. Diagnostics are bounded and sanitized (absolute and deep repo paths redacted, one line,
      capped at 160 chars) and carry only stage, error name, sanitized summary, the documented module
      specifier and a CLI hint — never fixture content, raw state or environment detail. A view absent
      from the fixture now reports the view stage plus the fixture's key list instead of rendering a
      blank page. REPAIR 3: the load point is now the literal require("./v2-fixtures.js") instead of
      require(FIXTURE_MODULE_SPECIFIER), because the WeChat packager only registers a dependency for a
      statically analysable literal argument and the variable form died at runtime with
      "module '<path>' is not defined". FIXTURE_MODULE_SPECIFIER is retained purely as the failure
      panel's label and is never an argument to require(); a doc comment states the constraint and warns
      against "cleaning it up" back into a variable. REPAIR 4: present() now emits the top-level
      `kind` the WXML switches on. It previously emitted only `pageState`, so every product branch tested
      against an undefined `vm.kind` and the whole product surface rendered blank while `vm` held a
      complete projection — with no failure panel, because nothing had failed. `kind` is derived from the
      authoritative page state through the new PAGE_KIND_BY_PAGE_STATE table (RUN_HOME / EVENT /
      SPECIAL_NODE / ENDING -> LIFE_ARCHIVE) rather than from the fixture key, since page-state.ref keeps
      ENDING and LIFE_ARCHIVE distinct and an ended run is projected as ENDING; `pageState` is still
      reported verbatim. The RUN_HOME variants carry pageState RUN_HOME and therefore keep kind RUN_HOME.
      A page state with no product page fails closed and is reported by the view-stage diagnostic, which
      was reworded to cover that second cause explicitly.
  - file: miniprogram/pages/v2-preview/v2-preview.json
    what: "disableScroll set to false -> true so the preview route cannot page-scroll even outside RUN_HOME."
  - file: tools/ui02r1-layout-audit.mjs
    what: >-
      New structural layout audit: re-derives the RUN_HOME first-screen budget and the decision-head
      share from the committed WXSS tokens and media bands, and asserts page-overflow policy, scroll
      ownership, dev-layer containment, four-action dock structure, breakthrough CTA gating,
      safe-area reservations, touch-target and readability floors, clamping of dynamic strings and the
      six-viewport matrix. Source overrides make it usable as a negative-control target. Exports
      parseDeclarations so the WXSS compatibility audit can reuse the same parser.
  - file: tools/wxss-compat-audit.mjs
    what: >-
      New WXSS compatibility audit (14 checks) written in response to the DevTools compile failure.
      Encodes the documented WXSS selector exceptions and supported at-rules/media conditions, the
      observed rejection of the universal selector, and the derived border-box requirement that
      replaces the removed `*` reset. Explicitly labelled a curated subset check rather than the
      compiler, with source overrides for negative controls.
  - file: tests/ui02r1.test.mjs
    what: >-
      New dedicated suite, now 29 tests: the layout audit green plus fourteen negative controls that
      mutate the audited inputs and require the audit to fail; four WXSS compatibility tests including
      a negative control that reintroduces the universal selector, drops the border-box declarations
      and injects an attribute selector, a parameterised pseudo-class, an unsupported at-rule, an
      unsupported media condition and position: sticky; base-tree digest purity for 1.0 pages /
      server / wechat-shell / application-ui / platform-contract / Core / Content / app.json /
      app.wxss / fixture generator, guarded by pinned base file lists (upgraded from counts so the
      digest fails closed on any unreviewed addition) plus a narrow, self-checking DevTools-artifact
      exclusion; route registration; one-screen and dock structure; matrix coverage and budget;
      dev-layer containment; decision-surface containment and read-only archive. REPAIR 2 adds six
      fixture-loading tests: the page loads the generated JS module and never requires a .json module;
      the committed module and JSON are byte-equal to a fresh generator run; the module payload is the
      canonical payload and loading it (in a vm) yields the same object as the JSON and the generator,
      with no fixture value inlined in the page; the module writer imports only the existing generator;
      a load failure produces a staged, sanitized diagnostic and the markup renders it while no
      missing-file wording remains anywhere; and a behavioural test that runs the page's own sanitizer
      to prove path redaction, whitespace collapsing and the length cap. REPAIR 3 replaces the
      substring assertion on the load point with the static-require regression test: exactly one
      require() in the entry point, its argument a plain string literal equal to the diagnostics
      constant, that literal resolving to the committed module, and no miniprogram module anywhere
      using a non-literal require argument — with four positive and seven negative controls proving the
      checker rejects variables, concatenation, template literals, indexed and called arguments, and a
      mutation applied at the real call site's offsets (the file documents the literal in a comment, so
      a naive string replace would have mutated the comment instead of the call). REPAIR 4 adds the
      UI02R1_kind group, three tests that are behavioural rather than textual: it runs the page module in
      a vm sandbox whose require returns the real generated fixture module, extracts the WXML's
      discriminator vocabulary, and requires (a) every kind present() emits to match a WXML branch and
      every WXML branch to be reachable, (b) pageState still reported verbatim, the ended run keeping
      kind LIFE_ARCHIVE despite pageState ENDING, one page state never forking into two product pages,
      and the variants projecting kind RUN_HOME with a RUN_HOME payload, (c) the page's own
      onLoad/onSelectTab handlers to render every dev tab with failure === null and a matching kind. Six
      negative controls keep it non-vacuous, including one that deletes the kind assignment from the
      committed page source and requires the guard to reject the result on the real fixture.
  - file: docs/UI02_PREVIEW.md
    what: >-
      Documented the one-screen scrolling policy per page state, the supported baseline and the full
      viewport matrix with the wxss band each viewport resolves to, the RUN_HOME four-layer hierarchy,
      the anti-shrinking rules, and an explicit split between executed automated structural proof and
      the manual visual QA that is still required. REPAIR: added the WXSS compatibility section
      (root cause of the compile failure, the border-box rule, and the compatibility audit table), the
      WeChat DevTools generated-artifact section, and a step 0 in the manual QA list telling the
      reviewer to treat any WXSS compile error as a UI02R1 rework item.
  - file: package.json
