summary: >-
  The Controller's second review accepted the B1-B5 fixes and returned four product gates. F1 to F3 were one
  complaint in three places: the game kept stating numbers and labels without saying what the player had
  actually done. The result panel showed what moved but not what was chosen or which scene it was; the life
  book called every recorded Event a 关键转折; and 35 Events still ran on generic buttons. All four are done,
  and the test that proves F1 drives the real client stack rather than a hand-made receipt.

f1ResultPanel:
  problem: >-
    buildResultReceipt rendered 修为 +N / 灵石 +N / 岁月 +N 年 and a generic heading. It never read
    narrative.eventId or narrative.choiceId, both of which the confirmed receipt already carries, so a player
    could still say "I chose something and a number changed, but what did I choose and what was it?".
  fix: >-
    The panel now names the settled Event and shows 你选择了：<label>, both resolved through the same
    exact-key catalog every other surface reads. It is the same receipt and the same ids — nothing is
    inferred and nothing new is projected.
  fallbacks: >-
    An Event or option the catalog cannot resolve reads 详情暂不可用, never an id (PLAYUX01B-017). A
    settlement with no recorded choiceId shows no choice line at all rather than inventing one.
  cta: >-
    The dismissal control follows the authoritative page: 查看终局 when the page is ENDING, 返回在世
    otherwise, so the button cannot promise a home screen that no longer exists. It still submits nothing.
  resolutionNote: >-
    A scene that settles only time records nothing the lines can name, so the scene now authors its own
    answer under `${eventId}.resolution` and the panel renders it — but only when nothing was gained, so a
    note can never sit beside a settled reward. This is what lets old-trace say 这一次追查还没有取得可以
    确认的新线索 without the client knowing what kind of scene it is rendering.

f2LifeBook:
  problem: >-
    buildTimeline copied every lifeBook.events entry and WXML labelled all of them 关键转折. That asserted a
    significance ranking the data does not contain.
  fix: >-
    The chronological section is now called 此生经历 and is presented as what it is. The life's shape is
    presented separately under 此生的变化, built only from the significance signals the projection actually
    publishes: a track the server marked dominant, a cause that reached journal visibility, and the people
    met. Each carries its own published level — 潜藏/萌芽/成形/圆熟 for a track, 明确/隐约 for a cause.
  noRankingExists: >-
    There is no per-Event significance signal to rank on. `lifeBook.events` carries only entryId, eventId,
    nodeIndex, an optional resultTier and an optional choiceId, and public causes carry no origin node to
    join on. F2 forbids inventing one and says to reuse only persisted, published facts, so the fallback F2
    names is what was implemented: the record stays complete and chronological, and the transitions are the
    public cause/build/person changes.
  intro: >-
    Added 此生如何走到终局 as a computed sentence over published facts only — ending age, final realm, the
    shared counts and the known direct cause. It is empty when the sidecar is absent, so it cannot print a
    sentence full of zeroes, and it names no achievement the run did not record.
  sharedBasisKept: >-
    ENDING, LIFE_BOOK and REBIRTH_RESULT still read the one `counts` object, with `paths` and `formed`
    labelled separately.

f3Content:
  templateWording: >-
    All 35 Events that still ran on 顺势而行 / 停步细看 / 见好便收 / 承担此险 / 先辨征兆 / 及时折返 are
    reworded. Remaining generic options: 0.
  mechanism: >-
    `choiceSet` could not be used: on a risk Event the template is what attaches threatId, the tiered
    outcomes and the cause closure, so replacing the choice list would change what a choice DOES in order
    to fix what it SAYS. A `choiceLabels` map on the Spec rewords the template's own option ids instead, so
    no id, effect, threat, cooldown or closure moves — which is what keeps this clear of the LOOPFIX02B2
    closure contract and the RNG rules.
  breakdown:
    - group: Cause origins
      count: 7
      what: the shared 留一句话离开 decline is now scene-specific (只说一句改日再会，不问他的去处 / 退到路边，让他先过去)
    - group: risk template (take-risk / read-signs / turn-away)
      count: 14
      what: each names the act the scene actually presents (抢在合拢之前冲出去 / 先分辨哪一边的声音更近 / 退出松林，绕开这一段)
    - group: default trio (engage / consider / leave)
      count: 14
      what: each names the act and stays inside what the existing effect settles; no option promises a reward the settlement does not produce
  labelsAuthored: 91
  marketChoice: >-
    The B3 pass fixed buy-and-receive-currency by making the player SELL "herbs gathered on the road", which
    silently asserted a possession the run never records — nothing grants herbs at start. The scene is now
    paid work that begins and ends in front of the player: the vendor has a basket of mixed herbs he cannot
    sort and pays a stated fee for having it sorted. Same money-vs-time trade-off, same ids, no prior
    inventory claimed or consumed, and still no purchase (REMOVE_RESOURCE errors as INVALID_OPTION at zero,
    so a buy option would be a choice that fails for a starting player).
  oldTrace: >-
    Its three options settle time and record nothing, which is honest but left the player unable to tell
    whether an investigation had found anything. The recorded choice is now named in the result panel and
    the live archive, and the scene states 尚未取得可以确认的新线索 where none was settled. It promises no
    later payoff and plants no Cause — an actor-free Cause template does not exist, so a pursuit Event with
    no participant genuinely cannot record a lead.

changes:
  - file: packages/content/src/content01-v1.ts
    what: >-
      F3. Adds a `choiceLabels` map to the Spec (rewords the template's own option ids without touching any
      id, effect, threat, cooldown or closure), an `outcomeNote` field published under `${id}.resolution`,
      and authors 91 labels across the 35 Events that still used shared wording. market-choice becomes paid
      work inside its own scene, and old-trace/forked-path author their resolution note. The content checksum
      is unchanged because nothing structural moved.
  - file: miniprogram/pages/v2-live/v2-live.js
    what: >-
      F1 and F2. buildResultReceipt now resolves the settled Event title and the chosen option label from the
      receipt's own eventId/choiceId and states a scene-authored resolution note when nothing was gained.
      buildRenderModel sets the CTA from the authoritative page state. buildTerminal computes the
      此生如何走到终局 introduction and a hasTransitions flag from published facts, and buildTimeline's
      contract is documented as a record rather than a ranking.
  - file: miniprogram/pages/v2-live/v2-live.wxml
    what: >-
      F1 and F2. The result overlay gains the Event title, the 你选择了 row and a CTA whose text comes from
      the model. The life book's mislabelled 关键转折 section becomes 此生经历, gains the introduction, and
      groups the public transitions under 此生的变化.
  - file: miniprogram/pages/v2-live/v2-live.wxss
