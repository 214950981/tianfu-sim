    suggestedOwner: UI03

recommendedCommitMessage: |-
  chore(ui02final): full regression and merge-readiness audit for the UI02 chain

  Verification-only task. No product behaviour, visual or copy change. The single
  non-audit edit is the one the task explicitly permits: tests/ui02copy.test.mjs is
  registered in the aggregate `npm test` command, where UI02COPY had deliberately
  left it out because the full regression was deferred to this task.

  Verdict: PASS - the accumulated chain (UI02 -> UI02R1 -> UI02R2 -> UI02R2A2 ->
  UI02ENTRY -> UI02COPY, 10 commits) is safe to fast-forward into dev/tianfu-2.0 and
  UI03 may start.

  Merge readiness:
  - ancestry is real, not asserted: dev/tianfu-2.0 is a genuine ancestor of the chain
    head and the merge-base IS dev, so this is a fast-forwardable descendant.
  - the full dev -> chain-head diff touches 19 paths, all of them the 2.0 dev-preview
    surface, its UI02 docs/tests/audit tools, package.json, or .codex metadata. ZERO
    changed files under packages/core, packages/content, packages/wechat-shell,
    packages/application-ui, packages/platform-contract, server, the legacy 1.0 pages,
    app.json or app.wxss. No gameplay, Director, server, content, legacy-page or
    default-route change entered through the UI chain.

  Evidence:
  - full regression: 375 tests, 372 pass, 3 fail. All 3 failures are the documented
    nested-process EBUSY class and are classified environment noise only after BOTH
    required proofs: they reproduce identically on the untouched task base (reverted
    package.json, tree == base tree, clean status), and every underlying direct tool
    succeeds when run from the shell (check-import-boundaries exit 0 clean / exit 1 +
    "forbidden import" on the negative-control root; replay.mjs exit 0 with the same
    finalRuleStateHash the test asserts and 2 checkpoints).
  - dedicated suites: ui02copy 11/11, ui02entry 20/20, ui02r2a2 15/15, ui02r2 15/15,
    ui02r1 32/32, ui02 18/18, viewmodel-ui 6/6 (117 tests, 0 fail).
  - gates: typecheck clean, lint PASS, content-lint PASS, content01-lint PASS,
    secret-scan PASS, layout audit 143/143, wxss compat 14/14, fixture freshness green,
    participant-bridge 0 violations, recurrence 0 violations, director 0 violations,
    phase2-drift PASS with 0 conflicts, content-playability 0 AI/network deps,
    context-loader 16/16 plus the UI02FINAL smoke.
  - 600-run simulation NOT run, per the task: no gameplay rule or balance code changed
    anywhere in the chain.

  Also handled: the worktree arrived polluted by a WeChat DevTools session (modified
  project.config.json / project.private.config.json and an untracked
  miniprogram/pages/game/game.js stub that would have shadowed the real 1.0 page and
  broken the digest-pinned regression). All three were copied to a scratch directory
  with a sha256 manifest and moved aside before verification; none is in this commit.

  UI03 was not started.
