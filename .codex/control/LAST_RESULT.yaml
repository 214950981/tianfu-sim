disclosedScopeNotes:
  - >-
    No real cloud deployment was performed - it is explicitly forbidden by the task. What exists is a
    deployable artifact plus exact manual deployment steps (docs/UI04D_CLOUD_BACKEND.md section 6) and the
    list of cloud-side setup that is still manual (section 7: environment binding, the three collections
    and their security rules, timeout/memory configuration, and multi-user acceptance under a real OPENID).
  - >-
    THREE ui02r1 base-tree pins and TWO ui04b pins were updated, not weakened. Every one still fails
    closed: ui02r1 pins the exact file list as well as the digest, so another addition inside server/src
    breaks it; ui04b's cloudfunctions pin covers the whole tree including the new host and all 35 generated
    files. The reason for each is recorded in the file it lives in, in the style the three previous tasks
    used.
  - >-
    ui04b's treeDigestOf now skips node_modules. Without it, following UI04D's own documented deployment
    step ("npm install" inside cloudfunctions/tianfu2) would break that suite. No pinned tree currently
    contains a node_modules directory, so this changed no digest; it only removes a trap.
  - >-
    packages/platform-contract/src was touched only to widen ApplicationTransport.createRunOffer by one
    optional argument, which is what makes the shell's bootstrapId call typecheck. The alternative - a
    redeclaring sub-interface inside wechat-shell - would have left the shared contract describing an RPC
    surface the shell no longer calls that way.
  - >-
    The generated cloud runtime is Node-version sensitive: module.stripTypeScriptTypes is used with mode
    "strip" and its whitespace is Node's own. Freshness therefore compares bytes strictly and the committed
    provenance header records the source digests, so a Node upgrade surfaces as a freshness failure with an
    obvious cause rather than a silent drift.
  - >-
    The harness models the post-commit timeout in the fake database, not in a real CloudBase instance. That
    is the honest limit of the proof: it shows the service and the store settle exactly once when the
    platform commits and then drops the response; it does not prove how CloudBase behaves on a genuine
    network failure. The transaction shape it exercises (doc reads and writes only, no query) is the one
    the platform documents as supported.
  - >-
    docs/dev-status.md was NOT updated. It is the controller's bookkeeping and updating it is outside this
    task's allowedScope; docs/UI04D_CLOUD_BACKEND.md carries the task documentation.
  - >-
    "No gameplay was added" is asserted by source inspection - the closure is exactly the pinned Core /
    Content / server modules and the host contains no reducer, gateway or ViewModel of its own - plus
    behaviour: every page state, action and option the tests drive comes out of the accepted reducer and
    ServerViewModelBuilder. It is not proven by enumerating every expression in the reducer.

toolingObservations:
  - topic: A generated CommonJS module can call structuredClone at load time, so a Node 16 shim must be installed before the require
    observation: >-
      The cloud host installed a structuredClone shim after requiring wx-server-sdk but before requiring
      ./runtime/index.js, and it still failed. The generated content module clones CONTENT01 cause templates
      while it is being EVALUATED, not when it is called, so a shim placed anywhere after the require is too
      late.
    evidence: >-
      The harness surfaced "ReferenceError: structuredClone is not defined" from
      cloudfunctions/tianfu2/runtime/content-content01-v1.js during module evaluation. Moving the shim above
      the require fixed it.
    impact: >-
      CloudBase may run a cloud function on Node 16, which has no structuredClone, so any generated module
      that clones at load time fails on cold start with a message that names neither the shim nor the host.
    workaround: >-
      Install the shim before the first require of the derived runtime, and say so in a comment - the
      ordering looks arbitrary otherwise, and a later tidy-up will turn it back into a bug.
  - topic: A cross-realm object does not satisfy a validator that checks prototypes, so a host harness must serialise the payload
    observation: >-
      Loading a CommonJS host in node:vm and handing it an object built outside the realm lets an "is this a
      plain object" check pass or fail for the wrong reason, which hides exactly the class of bug a cloud
      boundary must catch.
    evidence: >-
      Injecting host intrinsics into the vm context produced "TypeError: npcPack: must be a plain object";
      the real fix was a bare context (console, TextEncoder, setTimeout, clearTimeout, Buffer) plus JSON
      round-tripping the request into the realm and the response back out.
    impact: >-
      A harness that skips the round trip can report green for a payload the real platform would reject, or
      red for one it would accept.
    workaround: >-
      Use vm.createContext with only the globals the host needs, re-parse the request string inside the
      realm, and load once per call - that is what a cold start is.
  - topic: A post-commit timeout must be armed per transaction, not at database construction
    observation: >-
      createFakeCloudDatabase({ throwAfterCommitOnce: true }) armed the failure on the first transaction of
      the database, which is createRunOffer, so the test lost the OFFER instead of the command and failed
      with "Cannot read properties of undefined (reading 'currentInteraction')" - a symptom that points at
      the assertion rather than at the harness.
    evidence: >-
      tests/ui04d.test.mjs case 9 before the fix; after replacing the option with an explicit
      armPostCommitTimeout() called between the offer and the command, the case proves the intended property.
    impact: >-
      A mis-armed failure mode silently tests the wrong operation, and the error message misleads.
    workaround: >-
      Expose an explicit arm and call it at the point the test is actually about.
  - topic: A drifted source can still be a perfectly derivable artifact, so a fail-closed control must drift the right thing
    observation: >-
      Appending "export const drift = 1;" to a source is a legal module transformation and the generator
      correctly derives it, so the control asserted an exception that could never occur and only looked like
      a control.
    evidence: >-
      tests/ui04d.test.mjs case 13 reported "Missing expected exception" until the control was changed to the
      two drifts the generator genuinely refuses: a bare specifier reaching outside the pinned closure, and a
      source that stops publishing a facade export.
    impact: >-
      A negative control that cannot fail is worse than none, because it reads as coverage.
    workaround: >-
      Drift the property the generator actually enforces - the closure boundary and the facade surface - not
      the source's content in general. Freshness, not the generator, is what catches a plain content edit.

recommendedCommitMessage: >-
  UI04D: give the live client a real cloud authority - deployable tianfu2 cloud function, CloudBase
  transactional store, OPENID identity and bootstrap-idempotent run creation
