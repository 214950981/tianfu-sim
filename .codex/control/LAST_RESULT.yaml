      - "not ok 19 - CONTENT01-019 every Build route can reach formed through authored evidence / cause.invalid"
      - ".codex/contracts/event.ref lines 96-98 define exactly this fail-closed contract"
      - "packages/core/src/cause.ts boundTriggeringCauseId() reads only state.run.events.current.triggeringCauseId"
      - "CONTENT01-016 resolves consider on all 10 Cause-linked echoes; CONTENT01-019 resolves engage on 6 of them"
    whyNotFixedByImplementer: >-
      Repairing the two tests requires either (a) injecting authoritative
      triggeringCauseId provenance into the fixture entry used by CONTENT01-016/019, or
      (b) relaxing the closure contract so an unbound triggeringCause is a no-op rather
      than cause.invalid. Option (b) is explicitly forbidden (triggeringCauseId-semantics
      is in forbiddenScope) and would break LOOPFIX02B2_R1's accepted fail-closed
      guarantees. Option (a) edits tests outside LOOPFIX02B2 allowedScope. Both exceed
      "targeted LOOPFIX02B2 tests".
    controllerDecisionRequired: >-
      Choose one: (1) authorize amending CONTENT01-016/019 to enter closure-bearing
      Cause-linked events through a real P3 echo (requires widening allowedScope to cover
      those two test fixtures); (2) authorize CONTENT01-016/019 to re-point their choice
      for Cause-linked events; or (3) restate the closure contract so an unbound
      triggeringCause is legal, which reopens R1 semantics.
    recommend: option 1
