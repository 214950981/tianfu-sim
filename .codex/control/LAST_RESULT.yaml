summary: >-
  UI02R1 is a presentation-only repair. The accepted UI02 data and authority boundary are untouched;
  what changed is the information architecture, responsiveness and safe-area behaviour of the 2.0 dev
  preview, so RUN_HOME behaves like a game control surface instead of a scrollable data sheet. No
  server ViewModel, wechat-shell intent mapping, application UI controller, Core/Content gameplay,
  Director, contract, legacy 1.0 page or app route was modified, and UI03 was not started.

  One-screen is structural, not cosmetic. The preview route sets disableScroll: true, `page` is
  height:100% with overflow:hidden, and the product root is a 100vh flex column whose children are
  constrained with flex + min-height:0 instead of natural document growth. Nothing uses
  min-height:100vh. RUN_HOME therefore cannot page-scroll; the only vertical scrolling anywhere is
  inside explicit scroll-view viewports (the attention region, the EVENT/SPECIAL_NODE decision
  viewport, the LIFE_ARCHIVE archive viewport, the dev overlay and the read-only drawers).

  RUN_HOME was restructured into exactly four layers: (1) a compact identity/lifespan header, (2) core
  cultivation status (修为 / 道基 / 灵石) in one row, (3) at most three public attention summaries
  (dominant Build, one public Cause, one known person) plus a single public-condition row, and (4) a
  bottom action dock. Exactly four core actions stay first-screen visible in a stable 2x2 dock, and the
  primary breakthrough CTA is rendered only through wx:if on the accepted server-projected available
  flag; the unavailable variant renders at most one compact reason line, reserving no large CTA block,
  and because the flexible space is in the middle of the layout the four actions do not move when the
  CTA appears or disappears. Disabled action slots keep their grid cell, so there is no layout jump.

  Density was reduced by removing duplication, not by shrinking text or touch targets. Summarising is
  never a dead end: each summary row opens a read-only drawer, and the one-screen surface offers
  exactly four public detail drawers (Builds / Causes / conditions / People) that only format the
  already-public projection, contain no submission control and surface no hidden Cause or NPC state.
  Every dynamic public string is either single-line ellipsized or line-clamped, and wrapping blocks
  break long raw labelKeys, so long run names, realm ids, cause labels, person names and risk reasons
  cannot wrap the stack taller or create horizontal overflow.

  EVENT and SPECIAL_NODE share one fixed full-screen decision container: the headline, participants and
  the locked-while-unresolved badge are pinned above a single bounded scroll-view holding the narrative
  and the options, so many options or long body copy can never push the decision content off the
  surface. The unresolved decision still cannot be escaped from the product surface because the
  ordinary-back probe now lives only in the dev overlay.

  The dev preview layer is a collapsed floating "调试" trigger plus a fixed overlay, both outside the
  product `.surface` subtree and both position:fixed, so tabs, lastIntent, decisionId, interaction
  state, the blocked-back probe and the capability-entry diagnostics consume zero product layout height.
  Switching a view collapses the overlay so the one-screen result is directly observable. Detail
  drawers are fixed bottom sheets with an explicit 46vh internal scroll viewport. The bottom action
  dock, the decision viewport, the archive viewport and the drawer all reserve
  env(safe-area-inset-bottom) so the home indicator cannot cover controls.

  Responsiveness is an explicit contract rather than a hope: the WXSS declares the supported baseline
  (windowWidth >= 320, windowHeight >= 500 CSS px) and the full viewport matrix
  320x500 / 360x560 / 375x603 / 390x750 / 414x820 / 430x850 as width and height token bands, and every
  matrix viewport resolves to at least one width band and one height band (or the baseline token set).
  Compact-height bands tighten non-interactive spacing only: --touch-min, --cta-h and --dock-row-h are
  identical in every band, so the fit is never bought by shrinking controls. At windowWidth 320 the core
  action target is 44.37 CSS px, and no product font size goes below 20rpx.

  Proof is structural and derived, not asserted. tools/ui02r1-layout-audit.mjs re-parses the committed
  WXSS (base `page` tokens plus every matching media band, with the CSS cascade order honoured) and the
  committed WXML, then prints a per-viewport first-screen budget table. Worst-case RUN_HOME stack +
  34 px reserved safe area vs viewport height: 320x500 -> 412.6+34 <= 500 (53.4 px slack); 360x560 ->
  476.6+34 <= 560 (49.4); 375x603 -> 513.5+34 <= 603 (55.5); 390x750 -> 561.1+34 <= 750 (154.9);
  414x820 -> 626.5+34 <= 820 (159.5); 430x850 -> 650.7+34 <= 850 (165.3). It also proves the pinned
  decision head takes 22.5% of the baseline viewport, leaving the rest to the options.

  POST-REVIEW REPAIR (this commit). The controller/user then opened the project in WeChat DevTools for
  the manual visual QA and the build failed:
  "./pages/v2-preview/v2-preview.wxss(150:1): unexpected token '*'". Root cause: the universal selector
  `* { box-sizing: border-box; }` I had added as a blanket reset is rejected by the WXSS compiler — WXSS
  only accepts a documented subset of selectors, and the universal selector is not part of it. The fix
  is minimal and stays inside the original scope: the `*` rule is deleted, and every box that has a
  definite size AND vertical padding/border now declares `box-sizing: border-box` in its own rule
  (15 boxes). That set is not hand-waved: tools/wxss-compat-audit.mjs DERIVES the requirement from the
  stylesheet (definite size in an axis + non-zero padding/border in that axis, with unresolvable insets
  treated as non-zero so the check fails closed) and requires an explicit box-sizing on each, so a
  future box that silently depends on a global reset is caught. No other construct in the stylesheet
  changed: the file still uses only `page`, element/`.class`/compound-class/descendant-class selectors,
  the parameterless `:active`, and `@media` with `(min|max)-(width|height)` conditions. The layout
  audit's budget numbers are unchanged by the fix (412.6 px at the baseline), which is the check that the
  box model still matches the arithmetic. A second wrapper, tools/wxss-compat-audit.mjs (14 checks), now
  encodes the documented WXSS selector exceptions (no attribute selectors, no parameterised
  pseudo-classes/pseudo-elements), the permitted at-rules and media conditions, the border-box
  requirement above, and a small explicitly-labelled conservative subset (no `position: sticky`, no
  `display: grid`). It is a curated subset check, NOT the compiler, and it says so in its own output;
  the authoritative check remains compiling once in DevTools.

  Also found during that same review: opening the project in DevTools had dropped three untracked
  generated files into this worktree (miniprogram/project.config.json,
  miniprogram/pages/v2-preview/project.config.json, miniprogram/pages/game/game.js). Two of them are
  default project settings and the third is the stock empty DevTools page template; all three are
  genuinely generated, none exists in the task base, and all three were breaking the repo's own
  base-tree digest tests (including the pre-existing tests/ui02.test.mjs). They were moved — not
  deleted — into .b2base/devtools-artifacts/ (git-excluded, with a MANIFEST.json recording sha256 and
  size) so the worktree is back in the base state, and tests/ui02r1.test.mjs now excludes exactly those
  three paths from its digest, with a check that the exclusion removes nothing that is actually present
  in any pinned tree (so a future, different DevTools artifact still fails closed). Note for the
  controller: tests/ui02.test.mjs is NOT excluded-aware and will fail again whenever DevTools is
  reopened; the durable fix is a .gitignore entry, which is outside this task's scope and was not made.

  POST-REVIEW REPAIR 2 (this commit). With the WXSS compiling, the preview page still could not be
  visually reviewed: it rendered "缺少 v2-fixtures.json" while that file was present and complete. Root
  cause: the WeChat runtime cannot require() a .json file. The page did require("./v2-fixtures.json"),
  which threw at runtime, and the surrounding try/catch assigned fixtures = null and discarded the
  error — so a module-load failure was silently re-labelled as a missing data file, and the real cause
  was invisible. Two things were wrong and both are fixed.

  (1) Load path. The fixture is now loaded as the generated static CommonJS module
  miniprogram/pages/v2-preview/v2-fixtures.js, emitted by the new tool
  tools/ui02-preview-fixture-module.mjs. This introduces no second source of truth: the writer imports
  buildPreviewFixtures() from the existing tools/ui02-preview-fixtures.mjs (so the payload still comes
  from the real chain generateServerDestinyOffer -> reduce(START_RUN) -> ServerViewModelBuilder.build ->
  buildWeChatPageShell -> mapCoreActionIntents/mapSpecialActionIntents -> buildArchiveView), it declares
  only node:fs, node:path and that one local import (asserted by test, so it cannot re-implement the
  projection), and it serializes exactly the same canonical payload as the JSON writer. The committed
  module, the committed JSON and a fresh generator run are asserted equal, and the module's payload is
  asserted byte-equal to the canonical serialization; loading the module in a vm yields the same object.
  The JSON sibling is retained because tests/inspection use it and because the pre-existing ui02 suite
  compares against it, and the two can no longer drift.

  (2) Diagnostics. A load failure now produces an explicit staged failure instead of a missing-file
  claim: stage `module` (the require threw), `shape` (the export has no states/variants collections) or
  `view` (the fixture does not carry the requested view). The panel renders stage, error name, a
  sanitized one-line summary, the documented module specifier and a CLI hint. Sanitization is bounded
  and behavioural: absolute Windows paths and deep repo paths are replaced with <path>, whitespace is
  collapsed, the summary is capped at 160 characters, and no fixture content, raw state or environment
  detail is rendered. The `view` stage also lists the fixture's key names (keys only) so a blank page
  can never be the outcome. A test extracts the page's own sanitizer and runs it, rather than trusting a
  regex over the source.

  Note on the earlier DevTools-artifact tolerance: opening DevTools again re-created
  miniprogram/pages/game/game.js and additionally rewrote the tracked root project.config.json and
  project.private.config.json (content, not just line endings) and created miniprogram/.vscode/. None of
  these are committed. The base-tree pins were strengthened in this repair from counts to exact file
  lists, so the digest now fails closed on any unreviewed addition inside a pinned tree while still
  tolerating the three documented DevTools scratch paths.

  Third repair — the loading point was not statically analysable. After the two repairs above the WXSS
  compiled again, and the manual visual review then failed with
  "module '<path>' is not defined, require args is './v2-fixtures.js'". Root cause: the load point was
  written as require(FIXTURE_MODULE_SPECIFIER). The WeChat packager builds the page's dependency graph by
  STATIC ANALYSIS of the source, so it only bundles a require() whose argument is a plain string
  literal; a variable argument registers no dependency and dies at runtime. Node's module system accepts
  a computed require without complaint, which is exactly why the previous suite could not see it — this
  page has now been caught three times by something only the real compiler or the real runtime could
  produce.

  The behavioural fix is one line: the load point is now the literal require("./v2-fixtures.js").
  FIXTURE_MODULE_SPECIFIER keeps exactly one job — labelling the failure panel — and the suite asserts it
  stays equal to the literal actually required, so a diagnostic can never name a module the page does not
  load. The guard is deliberately syntactic rather than behavioural: a codeMask-based scanner (comment
  bodies and string literals are data, not code — which also stops the generated module's own header
  prose "cannot require() a .json file" from being read as a call) walks every require() in every
  miniprogram module and rejects any argument that is not a plain string literal, fail-closed on
  concatenation, template literals and array/function arguments. It runs against the real entry point and
  all other miniprogram modules, its negative controls rewrite the real call site back to the variable
  form using offsets returned by the scanner (the file also DOCUMENTS the literal in a comment, so a
  naive string replace would have mutated the comment instead), and the same verifier is wired into the
  CLI, so `node tools/ui02-preview-fixture-module.mjs` now checks freshness AND the require contract.
  The fixture generation chain, the payload and the module contents are untouched: the module is still
  byte-equal to a fresh generator run and still equal to the committed JSON.

  FOURTH REPAIR (this commit) — the fixture loaded but the product surface rendered nothing. With the
  WXSS compiling and the fixture loading, the manual DevTools review of attempt 3 showed the failure
  panel gone and the debug overlay reading a real vm.gatedEntries list, while RUN_HOME / EVENT /
  SPECIAL_NODE / LIFE_ARCHIVE were all completely blank. Root cause, stated by the controller and
  confirmed here: a shape mismatch between what present() produced and what the WXML tested. present()
  returned a base object carrying `pageState` but no top-level `kind`, while every product branch in the
  WXML switches on `vm.kind`. `vm` was therefore non-null and fully populated and all four product
  branches still evaluated false — a blank product surface with NO error, and no failure panel to
  complain, because nothing had actually failed.

  This is a third member of the same family as T4/T5: the previous suite asserted that the markup
  CONTAINS `vm.kind === 'RUN_HOME'` / `'EVENT'` / `'SPECIAL_NODE'` / `'LIFE_ARCHIVE'` branches, but never
  that present() could satisfy one of them, so text-level assertions about both halves passed while the
  contract between them was broken.

  Fix (smallest consistent one). A single presentation map, PAGE_KIND_BY_PAGE_STATE, translates the
  server-authoritative `pageState` into the product page kind the markup switches on, and present() now
  emits it as the top-level `vm.kind` alongside the untouched `pageState`. The two vocabularies are not
  identical — page-state.ref lists both ENDING and LIFE_ARCHIVE as distinct page states, and the
  generated fixture's ended run carries `pageState: "ENDING"` — so the translation is explicit and
  documented rather than implicit in the markup, which is why using `entry.pageState` directly would
  itself have been wrong: LIFE_ARCHIVE would have rendered blank instead of RUN_HOME becoming visible.
  The RUN_HOME variants (RUN_HOME_BREAKTHROUGH_BLOCKED / RUN_HOME_NO_PLATFORM_CAPABILITY) carry
  `pageState: "RUN_HOME"`, so they project kind RUN_HOME and therefore render the RUN_HOME page with the
  RUN_HOME projection — a fixture key is never used as a kind, which is asserted. A fixture entry whose
  page state has no product page now fails closed (present() returns null) and the view stage diagnostic
  says so explicitly, instead of silently emitting a view the markup would drop.

  Guard. tests/ui02r1.test.mjs gains a dedicated `UI02R1_kind` group that is behavioural rather than
  textual: it loads the page module in a vm sandbox with its require shimmed to the real generated
  fixture module, extracts the discriminator vocabulary from the committed WXML, and compares the two.
  (1) It runs the real fixture through the real present() for all four states and both variants and
  requires every emitted kind to match a WXML branch, and every WXML branch to be reachable — the exact
  defect (kind undefined) is reported as "no WXML branch can be true, the surface is blank".
  (2) It asserts `pageState` is still reported verbatim, that the ended run keeps kind LIFE_ARCHIVE
  despite pageState ENDING, that one page state never forks into two product pages, and that the variants
  project kind RUN_HOME with a RUN_HOME payload. (3) It drives the page's own onLoad/onSelectTab handlers
  for every dev tab and requires failure === null and a vm.kind matching a WXML branch, which is the
  closest automated reproduction of what the human saw. (4) Six negative controls prove the guard is not
  vacuous: a missing kind, the raw server vocabulary leaking in (ENDING), a variant key used as a kind,
  an absent projection, an unreachable WXML branch, and — most importantly — the same defect reproduced
  by deleting the kind assignment from the COMMITTED page source, which the guard must reject on the real
  fixture. The guard compares cross-realm values, so the page's own tab list is re-materialized before
  the strict comparison.

  No gameplay, projection, contract, Core, Content, Director or transport code was touched, and UI03 was
  not started. No new dependency was added; the guard reuses node:vm and the existing fixture module.

