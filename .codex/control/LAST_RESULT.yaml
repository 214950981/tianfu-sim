summary: >-
  Fixed the v2-live terminal-chain wx:else leak. The fallback block at the bottom of the ready
  surface was an unconditional wx:else attached to the TERMINAL condition chain (the NEXT_LIFE
  wx:elif), not to the destiny/home/decision chain. Every non-terminal state therefore fell through
  the terminal chain into the fallback, so DESTINY_OFFER rendered its offered candidates AND the
  unrelated "server projection" note. The fallback is now an explicit negated condition that can only
  match a page state no view claims.

changedFiles:
  - miniprogram/pages/v2-live/v2-live.wxml
  - tests/livefix05.test.mjs
  - .codex/control/LAST_RESULT.yaml

changes:
  - file: miniprogram/pages/v2-live/v2-live.wxml
    what: >-
      Replaced the terminal chain's trailing <view wx:else class="block"> with
      <view wx:if="{{!vm.isOffer && !vm.isHome && !vm.isDecision && !vm.isTerminal}}" class="block">.
      An wx:if opens its own chain, so the block is now evaluated on its own condition instead of
      inheriting the terminal chain's fall-through. Added a comment recording why it must not become
      a wx:else again. Body copy, pageStateLabel binding and the block's class are unchanged.
  - file: tests/livefix05.test.mjs
    what: >-
      New narrow WXML regression suite, 6 tests. Models real WXML chain semantics (a run of
      wx:if/wx:elif/wx:else siblings where exactly one member renders) over the direct children of the
      ready-surface container, then asserts: no known page state renders the fallback (8 states); only
      an unknown state does; the fallback is a wx:if chain head negating all four view discriminators;
      the original terminal-chain wx:else leaks on exactly DESTINY_OFFER/RUN_HOME/EVENT/SPECIAL_NODE;
      and every server-projected option, handler binding and terminal/next-life CTA is preserved.
      The negative control is an anchored single-token mutation that is asserted to have applied.

