blockers:
  - id: createRunOffer-drops-terminal-sidecar
    severity: P1
    where: server/src/live-service.ts — TianfuLiveService.createRunOffer (generated into
      cloudfunctions/tianfu2/runtime/server-live-service.js)
    evidence: "after three real advanceTerminal RPCs the stored run carries
      terminal.stage=NEXT_LIFE/version=3. `createRunOffer` with that run's bootstrap id returns
      view.state.pageState='ENDING' and view.state.terminal=undefined; `fetchView` on the same runId
      returns pageState='NEXT_LIFE' with the full terminal projection (lifeBook + rebirthResult +
      nextLife). The v2-live page consumes the createRunOffer view (initialView) and then calls
      restore(), which skips load() because a view is already present — so the reload renders ENDING."
    why-it-blocks: "the acceptance criterion 'reload-recovers-old-run-at-NEXT_LIFE' cannot pass, and in
      production a player who reloads on NEXT_LIFE is stranded on ENDING with no CTA and with every
      further advanceTerminal rejected by the authoritative-stage guard."
    recommendedFix: "return the terminal sidecar from the createRunOffer transaction for both
      existing-run paths (mapped bootstrap and existing runId) and pass it to the projection, i.e.
      `view: this.#builder.build(settled.state, settled.terminal)`, mirroring what the gateway's
      fetchView path already does. Requires 1 cloud-runtime regeneration + 1 wechat-runtime
      regeneration, 1 typecheck, and a rerun of ui04e-r2 / ui04e-r1 / ui04e plus the artifact
      freshness/audit/smoke gates — i.e. a budget this task does not have."
recommendedFixNextTask: "UI04E_R3 — carry the terminal sidecar through the createRunOffer bootstrap
  projection, regenerate both runtime artifacts, then run tests/ui04e-r2.test.mjs unmodified: it is
  already the acceptance proof and needs no edit once the projection is fixed."
toolingObservations:
  - finding: "A page-level WeChat page harness (node:vm CommonJS realm + Page/wx stubs, adapted from the
      UI04C `loadLivePage` recipe) can drive the real v2-live page against the real cloud host handler
      when the transport seam JSON-round-trips both the request into and the response out of the page
      realm (the documented cross-realm payload rule). Storage stubs must also implement
      `removeStorageSync`, because the pending-bootstrap lifecycle clears its key on success."
    impact: reusable
    workaround: n/a
  - finding: "A lost-response simulation is best modelled inside the transport seam, not inside the
      handler: call `handler.main(data)` first (the host commits for real) and then throw. That is the
      only way to prove the client-side invariants of a commit the client never saw."
    impact: reusable
    workaround: n/a
  - finding: "`WeChatRunController.restore()` deliberately does not re-fetch when an initial view is
      present, so a page that bootstraps through `createRunOffer` renders exactly what that RPC
      projected. Any server projection gap in createRunOffer is therefore directly user-visible after a
      reload. This is how the R2 proof surfaced the terminal-sidecar gap that R1's suite missed: R1
      called `controller.load()` explicitly, which fetches the authoritative view and masks the gap."
    impact: high
    workaround: n/a
