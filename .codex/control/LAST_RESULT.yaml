recommendedCommitMessage: |-
  feat(ui02entry): add high-fidelity 2.0 entry flow to the dev preview

  Presentation-only UI_FAST_LANE slice that extends the accepted UI02R2A2 visual
  system to START -> MODE_SELECT -> DESTINY_OFFER -> RUN_OPENING, so the 2.0 game
  reads as one product from launch through entering a life. No Core, Content,
  Director, server projection, shell intent mapping, application UI controller,
  route or legacy 1.0 page change; UI03 live wiring is not started.

  One generated truth:
  - the entry fixtures come from the same production chain as the accepted in-life
    fixtures (generateServerDestinyOffer -> reduce(START_RUN) ->
    ServerViewModelBuilder.build -> buildWeChatPageShell) plus
    projectDestinyOfferView; a test rebuilds the dev offer independently and
    asserts equality.
  - DESTINY_OFFER renders only the public candidate fields and exposes no seed,
    RNG state, draw index, weight, odds, difficulty or rule internals.
  - MODE_SELECT invents no mode: it reads availability from the accepted shell
    capability projection and gates disabled entries visibly.
  - RUN_OPENING formats only public selected profile / run data and resolves
    nothing. START reads no state and uses documented copy only.

  Structural decision: the pre-run screens live in a new `entry` fixture
  collection instead of `states`, because START and MODE_SELECT precede any
  authoritative run and have no PageState to project; `states` therefore stays
  exactly "server-authoritative pages".

  One-screen policy stays structural: each screen is a .page flex child of
  .surface; the two list regions reuse the accepted bounded-scroll pattern; no new
  media band; no frozen token, interaction floor or readability floor changed.
  The layout audit gains a second per-screen budget table summed from the real
  tokens (worst case at 320x500: DESTINY_OFFER 351.6px + 34px safe-area of 500px).

  Two shared fixtures were regenerated on purpose (the generator and
  v2-fixtures.json), so the two digest pins for them in tests/ui02r1.test.mjs were
  updated on purpose; every other pinned tree is untouched. New
  tests/ui02entry.test.mjs (20 tests) pins the flow, the public-offer boundary,
  the capability gating, the one-screen budgets, the copy provenance, that every
  pre-run binding resolves (so a mistyped binding cannot render blank), and the
  no-regression scope, with six negative controls.

  Fast lane: ui02entry 20/20, ui02r2a2 15/15, ui02r2 15/15, ui02r1 32/32,
  ui02 18/18, viewmodel-ui 6/6, layout audit 143/143, wxss compat 14/14, fixture
  freshness green, tsc 5.9.3 clean. Full npm regression is deliberately deferred
  until after human visual acceptance and before the final UI02 merge.

  Manual visual QA in DevTools is required and is recorded as not performed;
  UI03 stays blocked.
