summary: >-
  UI02R2A2 is a presentation-only recomposition of the 2.0 dev preview RUN_HOME. Every UI02R1/UI02R2
  structural contract is preserved verbatim: no page-level vertical scroll, the four core action
  intents and their 2x2 dock, the server-gated breakthrough CTA, the at-most-three attention summaries
  plus one condition row and their read-only drawers, the safe-area reservations, the scroll ownership
  boundaries, the touch-target floor and the 20rpx readability floor. No Core, Content, Director,
  server projection, shell intent mapping, application UI controller, route or legacy 1.0 page was
  touched, and v2-preview.js was not modified at all, so the UI02R2 Chinese presentation-label layer
  and its verbatim fallback are intact by construction.

  What changed is grouping, hierarchy and rhythm, to answer the three visual findings:

  - Grouped surfaces with distinct roles. The hero becomes a raised identity plate carrying the single
    cinnabar left edge on RUN_HOME; vitals becomes one raised card with a full hairline edge and shared
    horizontal inset, so 修为 / 道基 / 灵石 read as three readings of one cultivation-status component
    instead of three table columns; the priorities region becomes an inset sunken panel; the four core
    actions sit on one recessed tray so the group reads as a single operation cluster.
  - Compact identity treatment. The realm order becomes a bordered dark-gold chip rather than a loose
    line of text, and the lifespan becomes a rounded, clipped gauge rather than another numeric line.
  - The dead middle gap is closed by RESPONSIVE ALLOCATION, not by scrolling. The priorities panel is
    the only flexible box on RUN_HOME, so everything the content above and the dock below do not use
    previously landed there as an empty field: 136.2px at 390x750, 139.6px at 414x820 and 144.6px at
    430x850. The tall bands (min-height 750 / 820) now give that height back to the content itself by
    raising the non-interactive rhythm tokens. The leftover flexible height drops to 26.0 / 24.8 /
    25.4px, i.e. 3.0-3.5 percent of the viewport, while the worst case still fits.

  Honesty about the budget: every unit of height added is expressed through the same tokens that
  tools/ui02r1-layout-audit.mjs sums, so the audited first-screen budget remains a true value and not
  an approximation. No new media band was introduced; the band list is still exactly the six UI02R1
  bands, which tests/ui02r2a2.test.mjs pins. Interaction floors never shrink below the baseline at any
  viewport, which that test also pins per viewport.

