toolingObservations:
  - id: T1
    severity: ENVIRONMENT
    title: the sandbox silently deletes git ref updates outside the workspace
    evidence: >-
      The shared .git lives at C:/Users/Administrator/Documents/GitHub/tianfu-sim/.git, outside this
      worktree. Any git command that updates a ref (reset --hard / reset --mixed / commit) reported
      success but left refs/heads/workbuddy/dev-tianfu-2-0-aba5449b absent, so HEAD became unborn
      immediately afterwards. Object and index writes in the same repository succeeded normally
      (git cat-file could read the commit that git commit had just created).
    workaround: >-
      Created the base commit state with object-only plumbing (git add -> git write-tree ->
      git commit-tree -p <base>) and wrote the branch ref file directly, verifying
      git rev-parse HEAD and git log afterwards. git push is unaffected. This is a sandbox property,
      not repository corruption: refs/heads/dev/tianfu-2.0 and refs/heads/main were never touched and
      git ls-remote still shows the source branch unchanged at dc5675d6.
    impact: "No effect on the submitted tree or on the pushed work branch."
  - id: T2
    severity: NOTE
    title: tools/scan-secrets.mjs matches the literal word "token" followed by a quoted string
    evidence: >-
      A layout-descriptor field named token: "--screen-pad-top" tripped the
      (api_key|secret|token|password)[:=]"..." pattern and failed the gate. The field was renamed to
      cssVar. Worth knowing because the name "token" is natural for CSS custom-property tables.
    impact: "Informational; no action required unless a future task hits it again."
  - id: T3
    severity: PROCESS
    title: >-
      the WXSS compiler is stricter than "most CSS", and the repo's base-tree digest tests are
      fragile against WeChat DevTools scratch output
    evidence: >-
      (a) `* { box-sizing: border-box; }` aborted the DevTools build with
      "unexpected token '*'" even though the WXSS documentation says most CSS selectors are supported;
      the universal selector is one of the exceptions in practice. Nothing in the previous verification
      could have caught it, because no WXSS compiler exists in this repo — which is why this repair
      also adds tools/wxss-compat-audit.mjs and its negative controls.
      (b) Simply opening the project in DevTools wrote three untracked files into the worktree
      (miniprogram/project.config.json, miniprogram/pages/v2-preview/project.config.json,
      miniprogram/pages/game/game.js). tests/ui02.test.mjs and the new tests/ui02r1.test.mjs both hash the
      working directory, so they failed on the polluted tree before any code was changed.
    impact: >-
      (a) Mitigated: the border-box requirement is now derived from the stylesheet and enforced.
      (b) Mitigated only for tests/ui02r1.test.mjs, whose base-tree pins now compare exact file lists
      with a narrow, self-checking exclusion for the three observed DevTools paths. The pre-existing
      tests/ui02.test.mjs is still directory-hashing and therefore fails whenever DevTools is reopened;
      recommend the controller add the DevTools artifacts to .gitignore, or scope the ui02 digest check
      to the base file list in a follow-up task. Not done here because it is outside UI02R1's scope.
      A second DevTools session confirmed the pollution is not a one-off: it re-created
      miniprogram/pages/game/game.js, additionally rewrote the tracked root project.config.json and
      project.private.config.json (content and line endings) and created miniprogram/.vscode/launch.json.
      None of those were committed.
  - id: T4
    severity: RUNTIME
    title: the WeChat mini program runtime cannot require() a .json file
    evidence: >-
      miniprogram/pages/v2-preview/v2-preview.js did require("./v2-fixtures.json"). In the WeChat
      runtime that does not resolve, so the call threw; the surrounding try/catch set fixtures = null
      and discarded the error, and the page reported a missing fixture file while the file was present
      and complete. Nothing in a Node-based test suite can observe this, because Node resolves JSON
      requires happily (and this repo runs with "type": "module", so the same v2-fixtures.js file is ESM
      to Node and CommonJS to WeChat — a Node import of it would fail for the opposite reason).
    impact: >-
      Fixed by emitting the fixture as a generated CommonJS module and adding tests that pin the load
      path, the payload equality and the error reporting. This class of bug is invisible to Node-only
      verification and is exactly why the manual DevTools pass in manualVisualQaRequired is step 0.
  - id: T5
    severity: RUNTIME
    title: the WeChat packager needs a static literal require argument; a variable argument is not a dependency
    evidence: >-
      The page loaded the fixture as require(FIXTURE_MODULE_SPECIFIER). It compiled, typechecked and
      passed every Node test, then failed in DevTools with
      "module '<path>' is not defined, require args is './v2-fixtures.js'". The packager builds the
      dependency graph by statically analysing the source, so only a plain string literal registers the
      module; a variable argument resolves to nothing and the module is never bundled. Node accepts a
      computed require without complaint, so no Node-based test could observe this — the same structural
      blind spot as T4, in the same three lines of code.
    impact: >-
      Fixed by restoring the literal and adding a syntactic guard (a comment- and string-aware scanner
      that rejects any non-literal require argument in any miniprogram module), wired into both the test
      suite and the CLI verifier, with positive and negative controls. The general lesson for this repo:
      anything that only the WeChat compiler or runtime evaluates (WXSS syntax, module resolution,
      require analysability) is outside the reach of the automated suite, so each such rule needs either
      a DevTools pass or a deliberately curated source-level guard with its own negative controls.
  - id: T6
    severity: PROCESS
    title: >-
      a projection whose shape the markup silently rejects renders a blank surface with no error, and
      text-level assertions about both halves cannot see it
    evidence: >-
      Attempt 3 shipped a page whose present() returned `pageState` while every WXML branch tested
      `vm.kind`. `vm` was non-null and complete, the fixture loaded, the failure panel never appeared
      and every product branch was false, so the surface was blank. Nothing had failed, so no diagnostic
      fired; the previous suite asserted that the markup contains `vm.kind === '...'` branches and
      separately that present() builds runHome/decision/archive, and both assertions were true — the
      contract BETWEEN them was the untested part. This is the third consecutive defect on this page that
      the Node suite could not see (T4 runtime require, T5 packager require analysis, T6 projection/markup
      shape agreement).
    impact: >-
      Fixed by making the discriminator explicit and derived from the authoritative page state, and by
      adding an execution-level guard that compares the produced discriminator with the branch the markup
      actually tests, with a negative control built from the committed source. The durable rule for this
      repo: whenever one module produces a value that another module switches on, assert the two agree by
      running both, not by grepping for both. A generated presentation vocabulary is a contract and
      belongs in a table with a test, not inline in the markup.

