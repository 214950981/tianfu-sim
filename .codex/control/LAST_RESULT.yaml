changes:
  director.ts:
    - Removed the sceneCoreActorIds content/role re-derivation helper completely.
    - Added coreNpcRepeatGate(state: GameState, coreActorIds: readonly string[]): boolean; reads only state.run.director.recentScenes.at(-1).actorIds.
    - Added one early return in scoreDirectorEvent immediately after the existing no-core-npc check; P4 only, exclusionReason "core-npc-repeat-gate".
    - Net +11 -0. No weight, constant, precedence, scoring, ordering or RNG change.
  reducer.ts:
    - Added selectedCauseActorIds(state, causeId); resolves state.run.causes.byId[causeId] and returns the deduped Object.values(cause.actorIdsByRole), or undefined when no causeId is available.
    - Both P3 recordDirectorScene call sites now pass causeId plus actorIds when resolvable, and omit actorIds exactly as before when not.
    - Net +20 -2. No Cause lifecycle/selection semantic change and no triggeringCause binding change.
  director.ref:
    - P4 additionally excludes a candidate whose matched core actor ids intersect the core actor ids of the single most recent DirectorSceneRecord ("core-npc-repeat-gate").
    - States plainly that the gate reads DirectorSceneRecord.actorIds verbatim and nothing else, that it consults only that one record, that it changes eligibility only, and that P3 echo provenance is the exact selected CauseInstance.actorIdsByRole rather than a templateId/role/salience/uniqueness lookup or a re-derivation from Event tags.
  director.test.mjs:
    - Updated the stale "recent NPC continuity contributes score without mutating NPC" test to assert exclusionReason "core-npc-repeat-gate".
    - Added coverage that the gate is P4-only (never P5/P6) and that an intervening non-matching scene reopens it. Now 47 tests.
  loopfix02b3.test.mjs:
    - Dedicated suite, 19 tests (B3-A..B3-S).
    - Added echoViaReducer, which drives the real reducer to a P3 echo by injecting an eligible CauseInstance with an explicit actorIdsByRole, so provenance is exercised at the real seam.
    - B3-F/B3-G rewritten to use echoViaReducer; the prior hand-built P3 scene with actorIds [] genuinely carried no actors under the corrected design.
    - B3-P proves two active core NPCs share a role and the role index holds both (wanderer[0] is the sorted-first instance the old heuristic would have bound).
    - B3-Q/R prove the recorded actor is the cause-bound one and that a same-role sibling is neither gated nor mis-bound.
    - B3-S is a source-level assertion that sceneCoreActorIds is gone, the gate takes no content handle, the gate reads previous.actorIds, and neither the gate nor the reducer helper contains a content lookup.
  package.json:
    - Added "test:loopfix02b3": "node --test tests/loopfix02b3.test.mjs".
    - Appended tests/loopfix02b3.test.mjs to the aggregate "test" script file list.
