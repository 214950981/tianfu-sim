      不新增任何玩法语义，未命中即省略字段，绝不把 id 当名字输出。
  - file: miniprogram/pages/v2-live/v2-live.js
    what: >-
      B1：新增 CULTIVATION_FULL_BPS / BREAKTHROUGH_REASON_LABELS / GOAL_COPY / BREAKTHROUGH_UNKNOWN_REASON
      与首页 goal 区块（rootName、cultivationGap、remainingLifespan、injuryLevel、goalLine/goalTone、
      breakthroughReason/Target），全部读服务器投影，不计算胜率。B2：buildResultReceipt 读
      narrative.appliedTier，按 settle.<choiceId>.<tier> → settle.<choiceId> 回落解析过程文案；
      buildTimeline 为每条记录附 settledText。B4：deathDetail 区分寿尽与提前终结，未知 directCause 退化为
      「已记录的风险」而非旧的「原因尚未明确」。
  - file: miniprogram/pages/v2-live/v2-live.wxml + v2-live.wxss
    what: >-
      结果面板在「你选择了什么」与「真实变化」之间插入 result-narration；人生书增加 archive-settled 行；
      「第 N 节点」改为「第 N 事」；三个重复的黑色决策按钮删除，选项卡片本身成为点击目标；
      ENDING 与人生书的死因改为 deathDetail。新增 .result-narration / .archive-settled / .option-card:active。
  - file: packages/content/src/content01-v1.ts
    what: >-
      新增 settlements / tierSettlements / riskOutcomes / prepBuild 四个可选字段。二十场中 18 场为每个合法
      选项授权一条结算过程句；2 场风险场按 success/costlySuccess/failure 分层授权并分层赔付（失败不再发
      奖励）；剑修/丹修两场的「先看准落点/记牢两味」与「退开/不再细辨」经 prepBuild 门控改为记进度或耗
      时间，共用模板的其它事件效果逐字节不变。小交易的选项 id 保留为 sell-herbs：重命名选项 id 对旧存档是
      breaking，且合同只要求改措辞（不假设初始物品库存）。
  - file: miniprogram/pages/v2-live/content01-zh-cn.js
    what: >-
      由 tools/content01-zh-cn-module.mjs 从 CONTENT01_ZH_CN 重新生成：340 → 388 键，新增 48 条 settle 文案。
      freshness gate 通过（up to date）。
  - file: tests/playfeel01.test.mjs
    what: >-
      新增 11 项定向测试：真实 CommandGateway 结算驱动的结果面板叙事；风险场分层叙事与回落；未授权场景不
