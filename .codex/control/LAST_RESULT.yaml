toolingObservations:
  - finding: ".codex/context.mjs strict allowlist rejects the new task-definition metadata fields (executionProfile, executionBudget). The loader sees them as MALFORMED_TASK: unknown field. The fields are purely informational (no loader semantics); the task contract is otherwise well-formed and the implementer reads the file directly. No source code change to the loader is required today; the implementer recommends the loader add the two names to ALLOWED_FIELDS in a future maintenance pass so future tasks do not need the workaround."
    impact: low
    workaround: read the task file directly; loader is optional
  - finding: "Server-side advanceTerminal no longer needs entropy / metaView / offerFixture / schemaVersion. Dropping these from AdvanceTerminalContext made the sidecar-only boundary explicit at the type level."
    impact: informational
    workaround: n/a
  - finding: "parseAdvanceTerminalResult silently drops any nextBootstrapId / nextRunId a hostile or legacy server injects. The contract is this RPC does not own next-run creation, not this RPC must reject next-run identifiers."
    impact: informational
    workaround: n/a
  - finding: "WeChatRunController.startNextLife requires a caller-supplied bootstrap id (the persisted pending id) — it no longer auto-generates one. A future helper that mints the id inside the controller would silently break the retry/reload semantics; the source-level UI04E_R1 test enforces the page-side persistence."
    impact: informational
    workaround: n/a
recommendedCommitMessage: |
  UI04E-R1: separate terminal arrival at NEXT_LIFE from the explicit start-next-life action — advanceTerminal becomes a pure sidecar-only presentation transition, the page exposes a 开启下一世 CTA backed by a persisted pending-bootstrap lifecycle, and the rejected UI04E premature next-run creation is removed end-to-end