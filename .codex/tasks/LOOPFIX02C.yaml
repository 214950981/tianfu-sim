id: LOOPFIX02C
title: LOOPFIX02C — Contextual Pacing / P6 Reachability
phase: 2
requiredContracts: [.codex/contracts/director.ref,.codex/contracts/state.ref,.codex/contracts/reducer.ref,.codex/contracts/event.ref,.codex/contracts/rng.ref,.codex/contracts/crosslayer.ref]
