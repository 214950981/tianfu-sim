  - P4-eligibility-and-same-core-NPC-repeat-gate-unchanged
  - P6-selection-occurs-when-P4-is-empty-and-P5-is-contextual-gap-gated
  - P5-remains-reachable-and-is-not-blanket-suppressed
  - gate-consumes-zero-RNG-and-adds-no-state
  - exactly-600-post-change-runs-complete-deterministically
  - P6-observed-at-least-once-in-600-runs
  - same-core-NPC-consecutive-P4-violations-remain-zero
