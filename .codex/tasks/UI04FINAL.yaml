  - if aggregate final audit reproduces only the known nested-process sandbox failure signature, re-establish the minimum final-audit proof required by PROTOCOL/TOOLING_RUNBOOK in one bounded batch; do not repeat untouched-base investigations multiple times
  - if final audit finds a bounded UI04-scope regression, fix it in the same work branch with targeted test first, then rerun the affected final gate; aggregate full suite may be rerun at most once after the fix
  - do not run 600-run simulation unless gameplay/Core/Content semantics are actually modified; UI/server/presentation/infrastructure-only changes do not require it
  - update final docs so dev-status records UI04E and UI04FINAL acceptance evidence, deployment readiness, known environment caveats, and remaining manual cloud/DevTools steps
  - update LAST_RESULT with concise final evidence, merge-readiness, resourceUsage, changedFiles and zero undeclared .workbuddy artifacts
