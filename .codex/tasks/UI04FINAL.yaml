  - first repair the known bootstrap recovery defect: TianfuLiveService.createRunOffer must preserve the complete StoredRun including terminal sidecar on mapped-existing and deterministic-existing recovery paths and project it through the same terminal-aware builder path as fetchView
  - newly generated offered runs may also be represented/projected through the same StoredRun path to keep one projection rule
  - keep bootstrap idempotency, authoritative OPENID-derived player identity, runId derivation, entropy, terminal sidecar, terminalTransitionId exactly-once, and NEXT_LIFE pending-bootstrap semantics unchanged except where required to fix a newly proven in-scope defect
  - make the existing ui04e-r2 real page-level proof pass without diagnostic controller.load workarounds: old bootstrap reloads to authoritative NEXT_LIFE, first CTA persists pending, server commits new run then response is lost, reload recovers old NEXT_LIFE, retry reuses same pending, exactly one new run is recovered, success promotes/clears and renders DESTINY_OFFER
  - preserve the accepted terminal contract ENDING -> LIFE_BOOK -> REBIRTH_RESULT -> NEXT_LIFE -> explicit start-next-life -> fresh DESTINY_OFFER with prior run immutable
  - if the targeted terminal/client/server chain reveals another bounded UI04 implementation bug, fix it in this same task rather than stopping for another micro-task, provided the fix does not change gameplay balance/Core rules/Content semantics
  - once all targeted implementation tests are green, stabilize source and regenerate required generated artifacts once: cloudfunctions/tianfu2 runtime for server changes and miniprogram/runtime only if client-safe source changed
  - then run the UI04 milestone final audit as one end-stage batch, not after each edit
