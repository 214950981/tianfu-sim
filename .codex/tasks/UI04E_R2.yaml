allowedScope:
  - use rejected-candidate R1 commit fcb930b64cecc5c13e3eb8c784af72f44978c1b8 as a one-time transplant source; carry its product/runtime/docs/test changes but exclude every .workbuddy path
  - do not reimplement UI04E or R1 from scratch and do not alter product source unless the new functional proof exposes a real bug
  - add a dedicated functional proof for the exact acceptance gap: start from a real old run at authoritative NEXT_LIFE and local storage containing the old current bootstrap with no pending bootstrap
  - exercise the actual v2-live pending-bootstrap lifecycle through a page-level or equivalent behavioral harness, not source-string inspection alone
  - on the first explicit start-next-life action, persist one pending bootstrap before invoking createRunOffer
  - have the real fake-cloud handler commit createRunOffer for that pending bootstrap, then simulate loss of the response before the page/controller receives success
  - after the lost response assert the current bootstrap is still the old run key, the pending bootstrap is still present, and the database contains exactly old run plus one new run
  - simulate a page/controller reload using the same local storage and cloud database; bootstrap must still recover the old terminal run/NEXT_LIFE because current bootstrap was not promoted
  - on the next explicit start-next-life CTA reuse exactly the same pending bootstrap; createRunOffer must return the already-created new run rather than create another
  - after successful recovery assert exactly two run documents remain, authoritative playerId is unchanged, new runId differs from old, current bootstrap is promoted to the pending id, pending key is cleared, and rendered view is DESTINY_OFFER
  - run the existing ui04e-r1 suite once to prove the candidate implementation remains intact
  - run context-loader once and prove UI04E_R2 loads with verificationProfile and executionProfile normally
  - if the new proof passes without product-source changes, do not regenerate client/cloud runtime artifacts and do not run typecheck/lint/secret/content suites again; rely on the already-green R1 evidence for the byte-identical candidate tree
  - update LAST_RESULT with concise evidence and resourceUsage counts; do not add .workbuddy memory/log files
