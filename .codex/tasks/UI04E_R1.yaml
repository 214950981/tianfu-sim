allowedScope:
  - use rejected UI04E result commit e978ac0619a1c71d25454eb1705d75c7543d33b7 only as implementation reference or transplant source; it is not accepted and must not be treated as source truth over this task
  - carry forward the valid UI04E terminal sidecar, public projection, advanceTerminal exactly-once, ownership, cloud runtime and four-stage rendering work while correcting the NEXT_LIFE start boundary below
  - REBIRTH_RESULT -> NEXT_LIFE must be a pure terminal presentation transition only: update the old run terminal sidecar/receipt and nothing else
  - remove next-life run/bootstrap creation from server/src/terminal-flow.ts and from the advanceTerminal transaction path
  - advanceTerminal success for NEXT_LIFE must not create or return nextBootstrapId or nextRunId and terminal transition receipts must not own next-life creation data
  - NEXT_LIFE must remain an authoritative visible page after the transition and expose an explicit user CTA labelled/semantically equivalent to 开启下一世
  - implement the explicit next-life action on the client by using the already-accepted createRunOffer RPC rather than inventing a fifth cloud RPC or a fake GameCommand
  - before calling createRunOffer from NEXT_LIFE, create a new pending next-life bootstrapId exactly once and persist it under a dedicated pending key; if the pending key already exists after a retry/reload, reuse it rather than rotate again
  - keep the current/old bootstrapId unchanged while the createRunOffer request is pending or fails; if the server commits but the response is lost, the next user retry/reload must reuse the pending next-life bootstrapId and recover the same new run through UI04D bootstrap idempotency
  - only after createRunOffer succeeds may the client promote the pending bootstrapId to the current bootstrap key, clear the pending key, switch controller session/runId to the returned authoritative new run, and render DESTINY_OFFER
  - preserve the authoritative playerId from the server; next life must have a different runId and the same playerId
  - old terminal run must remain byte-identical in canonical gameplay state and stay persisted at terminal stage NEXT_LIFE after the new run is created
  - update WeChatRunController startNextLife semantics so it calls createRunOffer with the supplied persisted bootstrapId and does not depend on advanceTerminal carrying next-run identifiers
  - update v2-live rendering/handlers so REBIRTH_RESULT CTA only advances to NEXT_LIFE, and NEXT_LIFE CTA performs the explicit start-next-life action
  - update terminal-flow/viewmodel/client contracts and tests to remove the rejected premature nextBootstrapId/nextRunId coupling
  - add a dedicated UI04E-R1 regression proving no next run exists before explicit NEXT_LIFE CTA, response-loss retry reuses one pending bootstrapId, reload reuses it, success promotes/clears keys, and stage order cannot be skipped
  - regenerate and verify miniprogram/runtime and cloudfunctions/tianfu2/runtime after source changes
  - preserve all valid UI04E acceptance properties: sidecar outside RuleState, pure-stage zero gameplay diff, terminalTransitionId exactly-once, stale/conflicting reuse fail-closed, public-only LIFE_BOOK, no meta reward semantics, cross-player refusal
  - update docs/UI04E_TERMINAL_LIFECYCLE.md to describe the corrected two-step boundary and update LAST_RESULT
  - execute the repair resource-efficiently: use the rejected UI04E commit as a one-time transplant/reference, batch the narrow semantic changes, use test-name-pattern while red, and defer full targeted gates/artifact regeneration until the source is stable
