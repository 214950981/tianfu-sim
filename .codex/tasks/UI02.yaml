id: UI02
title: UI02 — WeChat 2.0 Core-Loop High-Fidelity Visual Slice
phase: 2
requiredContracts: [.codex/contracts/ui.ref,.codex/contracts/viewmodel.ref,.codex/contracts/page-state.ref,.codex/contracts/platform.ref,.codex/contracts/command.ref,.codex/contracts/progression.ref,.codex/contracts/crosslayer.ref]
