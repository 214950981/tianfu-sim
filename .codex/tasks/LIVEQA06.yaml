accept:
  - User does not need to locate any folder or run terminal commands.
  - Only the two intended client files are synced if their local changes allow a safe update.
  - Original dirty files stay unmodified.
  - Read-only page verification is performed when DevTools access exists or is explicitly left for the user.
  - WorkBuddy stops after a single completion or BLOCKED report.
